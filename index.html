<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>抽奖系统 · v6</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  /* ===== 字体 ===== */
  @font-face{
    font-family:'Baloo2'; src:url('art/fonts/baloo2.woff2') format('woff2');
    font-weight:800; font-display:swap;
  }
  @font-face{
    font-family:'NotoBlack'; src:url('art/fonts/noto900.woff2') format('woff2');
    font-weight:900; font-display:swap;
  }

  :root{
    /* ===== 底色：改 --bg 一个值，其余自动跟着走 ===== */
    /* 这里是默认底色下的派生值，换底色时由 applyTheme 重算覆盖。
       不用 CSS 的 color mix 函数，是因为旧安卓 WebView 不认，
       一个值解析失败会连累整套配色。 */
    --bg:#171425;
    --panel:#2a2736;
    --panel2:#373544;
    --line:#4f4c59;
    --ink:#fdfbff;
    --ink2:#cccbcf;
    --ink3:#94939b;

    /* ===== 稀有度（档位从低到高） ===== */
    --r1:#8c94b8; --r1d:#5a6088;   /* 普通  灰蓝 */
    --r2:#4dc45c; --r2d:#2c7f38;   /* 稀有  绿   */
    --r3:#3d9bff; --r3d:#215fb0;   /* 超稀有 蓝  */
    --r4:#b25cff; --r4d:#6d2fb0;   /* 史诗  紫   */
    --r5:#ffb020; --r5d:#c46a00;   /* 传说  金   */
    /* 同色的 rgb 分量，给需要透明度的光效用（rgba 到处都支持） */
    --r0:#a8505a; --r0d:#5e2730;   /* 失败  暗红（炸弹专用，不参与稀有度排序） */
    --r0rgb:168,80,90;
    --r1rgb:140,148,184; --r2rgb:77,196,92;  --r3rgb:61,155,255;
    --r4rgb:178,92,255;  --r5rgb:255,176,32;

    --gold:#ffc93c; --red:#ff5b4a; --green:#4dc45c;

    /* ===== 积木造型 ===== */
    --lift:6px;                    /* 块体厚度 */
    --stroke:4px;                  /* 描边粗细 */
    --ink-stroke:#120f1e;          /* 描边颜色 */
    --r-lg:20px; --r-md:14px; --r-sm:10px;

    /* ===== 弹性曲线 ===== */
    --pop:cubic-bezier(.18,1.6,.4,1);      /* 弹出，冲过头再回 */
    --squash:cubic-bezier(.3,1.9,.5,1);    /* 更夸张的弹 */
    --ease:cubic-bezier(.3,.9,.3,1);

    /* Baloo2 只有拉丁字形，中文必须显式给回退，否则安卓落到细体 */
    --mono:'Baloo2','NotoBlack',ui-monospace,Consolas,
           -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    --disp:'Baloo2','NotoBlack',-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }

  /* ===== 描边字：荒野乱斗的灵魂之一 =====
     不用 -webkit-text-stroke + paint-order：后者在 Chrome/WebView 123
     以前对 HTML 文字无效，描边会盖住填充，小字会被糊成一团墨。
     改用 text-shadow 在圆周上取 12 个点模拟描边，各版本表现一致。
     用法：元素上设 --ow（外扩半径）和 --oc（描边色），再 text-shadow:var(--outline)
     需要额外投影时写成 text-shadow:var(--outline), 0 4px 0 ... */
  :root{
    --outline:
      var(--ow) 0 0 var(--oc),
      calc(var(--ow) *  .866) calc(var(--ow) *  .5)   0 var(--oc),
      calc(var(--ow) *  .5)   calc(var(--ow) *  .866) 0 var(--oc),
      0 var(--ow) 0 var(--oc),
      calc(var(--ow) * -.5)   calc(var(--ow) *  .866) 0 var(--oc),
      calc(var(--ow) * -.866) calc(var(--ow) *  .5)   0 var(--oc),
      calc(var(--ow) * -1) 0 0 var(--oc),
      calc(var(--ow) * -.866) calc(var(--ow) * -.5)   0 var(--oc),
      calc(var(--ow) * -.5)   calc(var(--ow) * -.866) 0 var(--oc),
      0 calc(var(--ow) * -1) 0 var(--oc),
      calc(var(--ow) *  .5)   calc(var(--ow) * -.866) 0 var(--oc),
      calc(var(--ow) *  .866) calc(var(--ow) * -.5)   0 var(--oc);
  }
  .stroked{
    --ow:calc(var(--stroke) / 2); --oc:var(--ink-stroke);
    text-shadow:var(--outline), 0 4px 0 rgba(0,0,0,.45);
  }
  /* 积木块：底部一层深色侧面 */
  .brick{
    border:var(--stroke) solid var(--ink-stroke);
    border-radius:var(--r-md);
    box-shadow:0 var(--lift) 0 var(--ink-stroke), 0 calc(var(--lift) + 8px) 18px rgba(0,0,0,.45);
  }
  body{
    background:var(--bg); color:var(--ink); height:100vh; height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
    font-family:var(--disp);
    display:flex; flex-direction:column; overflow:hidden;
    user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  }
  /* ===== 背景纹理：圆形波点。颜色由 --bg 派生，换底色始终看得见 =====
     以后想换成自定义图片，把 background-image 换成 mask-image 即可 */
  #bgFx{
    position:fixed; inset:-10%; z-index:0; pointer-events:none;
    --dot:#c3c2c6;                    /* 由 applyTheme() 跟着底色重算 */
    --dotSize:13px;                 /* 点直径 */
    --dotGap:104px;                 /* 网格间距 */
    background-image:radial-gradient(circle,
      var(--dot) calc(var(--dotSize) / 2),
      transparent calc(var(--dotSize) / 2 + 1px));
    background-size:var(--dotGap) var(--dotGap);
    background-position:0 0;
    opacity:.10;
    animation:bgFxDrift 31s linear infinite;
  }
  /* 整片朝右下斜着走；位移取两格，无论间距怎么调都无缝 */
  @keyframes bgFxDrift{
    from{background-position:0 0}
    to  {background-position:calc(var(--dotGap) * 2) calc(var(--dotGap) * 2)}
  }
  @media (prefers-reduced-motion:reduce){ #bgFx{animation:none} }
  input,button,select{font-family:inherit}

  /* ============ 通用控件 ============ */
  .btn{
    font-family:var(--disp); font-size:13px; color:#fff; background:var(--panel2);
    border:2px solid var(--ink-stroke); border-radius:var(--r-sm);
    padding:7px 14px; cursor:pointer;
    box-shadow:0 4px 0 var(--ink-stroke);
    transition:transform .1s, box-shadow .1s;
  }
  .btn:active{transform:translateY(4px); box-shadow:0 0 0 var(--ink-stroke)}
  .btn.main{background:var(--gold); color:#2a1d00}
  .btn.danger{color:var(--red); border-color:#4a2a2a}
  .btn.lg{font-size:15px; padding:12px 26px; border-radius:8px}
  .inp{
    background:#15151f; border:1px solid var(--line); border-radius:5px;
    color:var(--ink); padding:6px 9px; font-size:13px; width:100%;
  }
  .inp:focus{outline:none; border-color:var(--gold)}
  .inp.num{font-family:var(--mono); text-align:right}
  kbd{
    font-family:var(--mono); background:#2a2a38; border:1px solid #3a3a4c;
    border-radius:3px; padding:1px 6px; color:var(--ink2); font-size:11px;
  }
  @media (pointer:coarse){ .btn{font-size:14px; padding:10px 18px} }


  /* ============ 编辑器：右侧抽屉 ============ */
  #editor{
    position:fixed; top:0; right:0; height:100%; z-index:150;
    width:min(470px, 94vw);
    display:flex; flex-direction:column; overflow:hidden;
    background:var(--bg); border-left:1px solid var(--line);
    box-shadow:-18px 0 50px rgba(0,0,0,.55);
    transform:translateX(100%); transition:transform .32s cubic-bezier(.3,.9,.3,1);
  }
  #editor.open{transform:translateX(0)}
  #editor.hide{display:flex !important; transform:translateX(100%)}   /* 用位移收起，保留过渡 */
  #edBody{max-width:none}
  #edHead{
    display:flex; align-items:center; gap:12px; padding:12px 16px;
    border-bottom:1px solid var(--line); background:var(--panel); flex-shrink:0;
  }
  #edHead .t{font-size:16px; font-weight:700; margin-right:auto}
  #edBody{flex:1; overflow-y:auto; padding:16px; display:flex;
          flex-direction:column; gap:16px; max-width:1000px; margin:0 auto; width:100%}
  .sec{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px}
  .sec > h3{
    font-size:11px; font-family:var(--mono); letter-spacing:.14em; color:var(--ink3);
    margin-bottom:12px; display:flex; align-items:center; gap:10px;
  }
  .sec > h3::after{content:''; flex:1; height:1px; background:var(--line)}

  .fld{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink2)}
  .fld label{min-width:96px}
  .fld .inp{max-width:130px}
  .fld .unit{color:var(--ink3); font-size:12px}

  .tier{border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px;
        background:var(--panel2)}
  .tier.grand{border-color:var(--gold)}
  .tierHead{display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap}
  .tierHead .inp{width:auto}
  .tierHead .nm{width:110px}
  .tierHead .pr{width:88px}
  .tierHead .badge{
    font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:#1a1a24;
    background:var(--gold); border-radius:99px; padding:2px 9px; font-weight:700;
  }
  .tierHead .sp{flex:1}
  .tierHead .tg{font-size:12px; padding:5px 8px}
  .tierHead .brk{
    display:flex; align-items:center; gap:5px; font-size:12px; color:var(--ink2);
    cursor:pointer; user-select:none;
  }
  .tierHead .brk input{accent-color:var(--gold); cursor:pointer}

  .item{display:flex; gap:8px; align-items:center; margin-bottom:7px}
  .item .thumb{
    width:40px; height:40px; border-radius:5px; flex-shrink:0; overflow:hidden;
    background:repeating-linear-gradient(45deg,#2c2c3c 0 6px,#262634 6px 12px);
    display:flex; align-items:center; justify-content:center; font-size:19px; cursor:pointer;
    border:1px solid var(--line);
  }
  .item .thumb img{width:100%; height:100%; object-fit:cover}
  .item .inm{flex:1; min-width:80px}
  .item .iemo{width:52px; text-align:center}
  .item .icnt{width:60px}
  .item .x{
    background:none; border:none; color:var(--ink3); cursor:pointer;
    font-size:17px; padding:0 6px; line-height:1;
  }
  .item .x:hover{color:var(--red)}
  .itemHint{font-size:11px; color:var(--ink3); display:flex; gap:8px; padding:0 0 6px 48px}
  .itemHint span:nth-child(1){flex:1}
  .itemHint span:nth-child(2){width:52px; text-align:center}
  .itemHint span:nth-child(3){width:60px; text-align:center}
  .itemHint span:nth-child(4){width:29px}

  #preview{font-size:13px; color:var(--ink2); display:flex; flex-direction:column; gap:10px}
  #preview .pRow{display:flex; gap:18px; flex-wrap:wrap; font-family:var(--mono)}
  #preview .pRow b{color:var(--gold)}
  #preview .pCards{display:flex; gap:8px; flex-wrap:wrap}
  #preview .pc{
    border:1px solid var(--line); border-radius:6px; padding:8px 11px;
    background:var(--panel2); font-size:12px; display:flex; flex-direction:column; gap:2px;
  }
  #preview .pc .pp{font-family:var(--mono); font-weight:700; color:var(--red)}
  #preview .pc.safe .pp{color:var(--green)}
  .err{color:var(--red); font-size:13px; display:flex; flex-direction:column; gap:4px}

  /* 演出预览台 */
  .pvGrid{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:9px}
  .pvGrid .btn{font-size:12px; padding:6px 11px; box-shadow:0 3px 0 var(--ink-stroke)}
  .pvGrid .btn:active{transform:translateY(3px); box-shadow:none}
  .pvLbl{font-size:11px; color:var(--ink3); width:100%; margin:2px 0 -2px}
  .btn.r1{background:var(--r1d)} .btn.r2{background:var(--r2d)}
  .btn.r3{background:var(--r3d)} .btn.r4{background:var(--r4d)}
  .btn.r5{background:var(--r5d)}
  #pvState{font-size:12px; color:var(--gold); min-height:16px}

  /* ============ 抽奖界面 ============ */
  #game{flex:1; display:flex; flex-direction:column; overflow:hidden}
  #shelf{ display:none }   /* 陈列区已隐藏，剩余数量改在底部状态栏显示 */
  #shelfOff{
    display:flex; gap:6px; padding:10px; background:var(--panel);
    border-bottom:1px solid var(--line); flex-shrink:0; transition:padding .3s;
  }
  .slot{
    flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:6px;
    padding:7px 5px; display:flex; flex-direction:column; align-items:center; gap:4px;
    opacity:.42; transition:opacity .3s, border-color .3s; min-width:0;
  }
  .slot.active{opacity:1; border-color:var(--gold)}
  .slot.gone{opacity:.15}
  .slot.locked{opacity:.6; border-style:dashed; border-color:#4a4a60}
  .photo{
    width:100%; aspect-ratio:1/1; max-height:84px; border-radius:4px; overflow:hidden;
    background:repeating-linear-gradient(45deg,#2c2c3c 0 8px,#262634 8px 16px);
    transition:max-height .3s;
  }
  .slot .nm{font-size:10px; text-align:center; line-height:1.3; color:var(--ink2);
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%}
  .slot .lv{font-family:var(--mono); font-size:9px; letter-spacing:.1em; color:var(--ink3)}
  .slot .left{font-family:var(--mono); font-size:11px; font-weight:700; color:var(--gold)}
  .slot.gone .left{color:var(--ink3); text-decoration:line-through}
  body.compact .photo{max-height:0}
  body.compact #shelf{padding:5px 10px}

  @keyframes roll{from{transform:translateX(0)} to{transform:translateX(var(--shift))}}
  .strip{display:flex; height:100%; width:max-content; animation:roll var(--dur) linear infinite}
  .cell{flex:0 0 auto; height:100%; aspect-ratio:1;
        display:flex; align-items:center; justify-content:center}
  .cell img{width:100%; height:100%; object-fit:cover}
  .photo .cell{font-size:22px}
  .box .cell{font-size:clamp(34px,4.6vw,50px)}

  #stage{
    flex:1; min-height:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:clamp(8px, 1.6vh, 18px); padding:clamp(8px,1.6vh,18px) clamp(10px,2vw,22px);
    text-align:center; overflow:hidden;
  }
  /* 间距 = 卡宽 x --gapR；卡宽又由"可用宽度扣掉两条间距再三等分"反推，
     所以 3*卡宽 + 2*间距 恒等于可用宽度，任何分辨率都不会溢出折行。
     分母 3.84 = 3 + 2 * 0.42，改 --gapR 时这个数要跟着改。 */
  #cards{
    --gapR:.42;
    --cw:min(calc((100vw - 48px) / 3.84), 30vh, 330px);
    gap:calc(var(--cw) * var(--gapR));
    margin-top:clamp(10px, 2.2vh, 26px);
  }
  .prizeBar{flex-wrap:wrap; justify-content:center; max-width:96vw}
  .phase-tag{
    font-size:13px; letter-spacing:.16em; color:#2a1d00; background:var(--gold);
    border:2px solid var(--ink-stroke); border-radius:99px; padding:4px 16px;
    box-shadow:0 4px 0 var(--ink-stroke); transform:rotate(-1.5deg);
  }
  .hint{font-size:13px; color:var(--ink3)}
  /* 提示区高度固定，文案从一行变两行时不会把上面的内容顶走 */
  /* 高度固定，避免文案换行时把上面的内容顶走。
     必须是 block：flex 会把「请」「081」「号的朋友上台」拆成三个 flex item，各占一行 */
  #dm{
    min-height:clamp(52px, 7.4vh, 78px);
    display:block; text-align:center;
    padding-top:clamp(6px, 1.2vh, 14px);
  }
  .big{
    font-size:clamp(23px,3.8vw,36px); color:#fff;
    --ow:2px; --oc:var(--ink-stroke);
    text-shadow:var(--outline), 0 5px 0 rgba(0,0,0,.4);
    animation:popIn .42s var(--pop) both;
  }
  @keyframes popIn{from{transform:scale(.7); opacity:0} to{transform:scale(1); opacity:1}}
  .sub{font-size:15px; color:var(--ink2); max-width:62ch}
  /* 晋级轮标题里被押上去的那件，用金色点出来 */
  .big em{font-style:normal; color:var(--gold)}

  .box{
    width:clamp(105px,13vw,148px); aspect-ratio:1/1; border-radius:10px; overflow:hidden;
    background:repeating-linear-gradient(45deg,#2c2c3c 0 10px,#262634 10px 20px);
    border:2px solid var(--gold); display:flex; align-items:center; justify-content:center;
    font-size:50px; box-shadow:0 0 40px rgba(255,213,74,.15);
    animation:pop .45s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop{from{transform:scale(.6);opacity:0} to{transform:scale(1);opacity:1}}

  /* ===== 老虎机下方的实体按钮 ===== */
  .spinHold{ display:flex; justify-content:center; animation:btnIdle 2.8s ease-in-out infinite }
  @keyframes btnIdle{0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)}}
  .spinHold.dead{animation-play-state:paused; opacity:.35;
                 pointer-events:none; filter:grayscale(.6)}

  .spinBtn{
    font-family:var(--disp); font-size:clamp(21px,2.7vw,31px);
    letter-spacing:.18em; color:#fff; padding:.42em 1.7em .5em;
    background:linear-gradient(180deg,#d98470 0%,#bd5a45 55%,#a44a37 100%);
    border:var(--stroke) solid var(--ink-stroke); border-radius:var(--r-lg);
    box-shadow:0 10px 0 #6d2c1e, 0 18px 26px rgba(0,0,0,.5),
               inset 0 3px 0 rgba(255,255,255,.35);
    --ow:1.5px; --oc:var(--ink-stroke);
    text-shadow:var(--outline), 0 3px 0 rgba(0,0,0,.35);
    cursor:pointer; user-select:none; -webkit-user-select:none;
    transition:transform .07s ease-out, box-shadow .07s ease-out, filter .07s;
  }
  /* 按下：整体下沉，厚度被压扁 */
  .spinBtn.press{
    transform:translateY(10px) scaleY(.9);
    box-shadow:0 0 0 #6d2c1e, 0 5px 10px rgba(0,0,0,.5),
               inset 0 3px 0 rgba(255,255,255,.2);
    filter:brightness(.92);
  }
  /* 松开：弹过头再落回 */
  .spinBtn.bounce{animation:btnBounce .36s var(--squash)}
  @keyframes btnBounce{
    0%{transform:translateY(10px) scaleY(.9)}
    45%{transform:translateY(-8px) scaleY(1.08)}
    72%{transform:translateY(2px) scaleY(.98)}
    100%{transform:none}
  }

  /* 老虎机正上方的奖品展示条 */
  .prizeBar{
    display:flex; align-items:center; gap:14px;
    padding:9px 18px 9px 9px; border-radius:14px;
    background:linear-gradient(180deg,rgba(40,40,60,.85),rgba(26,26,38,.85));
    border:1px solid var(--line);
    box-shadow:0 6px 20px rgba(0,0,0,.35);
  }
  .prizeBar .pbBox{
    width:clamp(58px,6.4vw,76px); aspect-ratio:1; border-radius:10px; overflow:hidden;
    background:repeating-linear-gradient(45deg,#2c2c3c 0 9px,#262634 9px 18px);
    border:2px solid var(--gold); flex-shrink:0;
  }
  .prizeBar .pbBox .cell{font-size:clamp(26px,3.2vw,40px)}
  .prizeBar .pbTxt{display:flex; flex-direction:column; gap:3px; text-align:left; min-width:0}
  .prizeBar .pbLv{
    font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:var(--gold);
  }
  .prizeBar .pbNm{font-size:clamp(16px,2vw,22px); font-weight:700; line-height:1.15}
  .prizeBar .pbSub{font-size:12px; color:var(--ink3); line-height:1.3}

  /* ============ 抽号：三个积木滚轮 ============ */
  #slot{ position:relative; display:flex; flex-direction:column; align-items:center }
  #digits{
    --cell:min(13.5vh, 22vw, 168px);
    display:flex; gap:clamp(10px,1.4vw,18px); position:relative;
  }
  .reel{
    position:relative; overflow:hidden;
    width:calc(var(--cell) * .94); height:calc(var(--cell) * 3);
    border:var(--stroke) solid var(--ink-stroke); border-radius:var(--r-lg);
    background:linear-gradient(180deg,#fffdf6 0%,#f3eee0 50%,#e2dbc9 100%);
    box-shadow:
      0 var(--lift) 0 var(--ink-stroke),
      0 calc(var(--lift) + 10px) 22px rgba(0,0,0,.5),
      inset 0 14px 20px rgba(60,40,20,.26),
      inset 0 -14px 20px rgba(60,40,20,.26);
    transition:box-shadow .22s;
  }
  /* 定格后：中间那位提亮放大，上下两位压暗缩小，对比拉开 */
  /* 定格只改透明度和描边，绝不动几何，避免任何位移错觉 */
  .rcell{transition:opacity .3s, color .3s}
  .reel.locked .rcell{opacity:.20}
  .reel.locked .rcell.hit{
    opacity:1;
    --ow:1.5px; --oc:var(--gold);
    text-shadow:var(--outline), 0 0 22px rgba(255,201,60,.8), 0 3px 0 rgba(0,0,0,.25);
  }
  .reel.locked{
    box-shadow:
      0 var(--lift) 0 var(--ink-stroke),
      0 0 0 4px var(--gold),
      0 calc(var(--lift) + 12px) 26px rgba(255,201,60,.35),
      inset 0 14px 20px rgba(60,40,20,.18),
      inset 0 -14px 20px rgba(60,40,20,.18);
  }
  .rstrip{position:absolute; left:0; right:0; top:0; will-change:transform}
  .rstrip.fast{filter:blur(1.1px)}
  .rcell{
    height:var(--cell); display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-weight:800; color:#1b1726;
    font-size:calc(var(--cell) * .72); line-height:1;
  }
  /* 中奖线 */
  .payline{
    position:absolute; left:-10px; right:-10px; top:50%; height:var(--cell);
    transform:translateY(-50%); pointer-events:none; z-index:4;
    border-top:var(--stroke) solid var(--gold);
    border-bottom:var(--stroke) solid var(--gold);
    box-shadow:0 0 24px rgba(255,201,60,.4), inset 0 0 30px rgba(255,201,60,.12);
  }
  /* 上下渐隐，让滚轮看起来是圆柱 */
  .reel::before,.reel::after{
    content:''; position:absolute; left:0; right:0; height:34%; pointer-events:none; z-index:2;
  }
  .reel::before{top:0;    background:linear-gradient(180deg,rgba(40,28,18,.30),transparent)}
  .reel::after {bottom:0; background:linear-gradient(0deg,  rgba(40,28,18,.30),transparent)}

  #cards{display:flex; justify-content:center; flex-wrap:wrap}   /* gap 见上方响应式 */
  /* 卡牌：奖品图占主体，其下依次是标签 / 概率 / 名称 / 说明 */
  .card{
    /* --cw 从 #cards 继承下来，这里不再自己定义 */
    width:var(--cw); height:calc(var(--cw) * 1.55);
    perspective:1000px; cursor:pointer; position:relative;
  }
  /* 每张牌按稀有度取色 */
  .card{--rc:var(--r1); --rcd:var(--r1d); --rcrgb:var(--r1rgb)}
  .card.bust{--rc:var(--r0); --rcd:var(--r0d); --rcrgb:var(--r0rgb)}
  .card.bust .front{filter:saturate(.65) brightness(.82)}
  .card.bust .front .tag{background:rgba(168,80,90,.3); color:#ffc9cd}
  .card[data-r="2"]{--rc:var(--r2); --rcd:var(--r2d); --rcrgb:var(--r2rgb)}
  .card[data-r="3"]{--rc:var(--r3); --rcd:var(--r3d); --rcrgb:var(--r3rgb)}
  .card[data-r="4"]{--rc:var(--r4); --rcd:var(--r4d); --rcrgb:var(--r4rgb)}
  .card[data-r="5"]{--rc:var(--r5); --rcd:var(--r5d); --rcrgb:var(--r5rgb)}
  .inner{position:relative; z-index:1;   /* 压在辉光和粒子之上 */
         width:100%; height:100%; transform-style:preserve-3d;
         transform:rotateY(180deg); transition:transform .82s cubic-bezier(.3,.9,.3,1)}
  .card.flipped .inner{transform:rotateY(0deg)}
  /* 入场：从下方带缩放飞入 */
  .card.enter{animation:cardIn .42s var(--pop) backwards}
  @keyframes cardIn{
    from{opacity:0; transform:translateY(72px) scale(.7)}
    to  {opacity:1; transform:none}
  }
  .face{
    position:absolute; inset:0; backface-visibility:hidden;
    border:var(--stroke) solid var(--ink-stroke); border-radius:var(--r-lg);
    background:var(--panel); overflow:hidden;
    display:flex; flex-direction:column; align-items:center;
    /* 奶白外框就是光源本身。品质完全交给辉光的颜色表达，
       所以正反两面用同一个颜色，牌背也不会泄露品质 */
    --ringC:rgba(252,250,255,.92);
    box-shadow:
      0 0 0 5px var(--ringC),
      0 var(--lift) 0 var(--ink-stroke),
      0 calc(var(--lift) + 5px) 0 var(--panel2),
      0 calc(var(--lift) + 9px) 0 var(--ink-stroke),
      0 14px 22px rgba(0,0,0,.34);      /* 收薄一点，免得压暗身后的光团 */
  }
  .front{background:linear-gradient(180deg, var(--rcd), var(--panel) 58%)}
  /* 白框内缘朝卡内渗一点同色系的光，不是硬边切断 */
  .front::before{
    content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
    border-radius:inherit;
    box-shadow:inset 0 0 calc(var(--cw) * .10) rgba(var(--rcLrgb), .20);
  }
  .back{
    transform:rotateY(180deg); justify-content:center;
    background:
      repeating-linear-gradient(-45deg, rgba(255,255,255,.05) 0 12px, transparent 12px 24px),
      linear-gradient(160deg,#3a2f5e,#241d3d);
  }
  /* 卡背主图。线稿类图案缩小后笔画会消失，所以居中放大，不做平铺 */
  .back .mark{
    width:72%; height:52%;
    background:url('art/textures/card_icon.png') center/contain no-repeat;
    opacity:.62;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.45));
    animation:backFloat 5.2s ease-in-out infinite;
  }
  @keyframes backFloat{
    0%,100%{transform:translateY(0)    rotate(-1.5deg)}
    50%    {transform:translateY(-6px) rotate(1.5deg)}
  }
  .card.sel{transform:translateY(-20px) rotate(-1.7deg) scale(1.04); transition:transform .18s var(--squash)}
  /* 选中：白框加厚提亮（辉光不动，那是品质的语言），配合上浮和倾斜 */
  .card.sel .face{box-shadow:
      0 0 0 9px #ffffff,
      0 var(--lift) 0 var(--ink-stroke),
      0 calc(var(--lift) + 5px) 0 var(--panel2),
      0 calc(var(--lift) + 9px) 0 var(--ink-stroke),
      0 24px 44px rgba(0,0,0,.6)}

  /* 主体：奖品 */
  .front .ico{
    flex:1 1 auto; width:100%; min-height:0; position:relative;
    display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--cw) * .34); line-height:1;
    background:radial-gradient(circle at 50% 44%, rgba(255,255,255,.20), transparent 62%);
    animation:floaty 3.4s ease-in-out infinite;
  }
  @keyframes floaty{0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)}}
  .front .ico img{width:78%; height:78%; object-fit:contain;
                  filter:drop-shadow(0 7px 12px rgba(0,0,0,.55))}

  /* 文字区 */
  .front .info{
    width:100%; padding:0 calc(var(--cw) * .055) calc(var(--cw) * .06);
    display:flex; flex-direction:column;
    align-items:center; gap:calc(var(--cw) * .012); flex-shrink:0;
  }
  .front .tag{
    font-size:max(9px, calc(var(--cw) * .058)); letter-spacing:.14em;
    color:#fff; margin-bottom:2px; white-space:nowrap;
    background:var(--rcd); border:2px solid var(--ink-stroke); border-radius:99px;
    padding:2px calc(var(--cw) * .055); transform:rotate(-6deg);
    box-shadow:0 3px 0 var(--ink-stroke);
  }
  .front .p{
    font-family:var(--mono); font-size:calc(var(--cw) * .215);
    font-weight:800; line-height:1; letter-spacing:-.01em; color:#fff;
    --ow:1.5px; --oc:var(--ink-stroke);
    text-shadow:var(--outline), 0 4px 0 rgba(0,0,0,.4);
  }
  .front .nm{
    font-size:max(11px, calc(var(--cw) * .082)); line-height:1.15;
    margin-top:calc(var(--cw) * .016); color:#fff;
    max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    --ow:1.25px; --oc:var(--ink-stroke); text-shadow:var(--outline);
  }
  /* 说明允许折成两行：.ico 是 flex:1，多出的高度从图标区借，卡牌总高不变 */
  .front .val{
    font-size:max(9px, calc(var(--cw) * .056)); color:var(--ink2);
    line-height:1.22; margin-top:1px; max-width:100%;
    word-break:break-word;
  }


  /* ============ 卡牌辉光 · 四周粒子 · 表面扫光 ============ */
  /* 边缘辉光：档位越高铺得越开、越亮 */
  /* 用 box-shadow 而不是 radial-gradient：渐变最亮处在中心，
     而中心正好被牌挡住，露出来的只剩最淡的外缘；box-shadow 天生
     从边缘往外扩散，才是参考图那种包边光晕 */
  /* 品质光效整体的显隐闸门。牌背朝上时不该透出品质信息，
     翻到一半正面刚露出来时才开始淡入，到翻转结束（820ms）正好满亮度 */
  .fx{
    position:absolute; inset:0; z-index:2; pointer-events:none;
    opacity:0; transition:opacity .3s ease-out .52s;
  }
  .card.flipped .fx{opacity:1}

  /* 光团垫在卡后面，尺寸远大于卡。卡盖住中间最亮的部分，
     露出来的是一圈雾化的光，形状不跟随卡的圆角矩形 */
  /* 辉光跟着卡的圆角矩形轮廓走，不是椭圆光团——参考图的长边是一条
     宽度均匀、平行于边缘的亮带，椭圆做不出这个。
     两段式衰减：近场一条较亮的窄带，远场一大片极淡的环境晕。
     贴边三层用掺白的浅色，往外换成纯品质色，做出温度梯度。
     上方两层给一点负 y 偏移，模仿参考图上半部更亮的光源方向。 */
  .aura{
    position:absolute; inset:0; z-index:2; pointer-events:none;
    border-radius:var(--r-lg);
    box-shadow:
      0 0 calc(var(--cw) * 0.0333 * var(--gs)) calc(var(--cw) * 0.0074 * var(--gs)) rgba(var(--rcLrgb), .78),
      0 calc(var(--cw) * -.0074 * var(--gs)) calc(var(--cw) * 0.0815 * var(--gs)) calc(var(--cw) * 0.0148 * var(--gs)) rgba(var(--rcLrgb), .56),
      0 calc(var(--cw) * -.0148 * var(--gs)) calc(var(--cw) * 0.1704 * var(--gs)) calc(var(--cw) * 0.0259 * var(--gs)) rgba(var(--rcrgb),  .46),
      0 0 calc(var(--cw) * 0.3185 * var(--gs)) calc(var(--cw) * 0.0407 * var(--gs)) rgba(var(--rcrgb),  .28),
      0 0 calc(var(--cw) * 0.5556 * var(--gs)) calc(var(--cw) * 0.0593 * var(--gs)) rgba(var(--rcrgb),  .155),
      0 0 calc(var(--cw) * 0.8889 * var(--gs)) calc(var(--cw) * 0.0889 * var(--gs)) rgba(var(--rcrgb),  .075);
    /* 名字必须唯一：@keyframes 是全局的，同名的后定义者会整个覆盖前者。
       这份原先和下面"蓄力光环"用了同一个名字，被顶掉之后常驻辉光
       就变成了扩散→消失→跳回。 */
    animation:cardAuraBreathe 3.8s ease-in-out infinite;
  }
  @keyframes cardAuraBreathe{
    0%,100%{opacity:calc(var(--gop) * .80); transform:scale(.995)}
    50%    {opacity:var(--gop);             transform:scale(1.012)}
  }

  /* 粒子从卡的边框上出发，沿卡心径向朝外飞，飞到近场光带外缘就化掉，
     所以它们始终活在光里，不会飘到暗处变成孤立的点。
     容器和卡同框，left/top 的百分比就是卡周长上的位置。 */
  .sparks{position:absolute; inset:0; z-index:2; pointer-events:none}
  .sparks i{
    position:absolute; left:var(--px); top:var(--py);
    width:var(--ms); height:var(--ms);
    margin-left:calc(var(--ms) / -2);
    margin-top:calc(var(--ms) / -2);
    background:rgb(var(--rcLrgb));
    /* 经典四角星：两轴拉长、腰部收紧 */
    clip-path:polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%,
                      50% 100%, 39% 61%, 0% 50%, 39% 39%);
    filter:drop-shadow(0 0 7px rgb(var(--rcrgb)))
           drop-shadow(0 0 3px rgb(var(--rcLrgb)));
    opacity:0; will-change:transform;
    animation:sparkOut var(--md,3.8s) ease-out var(--mdl,0s) infinite;
  }
  /* 贴着边框亮起来，一路放大、自转、淡出 */
  @keyframes sparkOut{
    0%  {transform:translate(0,0) scale(.2) rotate(0deg);   opacity:0}
    16% {opacity:1}
    58% {opacity:.8}
    100%{transform:translate(var(--dx), var(--dy)) scale(1.1) rotate(150deg); opacity:0}
  }
  .sparks i:nth-child(1 ){--px:0%;   --py:45%;  --dx:calc(var(--cw) * -.198); --dy:calc(var(--cw) * -.031); --ms:calc(var(--cw) * 0.0704); --md:3.4s; --mdl:0s}
  .sparks i:nth-child(2 ){--px:100%; --py:55%;  --dx:calc(var(--cw) * .198); --dy:calc(var(--cw) * .031); --ms:calc(var(--cw) * 0.0815); --md:3.9s; --mdl:1.1s}
  .sparks i:nth-child(3 ){--px:6%;   --py:3%;   --dx:calc(var(--cw) * -.102); --dy:calc(var(--cw) * -.172); --ms:calc(var(--cw) * 0.0593); --md:3.6s; --mdl:2.0s}
  .sparks i:nth-child(4 ){--px:65%;  --py:100%; --dx:calc(var(--cw) * .038); --dy:calc(var(--cw) * .196); --ms:calc(var(--cw) * 0.0519); --md:4.2s; --mdl:.7s}
  .sparks i:nth-child(5 ){--px:94%;  --py:3%;   --dx:calc(var(--cw) * .102); --dy:calc(var(--cw) * -.172); --ms:calc(var(--cw) * 0.0741); --md:3.7s; --mdl:2.6s}
  .sparks i:nth-child(6 ){--px:0%;   --py:72%;  --dx:calc(var(--cw) * -.165); --dy:calc(var(--cw) * .113); --ms:calc(var(--cw) * 0.0630); --md:4.4s; --mdl:1.5s}
  .sparks i:nth-child(7 ){--px:100%; --py:25%;  --dx:calc(var(--cw) * .158); --dy:calc(var(--cw) * -.123); --ms:calc(var(--cw) * 0.0852); --md:3.5s; --mdl:3.1s}
  .sparks i:nth-child(8 ){--px:22%;  --py:0%;   --dx:calc(var(--cw) * -.068); --dy:calc(var(--cw) * -.188); --ms:calc(var(--cw) * 0.0481);  --md:4.0s; --mdl:.4s}
  .sparks i:nth-child(9 ){--px:35%;  --py:100%; --dx:calc(var(--cw) * -.038); --dy:calc(var(--cw) * .196); --ms:calc(var(--cw) * 0.0593); --md:4.6s; --mdl:2.3s}
  .sparks i:nth-child(10){--px:100%; --py:80%;  --dx:calc(var(--cw) * .146); --dy:calc(var(--cw) * .136); --ms:calc(var(--cw) * 0.0704); --md:3.8s; --mdl:1.8s}
  .sparks i:nth-child(11){--px:0%;   --py:18%;  --dx:calc(var(--cw) * -.142); --dy:calc(var(--cw) * -.141); --ms:calc(var(--cw) * 0.0815); --md:4.3s; --mdl:3.4s}
  .sparks i:nth-child(12){--px:68%;  --py:0%;   --dx:calc(var(--cw) * .045); --dy:calc(var(--cw) * -.195); --ms:calc(var(--cw) * 0.0519); --md:3.6s; --mdl:2.9s}
  @media (prefers-reduced-motion:reduce){ .sparks{display:none} }

  /* 表面扫光：从右下扫向左上，间歇一次。
     只给三档及以上——三张牌同屏时低档也带特效就拉不开差距了 */
  .card[data-r="3"] .front::after,
  .card[data-r="4"] .front::after,
  .card[data-r="5"] .front::after{
    content:''; position:absolute; inset:0; z-index:3; pointer-events:none;
    background:linear-gradient(135deg,
      transparent 40%,
      rgba(255,255,255,.09) 46%,
      rgba(255,255,255,var(--sheen,.18)) 50%,
      rgba(255,255,255,.09) 54%,
      transparent 60%);
    transform:translate(118%, 118%);
    animation:sheenSweep 5.4s ease-in-out infinite;
  }
  @keyframes sheenSweep{
    0%, 56%{transform:translate(118%, 118%)}
    100%   {transform:translate(-118%, -118%)}
  }
  @media (prefers-reduced-motion:reduce){
    .sparks{display:none}
    .aura,.front::after{animation:none}
  }

  /* ============ 晋级轮：背景升温 ============ */
  body[data-round]{--rgcrgb:var(--r2rgb)}
  body[data-round="3"]{--rgcrgb:var(--r3rgb)}
  body[data-round="4"]{--rgcrgb:var(--r4rgb)}
  body[data-round="5"]{--rgcrgb:var(--r5rgb)}
  /* 波点提速。方向和网格都不变，只是走得更快，所以不会出现层间交叉 */
  body[data-round] #bgFx{animation-duration:19s}
  body[data-round="4"] #bgFx,
  body[data-round="5"] #bgFx{animation-duration:14s}
  /* 轮次光晕：从画面中心透出的轮次色，缓慢呼吸 */
  #roundAura{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0;
    transition:opacity .8s ease-out;
    background:radial-gradient(ellipse 120% 78% at 50% 50%,
               rgba(var(--rgcrgb, 77,196,92), .17), transparent 70%);
  }
  body[data-round] #roundAura{
    opacity:1; animation:auraBreathe 4.2s ease-in-out infinite;
  }
  @keyframes auraBreathe{
    0%,100%{transform:scale(1);    opacity:.7}
    50%    {transform:scale(1.05); opacity:1}
  }

  /* ============ 晋级过场：压暗 → 轮次砸入 → 冲击波 → 散开 ============ */
  #roundGate{
    position:fixed; inset:0; z-index:310; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
    opacity:0;
    --gc:var(--r2);                 /* 轮次色，由 JS 按轮数替换 */
  }
  #roundGate.go{opacity:1}
  /* 压暗层独立出来：它要先撤走把画面还给卡牌，
     大字才能继续留一会儿做视觉暂留，而不会挡住入场和翻牌 */
  .rgVeil{
    position:absolute; inset:0; background:rgba(8,6,16,.78); opacity:0;
  }
  #roundGate.go .rgVeil{animation:gateVeil 1.73s ease-out forwards}
  @keyframes gateVeil{
    0%{opacity:0} 6%{opacity:1} 28%{opacity:1} 46%{opacity:0} 100%{opacity:0}
  }
  .rgWrap{position:relative; display:flex; align-items:center; justify-content:center}
  /* 冲击波圆环 */
  .rgRing{
    position:absolute; width:22vmin; height:22vmin; border-radius:50%;
    border:.9vmin solid var(--gc); opacity:0;
  }
  #roundGate.go .rgRing{animation:gateRing .62s cubic-bezier(.12,.85,.3,1) .18s forwards}
  @keyframes gateRing{
    0%  {transform:scale(.3); opacity:.95}
    100%{transform:scale(4.2); opacity:0; border-width:.1vmin}
  }
  /* 轮次大字 */
  .rgNum{
    position:relative;
    font-family:var(--disp); font-size:min(17vw, 22vh);
    line-height:1; letter-spacing:.04em; color:#fff;
    --ow:.9vmin; --oc:var(--ink-stroke);
    text-shadow:var(--outline),
                0 0 6vmin var(--gc), 0 1.2vmin 0 rgba(0,0,0,.5);
    opacity:0;
  }
  #roundGate.go .rgNum{animation:gateNum 1.73s forwards}
  @keyframes gateNum{
    /* 砸入的节奏不变（仍是 260ms 到位），只把停留从 850ms 拉到 1280ms，
       尾巴改成渐弱：先快掉到四成，再慢慢化掉，留一层淡影 */
    0%  {transform:scale(2.7) rotate(-7deg); opacity:0;
         animation-timing-function:cubic-bezier(.2,.9,.25,1)}
    15% {transform:scale(1) rotate(0); opacity:1;
         animation-timing-function:cubic-bezier(.3,1.7,.5,1)}
    20% {transform:scale(1.07) rotate(0)}
    25% {transform:scale(1) rotate(0)}
    /* 牌在 430ms 落位、1050ms 开始翻转，所以大字必须在 ~800ms 前收掉亮度，
       剩下的全交给渐弱长尾：翻牌时它只是一层很淡的残影，不挡画面 */
    46% {transform:scale(1) rotate(0); opacity:1;
         animation-timing-function:ease-out}
    60% {transform:scale(1.05) rotate(0); opacity:.30}
    100%{transform:scale(1.22) rotate(0); opacity:0}
  }
  /* 调试用慢放：所有分段等比拉长 4 倍，正式流程不受影响 */
  #roundGate.slow.go .rgVeil{animation-duration:6.92s}
  #roundGate.slow.go .rgNum{animation-duration:6.92s}
  #roundGate.slow.go .rgRing{animation-duration:2.48s; animation-delay:.72s}
  #roundGate.slow.go .rgBar{animation-duration:2s; animation-delay:.4s}

  /* 速度线：只在字的上下各扫一条，别抢主体 */
  .rgBar{
    position:absolute; left:-60vw; width:220vw; height:1.1vmin;
    background:linear-gradient(90deg, transparent, var(--gc), transparent);
    opacity:0;
  }
  .rgBar.t{top:-9vmin} .rgBar.b{bottom:-9vmin}
  #roundGate.go .rgBar.t{animation:gateBarL .5s ease-out .1s forwards}
  #roundGate.go .rgBar.b{animation:gateBarR .5s ease-out .1s forwards}
  @keyframes gateBarL{
    0%{transform:translateX(30vw); opacity:0} 35%{opacity:.9}
    100%{transform:translateX(-16vw); opacity:0}
  }
  @keyframes gateBarR{
    0%{transform:translateX(-30vw); opacity:0} 35%{opacity:.9}
    100%{transform:translateX(16vw); opacity:0}
  }

  /* ============ 揭晓：就在选中的那张牌上开 ============ */
  #flash{
    position:fixed; inset:0; z-index:300; background:#fff;
    opacity:0; pointer-events:none;
  }
  #flash.go{animation:flashOut .40s ease-out}
  @keyframes flashOut{0%{opacity:0} 7%{opacity:1} 100%{opacity:0}}

  #vig{
    position:fixed; inset:0; z-index:12; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 46%, transparent 26%, rgba(0,0,0,.88) 74%);
  }
  #vig.on{animation:vigIn var(--chargeDur,1200ms) ease-in forwards}
  @keyframes vigIn{from{opacity:0; transform:scale(1.7)} to{opacity:1; transform:scale(1)}}

  /* 落选的两张飞出画面 */
  .card.flyL{animation:flyL .51s var(--ease) forwards}
  .card.flyR{animation:flyR .51s var(--ease) forwards}
  @keyframes flyL{to{transform:translateX(-190%) rotate(-22deg); opacity:0}}
  @keyframes flyR{to{transform:translateX(190%)  rotate(22deg);  opacity:0}}

  /* 选中的那张：放大 + 抖动逐渐加剧 */
  .card.charging{
    z-index:20; position:relative;
    animation:chargeShake var(--chargeDur,1200ms) linear forwards;
  }
  @keyframes chargeShake{
    0%  {transform:translateX(0)             scale(1)}
    24% {transform:translateX(var(--dx,0px)) scale(1.17)}
    100%{transform:translateX(var(--dx,0px)) scale(1.34)}
  }
  /* 抖动独立成一条固定频率的循环，不随蓄力时长变快变慢 */
  .card.charging .inner{animation:jitter 120ms linear infinite}
  @keyframes jitter{
    0%  {transform:rotateY(0) translate(0,0)}
    20% {transform:rotateY(0) translate(calc(var(--amp,3px) * -1), var(--amp,3px))}
    40% {transform:rotateY(0) translate(var(--amp,3px), calc(var(--amp,3px) * -.7))}
    60% {transform:rotateY(0) translate(calc(var(--amp,3px) * -.6), calc(var(--amp,3px) * -1))}
    80% {transform:rotateY(0) translate(calc(var(--amp,3px) * .8), var(--amp,3px))}
    100%{transform:rotateY(0) translate(0,0)}
  }
  /* ===== 蓄力时的档次差异：抖幅、辉光、光环、光芒 ===== */
  /* 辉光 / 扫光的分级参数。透明度写死成常量，不在 rgba 里做 calc */
  /* --gs 控制泛光铺开的倍率，--gop 控制整体亮度。
     衰减曲线（下面那五层的透明度）各档共用，所以档位差异是
     "光摊得更大更亮"，而不是"描边更粗" */
  /* --gs 是辉光铺开倍率，--gop 是整体亮度，--rcLrgb 是品质色掺白后的浅色，
     用来做"贴边偏暖白、往外转品质色"的温度梯度 */
  .card          {--gs:.6;  --gop:.60; --rcLrgb:203,207,223}
  .card[data-r="2"]{--gs:.82; --gop:.76; --rcLrgb:175,228,182}
  .card[data-r="3"]{--gs:1.1; --gop:.90; --rcLrgb:168,210,255; --sheen:.19}
  .card[data-r="4"]{--gs:1.45;--gop:.97; --rcLrgb:220,182,255; --sheen:.24}
  .card[data-r="5"]{--gs:1.9; --gop:1;   --rcLrgb:255,219,155; --sheen:.30}

  .card[data-r="1"]{--amp:2px;   --pow:.45}
  .card[data-r="2"]{--amp:2.5px; --pow:.8}
  .card[data-r="3"]{--amp:3px;   --pow:1.3}
  .card[data-r="4"]{--amp:4px;   --pow:1.9}
  .card[data-r="5"]{--amp:5px;   --pow:2.8}

  .card.charging .front{
    box-shadow:
      0 var(--lift) 0 var(--ink-stroke),
      0 0 0 calc(3px + 2px * var(--pow,1)) var(--rc),
      0 0 calc(26px * var(--pow,1)) var(--rc),
      0 0 calc(80px * var(--pow,1)) rgba(var(--rcrgb), .55),
      0 24px 44px rgba(0,0,0,.6);
  }
  /* 档次越高，牌面本身也越亮 */
  .card.charging .front{filter:brightness(calc(1 + .12 * var(--pow,1))) saturate(calc(1 + .2 * var(--pow,1)))}

  /* 脉动光环：超稀有及以上才有 */
  .card.charging::after{
    content:''; position:absolute; inset:-9%; border-radius:30px;
    pointer-events:none; z-index:-1; opacity:0;
    border:3px solid var(--rc);
  }
  .card[data-r="3"].charging::after,
  .card[data-r="4"].charging::after,
  .card[data-r="5"].charging::after{animation:chargeHaloPing 620ms ease-out infinite}
  @keyframes chargeHaloPing{
    0%  {opacity:.85; transform:scale(.92)}
    100%{opacity:0;   transform:scale(1.22)}
  }

  /* 旋转光芒：史诗和传说专属 */
  .card.charging::before{
    content:''; position:absolute; inset:-34%; pointer-events:none; z-index:-2;
    opacity:0; border-radius:50%;
    background:conic-gradient(from 0deg,
      rgba(var(--rcrgb), .70) 0deg 6deg, transparent 6deg 34deg,
      rgba(var(--rcrgb), .45) 34deg 39deg, transparent 39deg 60deg);
    -webkit-mask-image:radial-gradient(circle, transparent 26%, #000 52%, transparent 82%);
            mask-image:radial-gradient(circle, transparent 26%, #000 52%, transparent 82%);
  }
  .card[data-r="4"].charging::before{opacity:.55; animation:rayspin 5s linear infinite}
  .card[data-r="5"].charging::before{opacity:.9;  animation:rayspin 3.2s linear infinite}

  /* 失败：沿裂缝断成两半 —— 冲击 → 悬停 → 自由落体 */
  .card.shattered{
    z-index:20;
    filter:saturate(.28) brightness(.66);
    transition:filter .26s ease-out;   /* 断裂瞬间色就抽干，下落阶段不再有滤镜开销 */
  }
  .card.shattered .back{display:none}
  .card.shattered .inner{transform:rotateY(0deg) !important}
  /* 碎裂时辉光和粒子要一起收掉。它们挂在 .card 上、不跟着半片飞走，
     不处理的话两半飞开后原地会剩一圈卡牌形状的光，看着像遗留的白边框 */
  .card.shattered .fx{opacity:0; transition:opacity .26s ease-out}

  /* 两半共用同一条锯齿裂缝，严丝合缝 */
  .halfL,.halfR{
    will-change:transform;            /* 提升为独立图层，落下时不再重绘投影 */
    backface-visibility:visible;
    /* 加 !important 是防御性的：这里是单类 (0,1,0)，压不过 .card.sel .face
       那种三类选择器。目前碎裂前 sel 已被移除所以不冲突，但别人哪天
       改回去就会莫名其妙冒出白框 */
    box-shadow:none !important;       /* 碎片不需要积木厚度和白框 */
  }
  .halfL{
    clip-path:polygon(0 0, 52% 0, 45% 17%, 55% 33%, 43% 51%, 54% 69%, 44% 85%, 51% 100%, 0 100%);
    animation:shatterL 2s forwards;
  }
  .halfR{
    clip-path:polygon(52% 0, 100% 0, 100% 100%, 51% 100%, 44% 85%, 54% 69%, 43% 51%, 55% 33%, 45% 17%);
    animation:shatterR 2s forwards;
  }
  /* 只两段：爆裂→缓出是一条完整的 ease-out（末速为 0），
     落体是 ease-in（初速为 0），在速度都为零处相接，不会顿 */
  @keyframes shatterL{
    0%  {transform:translate(0,0) rotate(0);
         animation-timing-function:cubic-bezier(.03,.88,.18,1)}
    46% {transform:translate(-70px,-19px) rotate(-12deg);
         animation-timing-function:cubic-bezier(.5,0,1,1)}
    100%{transform:translate(-117px,112vh) rotate(-44deg); opacity:.9}
  }
  @keyframes shatterR{
    0%  {transform:translate(0,0) rotate(0);
         animation-timing-function:cubic-bezier(.03,.88,.18,1)}
    46% {transform:translate(72px,-16px) rotate(11deg);
         animation-timing-function:cubic-bezier(.5,0,1,1)}
    100%{transform:translate(126px,112vh) rotate(40deg); opacity:.9}
  }
  /* 断裂瞬间沿裂缝闪一下白光 */
  .crackFlash{
    position:absolute; inset:0; z-index:9; pointer-events:none; background:#fff;
    clip-path:polygon(52% 0, 45% 17%, 55% 33%, 43% 51%, 54% 69%, 44% 85%, 51% 100%,
                      55% 100%, 48% 85%, 58% 69%, 47% 51%, 59% 33%, 49% 17%, 56% 0);
    animation:crackFlash .5s ease-out forwards;
  }
  @keyframes crackFlash{
    0%{opacity:0; transform:scaleX(.4)}
    12%{opacity:1; transform:scaleX(1)}
    100%{opacity:0; transform:scaleX(2.6)}
  }

  /* 震屏 */
  #game.shk{animation:shk .42s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shk{
    0%,100%{transform:translate(0,0)}
    12%{transform:translate(-11px,5px)}  26%{transform:translate(10px,-6px)}
    40%{transform:translate(-8px,4px)}   56%{transform:translate(7px,-3px)}
    72%{transform:translate(-4px,2px)}   86%{transform:translate(3px,-1px)}
  }
  #game.shk-lite{animation:shkLite .3s ease-out}
  @keyframes shkLite{
    0%,100%{transform:translate(0,0)}
    30%{transform:translate(-5px,2px)} 65%{transform:translate(4px,-2px)}
  }

  /* ============ 中奖展示：自转奖品 + 光效 + 彩带 ============ */
  .prizeShow{
    position:relative; width:min(320px,54vw); aspect-ratio:1;
    display:flex; align-items:center; justify-content:center;
    --rc:var(--gold);
    animation:prizePop .5s var(--pop) both;
  }
  @keyframes prizePop{from{transform:scale(.55); opacity:0} to{transform:scale(1); opacity:1}}
  .prizeShow[data-r="1"]{--rc:var(--r1)} .prizeShow[data-r="2"]{--rc:var(--r2)}
  .prizeShow[data-r="3"]{--rc:var(--r3)} .prizeShow[data-r="4"]{--rc:var(--r4)}
  .prizeShow[data-r="5"]{--rc:var(--r5)}
  /* 彩带画布铺满视口，不受任何容器裁切影响 */
  #fx{
    position:fixed; inset:0; width:100vw; height:100vh;
    background:none; border:none; border-radius:0;
    pointer-events:none; z-index:5;
  }
  /* 背后旋转的光芒 */
  .rays{
    position:absolute; inset:-22%; z-index:0; opacity:.5;
    background:conic-gradient(from 0deg,
      rgba(var(--rcrgb), .62) 0deg 7deg, transparent 7deg 30deg,
      rgba(var(--rcrgb), .40) 30deg 35deg, transparent 35deg 60deg);
    -webkit-mask-image:radial-gradient(circle, #000 12%, rgba(0,0,0,.5) 42%, transparent 70%);
            mask-image:radial-gradient(circle, #000 12%, rgba(0,0,0,.5) 42%, transparent 70%);
    animation:rayspin 22s linear infinite;
  }
  @keyframes rayspin{to{transform:rotate(360deg)}}
  .glow{
    position:absolute; inset:6%; z-index:1; border-radius:50%;
    background:radial-gradient(circle, rgba(var(--rcrgb), .55), transparent 62%);
    animation:breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.75;transform:scale(1)} 50%{opacity:1;transform:scale(1.07)}}

  /* 自转的奖品牌（多层叠出厚度） */
  .spinWrap{position:relative; z-index:2; width:62%; aspect-ratio:1; perspective:1000px}
  .disc{
    position:absolute; inset:0; transform-style:preserve-3d;
    animation:spinY 7s linear infinite;
  }
  @keyframes spinY{to{transform:rotateY(360deg)}}
  .disc .lay{
    position:absolute; inset:0; border-radius:16px;
    background:linear-gradient(150deg,#3a3a4e,#242434);
  }
  .disc .fc{
    position:absolute; inset:0; border-radius:16px; overflow:hidden;
    background:linear-gradient(155deg,#2e2e40,#1b1b26);
    border:3px solid var(--rc);
    box-shadow:inset 0 2px 14px rgba(255,255,255,.08);
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(46px,7vw,78px); backface-visibility:hidden;
  }
  .disc .fc img{width:78%; height:78%; object-fit:contain;
                filter:drop-shadow(0 6px 16px rgba(0,0,0,.55))}
  .prizeShow.lost .rays,.prizeShow.lost .glow{display:none}
  .prizeShow.lost .fc{border-color:#3d3d4e}
  .prizeShow.lost .disc{animation-duration:11s}

  /* 批量补发 */
  #batch{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
         gap:12px; max-width:860px; width:100%}
  .bi{
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:11px 8px; display:flex; flex-direction:column; align-items:center; gap:5px;
  }
  .bi .bico{font-size:26px; width:34px; height:34px;
            display:flex; align-items:center; justify-content:center}
  .bi .bico img{width:100%; height:100%; object-fit:cover; border-radius:4px}
  .bi .bnm{font-size:11px; color:var(--ink3)}
  .bi .bnum{font-family:var(--mono); font-size:25px; font-weight:700; color:var(--ink3)}
  .bi.hit{border-color:var(--gold)}
  .bi.hit .bnum{color:var(--gold)}

  #foot{
    position:relative; z-index:100;              /* 永远压在特效层上面 */
    border-top:1px solid var(--line); background:var(--panel);
    padding:8px 14px; display:flex; justify-content:space-between; gap:12px;
    font-size:12px; color:var(--ink3); flex-shrink:0; flex-wrap:wrap;
  }
  #foot .btn{position:relative; z-index:101}
  #foot .btn kbd{margin-left:.7em}   /* 间距归 kbd，隐藏它时不留空白 */
  #stage{position:relative; z-index:1}
  /* 光效层不拦点击 */
  .prizeShow,.rays,.glow,.spinWrap,.disc{pointer-events:none}
  #foot .keys{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .warn{color:var(--red)}
  .hide{display:none !important}

  /* ===== 窄屏 / 竖屏 ===== */
  @media (max-aspect-ratio: 1/1){
    #cards{--cw:min(calc((100vw - 40px) / 3.84), 26vh, 260px)}
    #digits{--cell:min(11vh, 25vw, 150px)}
    .prizeBar{gap:10px; padding:7px 14px 7px 7px}
    .prizeBar .pbNm{font-size:clamp(14px,4vw,20px)}
  }
  /* 极窄（手机竖屏） */
  @media (max-width: 560px){
    #cards{--cw:min(calc((100vw - 30px) / 3.84), 26vh, 200px)}
    #digits{--cell:min(10vh, 26vw, 120px)}
    .prizeBar .pbSub{display:none}
    #foot{padding:6px 8px}
    #foot .keys{gap:5px}
    #foot .btn{font-size:11px; padding:6px 9px}
    #status{font-size:11px}
  }
  /* 矮扁屏（投影常见的 16:9 甚至 21:9） */
  @media (max-height: 720px){
    #cards{--cw:min(calc((100vw - 48px) / 3.84), 31vh, 280px)}
    #digits{--cell:min(14vh, 19vw, 140px)}
    .big{font-size:clamp(19px,3vw,28px)}
  }

  /* ===== 触屏设备：没有键盘，快捷键徽章纯占地方 ===== */
  @media (hover: none){
    #foot kbd{display:none}
    #foot .btn{white-space:nowrap}
  }
  /* ===== 手机横屏：舞台整体压缩，390px 高度放得下 ===== */
  @media (max-height: 520px){
    #stage{gap:clamp(2px, .7vh, 7px); padding:3px 10px}
    .phase-tag{font-size:11px; padding:3px 12px}
    /* 奖品条压扁：图标缩小、副标题隐藏 */
    .prizeBar{gap:9px; padding:4px 12px 4px 4px; border-radius:11px}
    .prizeBar .pbBox{width:clamp(34px, 11vh, 46px)}
    .prizeBar .pbBox .cell{font-size:clamp(17px, 6vh, 26px)}
    .prizeBar .pbLv{font-size:9px}
    .prizeBar .pbNm{font-size:clamp(13px, 4.4vh, 17px)}
    .prizeBar .pbSub{display:none}
    /* 滚轮以高度为准，三格加起来不超过舞台一半 */
    #digits{--cell:min(13vh, 11vw, 84px)}
    .spinBtn{
      font-size:clamp(15px, 5vh, 21px); padding:.3em 1.4em .36em;
      /* 立体底边收薄，否则会盖住紧接着的提示文字 */
      box-shadow:0 6px 0 #6d2c1e, 0 10px 14px rgba(0,0,0,.5),
                 inset 0 3px 0 rgba(255,255,255,.35);
    }
    .spinBtn, .reel{--lift:4px}
    /* 提示行不再占固定高度（定格上跳已由别处解决），留出按钮立体边的空间 */
    #dm{min-height:0; padding-top:10px; font-size:12px}
    .big{font-size:clamp(16px, 5.4vh, 24px)}
    #cards{--cw:min(calc((100vw - 48px) / 3.84), 37vh, 150px)}
    .card{--lift:4px}
    /* 卡牌的积木厚度会探出盒子外，提示语要让开，否则会被压住 */
    #cm{margin-top:14px}
  }

  /* ===== 手机横屏：底栏收成不换行的一条，把画面还给舞台 ===== */
  @media (max-height: 520px){
    #foot{
      flex-wrap:nowrap; align-items:center; gap:8px;
      padding:5px 10px; font-size:11px;
    }
    #foot .keys{
      flex-wrap:nowrap; gap:6px; min-width:0;
      overflow-x:auto; -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    #foot .keys::-webkit-scrollbar{display:none}
    #foot .btn{font-size:11px; padding:5px 9px; flex-shrink:0}
    /* 矮屏一律不显示快捷键：省空间这件事和有没有鼠标无关，
       不能只靠 hover:none 判断（鼠标驱动的模拟器会报 hover:hover） */
    #foot kbd{display:none}
    /* status 是纯文本块，靠 text-align 右对齐，不是 flex */
    #status{font-size:10px; line-height:1.3; text-align:right; max-width:46%}
  }

  /* ============ 右上角设置齿轮 ============ */
  #gear{
    position:fixed; top:14px; right:16px; z-index:200;
    width:46px; height:46px; border-radius:50%;
    background:rgba(36,36,52,.72); border:1px solid rgba(255,255,255,.14);
    color:var(--ink2); font-size:22px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    opacity:.18; transition:opacity .35s, transform .25s, background .2s;
    backdrop-filter:blur(6px);
  }
  #gear.awake{opacity:.85}
  #gear:hover{opacity:1; background:rgba(52,52,74,.9); color:var(--ink); transform:rotate(45deg)}
  #gear.on{opacity:1; right:calc(min(470px, 94vw) + 16px); background:var(--gold); color:#1a1a24}
  #gear:active{transform:rotate(90deg) scale(.94)}
  @media (pointer:coarse){ #gear{width:54px; height:54px; font-size:25px; opacity:.5} }
  /* ---------- 直接开：本档奖品跑马灯 ---------- */
  .rollRow{
    display:flex; flex-wrap:nowrap; justify-content:center; align-items:stretch;
    gap:clamp(8px,1.4vw,20px); width:min(1060px, 92vw); margin:0 auto;
  }
  .rollItem{
    flex:1 1 0; min-width:0; max-width:210px;
    border-radius:16px; padding:clamp(8px,1.3vh,15px);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(3px,.6vh,7px);
    background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
    border:2px solid rgba(255,255,255,.08);
    transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .rollItem .ico{
    width:100%; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
    font-size:clamp(30px,4.6vw,68px); line-height:1;
  }
  .rollItem .ico img{width:82%; height:82%; object-fit:contain;
                     filter:drop-shadow(0 7px 12px rgba(0,0,0,.55))}
  .rollItem .nm{
    font-size:clamp(13px,1.45vw,19px); font-weight:800; color:var(--ink2);
    text-align:center; line-height:1.2;
  }
  .rollItem .val{font-size:clamp(11px,1.1vw,15px); color:var(--ink3)}

  /* ---------- 休息页 ---------- */
  #breakLayer{

/* ---------- 六张翻牌 ---------- */
