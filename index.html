/* 把扁平清单按批次号分组。批次号可以不连续，排序后就是出场顺序 */
function groupBatches(list){
  const map = new Map();
  (list || []).forEach(p => {
    const b = Math.max(1, Math.min(99, Math.round(+p.batch) || 1));
    if (!map.has(b)) map.set(b, []);
    map.get(b).push(p);
  });
  return Array.from(map.keys()).sort((a, b) => a - b).map(no => {
    const items = map.get(no);
    return { no: no, items: items, star: items.find(x => x.star) || null };
  });
}

/* ================= 自动排批（编辑器里的「帮我排一版」）=================
   规则：最贵的单独成批当全场大奖；其余每批 4~6 件；每批先取最便宜的 n-1 件，
   再按「均价 × 倍数」去池子里挑最接近的一件当镇批之宝。
   这样倍数稳定，而且顶部的好东西不会被提前摘走。 */
function batchCount(M, MIN, MAX, IDEAL){
  if (M <= MAX) return 1;
  let best = null;
  for (let B = 1; B <= M; B++){
    const base = Math.floor(M / B), extra = M % B;
    if (base + (extra ? 1 : 0) > MAX) continue;
    if (base < MIN && B > 1) continue;
    const cost = Math.abs(M / B - IDEAL);
    if (!best || cost < best.cost) best = { B: B, cost: cost };
  }
  return best ? best.B : Math.ceil(M / MAX);
}

function autoPlan(){
  const MIN = 4, MAX = 6, IDEAL = 5;
  const R = Math.max(1.2, +cfg.starRatio || 3);
  const pool = cfg.prizes.slice().sort((a, b) => (+a.price || 0) - (+b.price || 0));
  if (pool.length < 2) return;
  cfg.prizes.forEach(p => { p.star = false; });

  const grand = [pool.pop()];
  while (grand.length < 3 && pool.length > MIN &&
         (+pool[pool.length-1].price || 0) >= (+grand[grand.length-1].price || 0) * 0.8){
    grand.push(pool.pop());
  }
  const M = pool.length;
  const B = M ? batchCount(M, MIN, MAX, IDEAL) : 0;
  const base = B ? Math.floor(M / B) : 0, extra = B ? M % B : 0;

  for (let k = 0; k < B; k++){
    const n = base + (k < extra ? 1 : 0);
    const no = k + 1;
    if (n <= 1){ pool.splice(0, n).forEach(p => { p.batch = no; p.star = true; }); continue; }
    const plain = pool.splice(0, n - 1);
    const avg = plain.reduce((a, x) => a + (+x.price || 0), 0) / plain.length;
    const want = avg * R;
    let bi = 0, bd = Infinity;
    pool.forEach((x, i) => {
      const dd = Math.abs((+x.price || 0) - want);
      if (dd < bd){ bd = dd; bi = i; }
    });
    const star = pool.splice(bi, 1)[0];
    plain.forEach(p => { p.batch = no; });
    if (star){ star.batch = no; star.star = true; }
  }
  grand.forEach(p => { p.batch = B + 1; });
  if (grand.length){
    grand.reduce((m, x) => ((+x.price || 0) >= (+m.price || 0) ? x : m), grand[0]).star = true;
  }
}

const $stage = $('stage'), $status = $('status');

let batches = [];     // [{ no, items, star }]
let bi = 0;           // 当前批下标
let deck = [];        // 当前批洗好的牌：[{ p: 奖品, by: null | 号码 }]
let drawnNums, prizeCount, cur, mode, gameStarted = false;
let breakDone = {}, autoBreak = false;

let drawTimers = [];
function clearDrawTimers(){
  drawTimers.forEach(f => { try{ f(); }catch(e){} });
  drawTimers = [];
}

const batchTag = k => (batches.length && k === batches.length - 1)
  ? '最后一批' : ('第 ' + (k + 1) + ' 批');
const isLastBatch = () => bi === batches.length - 1;
const remainCount = () => deck.filter(d => d.by === null).length;
/* 整批只有一件：不盖牌、不洗牌、不编号，奖品全程摆着，抽到号直接结算 */
const isSolo = () => deck.length === 1;

/* 牌面稀有度按批次整体递进，金色只留给最后一批：
   前面各批普通牌在 1~3 之间随批次爬升，镇批之宝 = 本批普通 + 1（最高到紫）；
   最后一批宝固定金、其余固定紫。宝一上来就金会把大奖那一下的对比冲淡。 */
function rarityOf(p){
  const star = !!(p && p.star);
  if (isLastBatch()) return star ? 5 : 4;
  const m = Math.max(1, batches.length - 1);       // 最后一批之前有几批
  const base = 1 + Math.min(2, Math.round(bi * 3 / m));
  return star ? base + 1 : base;
}

function shuffled(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function stopGame(){ stopFx(); clearDrawTimers(); stopCountdown(); }

function startGame(){
  stopGame();
  batches = groupBatches(cfg.prizes);
  bi = 0; deck = [];
  drawnNums = new Set();
  prizeCount = 0;
  cur = null;
  breakDone = {}; autoBreak = false;
  gameStarted = true;
  $('game').classList.remove('hide');
  if (!batches.length) return screenDone();
  enterBatch();
}

function enterBatch(){
  if (bi >= batches.length) return screenDone();
  deck = shuffled(batches[bi].items).map(p => ({ p: p, by: null }));
  if (isSolo()) return screenSolo();     // 就一件，没什么可盖可洗的
  screenIntro();
}

function nextBatch(){
  const prev = batches[bi];
  bi++;
  if (bi >= batches.length) return screenDone();
  if (prev && breakGate(prev.no)) return;      // 这一批勾了「发完后休息」
  enterBatch();
}

/* 休息点：某一批发完、勾了休息、且还没休息过，就停一次 */
function breakGate(no){
  if (!Array.isArray(cfg.breakAfter)) return false;
  if (cfg.breakAfter.indexOf(no) < 0 || breakDone[no]) return false;
  breakDone[no] = true;
  autoBreak = true;
  toggleBreak();
  return true;
}

const SFX_TRY = [['pop','亮相弹入'],['place','扣下'],['shuffle','洗牌'],['lever','抽号'],['tick','滚轮'],
  ['stop','刹停'],['ding','报号'],['cd','倒计时'],['sel','选牌'],['lift','滑入'],['rumble','抖动'],['flip','翻面'],
  ['popper','彩带'],['hit1','揭晓·普通'],['hit3','揭晓·宝'],['hit5','揭晓·大奖'],['claim','领奖清单'],['done','全部结束']];
let ac = null, sfxBuf = {}, sfxMaster = null;

function sfxInit(){
  if (ac) return;
  try{ ac = new (window.AudioContext || window.webkitAudioContext)(); }
  catch(e){ ac = null; return; }
  sfxMaster = ac.createGain();
  sfxMaster.connect(ac.destination);
  sfxApplyVolume();
  Object.keys(SFX_DATA).forEach(name => {
    fetch(SFX_DATA[name]).then(r => r.arrayBuffer())
      .then(ab => new Promise((ok, no) => {                 // 老 Safari 只认回调式
        const p = ac.decodeAudioData(ab, ok, no);
        if (p && p.then) p.then(ok, no);
      }))
      .then(buf => { sfxBuf[name] = buf; })
      .catch(() => {});
  });
}
function sfxUnlock(){
  sfxInit();
  if (ac && ac.state === 'suspended'){ try{ ac.resume().catch(() => {}); }catch(e){} }
}
function sfxVol(){ const v = +cfg.volume; return isNaN(v) ? 0.8 : Math.max(0, Math.min(1, v)); }
function sfxApplyVolume(){
  if (!sfxMaster) return;
  sfxMaster.gain.setTargetAtTime(cfg.mute ? 0 : sfxVol(), ac.currentTime, 0.02);
}
/* 出口：平时走总线（静音时不出声）；试听走旁路，静音也能听 */
function sfxOut(direct){
  if (!ac) return null;
  if (!direct) return cfg.mute ? null : sfxMaster;
  const g = ac.createGain(); g.gain.value = sfxVol() || 0.8; g.connect(ac.destination);
  return g;
}

/* 放一条素材：gain 音量、rate 变速、when 延后秒数 */
function sfx(name, o){
  o = o || {};
  const out = sfxOut(o.direct);
  const buf = sfxBuf[name];
  if (!out || !buf) return;
  const s = ac.createBufferSource();
  s.buffer = buf;
  s.playbackRate.value = o.rate || 1;
  const g = ac.createGain();
  g.gain.value = o.gain === undefined ? 1 : o.gain;
  s.connect(g); g.connect(out);
  s.start(ac.currentTime + (o.when || 0));
}

function noiseBuf(sec){
  const n = Math.max(1, Math.round(ac.sampleRate * sec));
  const b = ac.createBuffer(1, n, ac.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return b;
}

/* 抖动：低频噪声从无到有渐强，频率也跟着往上爬，长度 = 抖动时长 */
function sfxRumble(sec, direct){
  const out = sfxOut(direct);
  if (!out) return;
  const t = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noiseBuf(sec + 0.2);
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 0.8;
  f.frequency.setValueAtTime(90, t);
  f.frequency.exponentialRampToValueAtTime(320, t + sec);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.001, t);
  g.gain.exponentialRampToValueAtTime(0.9, t + sec);
  g.gain.setValueAtTime(0.9, t + sec);
  g.gain.exponentialRampToValueAtTime(0.001, t + sec + 0.12);
  s.connect(f); f.connect(g); g.connect(out);
  s.start(t); s.stop(t + sec + 0.2);
}

/* 彩带礼炮：一声「砰」（噪声短爆 + 低频顿）接一小串纸屑沙沙 */
function sfxPopper(direct){
  const out = sfxOut(direct);
  if (!out) return;
  const t = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noiseBuf(0.5);
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 0.6;
  f.frequency.setValueAtTime(2600, t);
  f.frequency.exponentialRampToValueAtTime(700, t + 0.18);
  const g = ac.createGain();
  g.gain.setValueAtTime(1.0, t);
  g.gain.exponentialRampToValueAtTime(0.25, t + 0.12);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
  s.connect(f); f.connect(g); g.connect(out);
  s.start(t); s.stop(t + 0.5);
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(190, t);
  o.frequency.exponentialRampToValueAtTime(55, t + 0.14);
  const og = ac.createGain();
  og.gain.setValueAtTime(0.7, t);
  og.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
  o.connect(og); og.connect(out);
  o.start(t); o.stop(t + 0.18);
}

/* 编辑器「试听」：静音状态下也能听（走旁路） */
function sfxTry(name){
  sfxUnlock();
  if (name === 'rumble') return sfxRumble(0.9, true);
  if (name === 'popper') return sfxPopper(true);
  sfx(name, { direct: true });
}

/* ---------- 换舞台内容 ----------
   统一的切屏过渡：旧画面淡出并轻微下沉（.out，.18s）→ 换内容 → 新画面从上方淡入（.24s），背景图案不动。
   以前是整块 innerHTML 直接换，用户反馈像跳切（2026-10-29）。舞台还空着的第一屏直接铺、不淡入。
   各 screen 函数在调用前就把 mode 设好，所以过渡那 .18s 里的按键按新屏算：抽号按钮还没进 DOM 时
   pressSpin 自己会跳过，推进键本来就有 350ms 节流。要摸新 DOM 的事（绑按钮、量尺寸、起倒计时）放 after 里。 */
const OUT_DUR = 180;
let stageSwap = 0;
function setStage(html, after){
  const fill = (fade) => {
    stageSwap = 0;
    $stage.innerHTML = html;
    $stage.classList.remove('out');
    if (fade){                                   // 从「上方 + 透明」过渡到常态
      $stage.style.transition = 'none';
      $stage.style.opacity = '0';
      $stage.style.transform = 'translateY(-12px)';
      void $stage.offsetWidth;
      $stage.style.transition = '';
      $stage.style.opacity = '';
      $stage.style.transform = '';
    }
    if (after) after();
  };
  if (stageSwap) clearTimeout(stageSwap);
  if (!$stage.children.length) return fill(false);
  $stage.classList.add('out');
  stageSwap = setTimeout(() => fill(true), OUT_DUR);
}

function screenIntro(){
  mode = 'intro';
  stopFx(); clearDrawTimers(); stopCountdown();
  document.body.classList.add('compact');
  const b = batches[bi];
  // 亮相按配置顺序摆、正面朝上、背面不印数字；
  // 洗牌会把它们真的挪到 deck 的顺序上，编号等洗完才发
  setStage(
    '<div class="phase-tag">' + batchTag(bi) + '</div>' +
    '<div class="big" id="bg">这一批 ' + b.items.length + ' 件</div>' +
    '<div id="cards" class="pGrid big" style="--cols:' + gridCols(b.items.length) + '">' +
      b.items.map((p, ii) => {
        const r = rarityOf(p);
        return '<div class="card pk flipped' + (p.star ? ' starCard' : '') +
                 '" data-r="' + r + '" data-ii="' + ii + '">' +
          cardFxHTML(r) +
          '<div class="inner">' +
            '<div class="face front">' +
              (p.star ? '<div class="starTag">本批最大</div>' : '') +
              faceHTML(p, null) +
            '</div>' +
            '<div class="face back"><div class="num"></div></div>' +
          '</div></div>';
      }).join('') + '</div>' +
    '<div class="sub" id="cm">看清楚了 —— 等下它们会被扣过来　<kbd>空格</kbd> 洗牌</div>',
    enterAnim);
  renderStatus();
  saveGame();
}

/* ---------- 洗牌 ----------
   真的换位置，不是原地抖：量出每张牌当前的位置 → 位移到目标槽位 → 过渡跑完后
   重排 DOM 并清掉位移（FLIP）。最后一跳直接落到 deck 的真实顺序，所以落位之后
   屏幕上的顺序就是后面翻牌要用的顺序，不再偷偷重建一套。
   编号一律等洗完才发 —— 否则「数字先印好再抖」谁都看得出是假的。 */
function hopCards(grid, cur, perm, ms, done){
  const before = cur.map(el => el.getBoundingClientRect());
  const dest = [];
  perm.forEach((from, slot) => { dest[from] = before[slot]; });   // perm[槽位] = cur 里的第几张
  cur.forEach((el, i) => {
    const b0 = before[i], t0 = dest[i];
    if (!t0) return;
    el.style.transition = 'transform ' + ms + 'ms cubic-bezier(.4,.05,.25,1)';
    el.style.transform = 'translate(' + Math.round(t0.left - b0.left) + 'px,' +
                                        Math.round(t0.top - b0.top) + 'px)';
  });
  const h = setTimeout(() => {
    const next = perm.map(i => cur[i]);
    // 清位移和重排放在同一个同步块里，浏览器只画最终结果，看不到回跳
    next.forEach(el => { el.style.transition = 'none'; el.style.transform = ''; });
    next.forEach(el => grid.appendChild(el));
    void grid.offsetWidth;
    next.forEach(el => { el.style.transition = ''; });
    done(next);
  }, ms + 30);
  drawTimers.push(() => clearTimeout(h));
}

/* 洗完才发号，一张一张弹出来 */
function stampNumbers(els, done){
  els.forEach((el, i) => {
    const n = el.querySelector('.face.back .num');
    if (!n) return;
    n.textContent = String(i + 1);
    n.style.animationDelay = (i * 90) + 'ms';
    n.classList.remove('pop'); void n.offsetWidth; n.classList.add('pop');
  });
  const t = setTimeout(done, els.length * 90 + 560);
  drawTimers.push(() => clearTimeout(t));
}

function doShuffle(){
  if (mode !== 'intro') return;
  mode = 'anim';
  const grid = $('cards');
  const els = Array.from(grid.querySelectorAll('.card'));
  if (!grid || !els.length) return nextPick();

  // 一、原地扣下。背面只有花纹，没有数字
  els.forEach(el => {
    el.classList.remove('flipped', 'starCard', 'enter');
    el.style.animationDelay = '';
    el.setAttribute('data-r', '1');
    const fx = el.querySelector('.fx');
    if (fx) fx.outerHTML = cardFxHTML(1);
    const n = el.querySelector('.face.back .num');
    if (n){ n.textContent = ''; n.classList.remove('pop'); n.style.animationDelay = ''; }
  });
  setBig('扣下');
  setSub('');
  sfx('place', { gain: 0.9 });

  const items = batches[bi].items;
  const itemOf = el => items[+el.dataset.ii];

  const begin = () => {
    if (els.length < 2){                      // 一张牌没什么可洗的
      setBig('就这一件');
      return stampNumbers(els, nextPick);
    }
    setBig('洗牌');
    setSub('看得住哪张算哪张');
    sfx('shuffle');
    let cur = els, round = 0;
    const HOPS = 2;
    const step = () => {
      let perm;
      if (round < HOPS){
        perm = cur.map((_, i) => i);
        for (let i = perm.length - 1; i > 0; i--){
          const j = Math.floor(Math.random() * (i + 1));
          const t = perm[i]; perm[i] = perm[j]; perm[j] = t;
        }
      } else {
        // 最后一跳：落到 deck 的真实顺序
        perm = deck.map(d => cur.findIndex(el => itemOf(el) === d.p));
        if (perm.some(i => i < 0)) perm = cur.map((_, i) => i);   // 认不出来就原地不动，别把牌弄丢
      }
      hopCards(grid, cur, perm, round < HOPS ? 400 : 560, next => {
        cur = next;
        if (++round > HOPS){
          setBig('发牌号');
          setSub('');
          return stampNumbers(cur, nextPick);
        }
        step();
      });
    };
    step();
  };

  // 等翻面那 .82s 的过渡走完再开始挪，否则量到的是半翻状态的位置
  const t0 = setTimeout(begin, 900);
  drawTimers.push(() => clearTimeout(t0));
}

/* ---------- 一轮：抽号 → 翻牌 → 揭晓 ---------- */
function nextPick(){
  stopCountdown();
  saveGame();
  if (!deck.length || remainCount() === 0) return screenBatchDone();
  if (isSolo()) return screenSolo();
  screenSpin();
}

function screenSpin(){
  mode = 'prize';
  cur = { num: 0, sel: firstUnopened() };
  stopFx(); clearDrawTimers();
  document.body.classList.add('compact');
  setStage(
    '<div class="phase-tag">' + batchTag(bi) + '</div>' +
    '<div class="big" id="bg">还剩 ' + remainCount() + ' 件 · 抽下一位</div>' +
    slotHTML() +
    '<div class="spinHold" id="spinHold">' +
      '<button class="spinBtn" id="spinBtn">抽 号</button></div>' +
    '<div class="hint" id="dm">点按钮，或按 <kbd>空格</kbd></div>' +
    stripHTML() +
    '<div class="sub" id="cm"></div>',
    () => { idleReels(); bindSpinBtn(); });
  renderStatus();
}

function firstUnopened(){
  for (let i = 0; i < deck.length; i++) if (deck[i].by === null) return i;
  return 0;
}

function screenPick(){
  mode = 'pick';
  cur.sel = firstUnopened();
  cur.touched = false;        // 预高亮那张只是倒计时的默认牌，不算有人选过
  stopFx(); clearDrawTimers();
  document.body.classList.add('compact');
  setStage(
    '<div class="phase-tag">' + batchTag(bi) + '</div>' +
    '<div class="big" id="bg">' + pad(cur.num) + ' 号 · 翻一张</div>' +
    '<div class="cd" id="cd"></div>' +
    cardsGridHTML(true) +
    '<div class="sub" id="cm">喊个数字就行　·　不说话也可以，倒计时结束会自动翻</div>',
    () => { markSel(); startCountdown(); });
  renderStatus();
}

function markSel(){
  Array.from($stage.querySelectorAll('.card.pk')).forEach((el, i) =>
    el.classList.toggle('sel', i === cur.sel && deck[i] && deck[i].by === null));
}

function moveSel(d){
  if (mode !== 'pick') return;
  const n = deck.length;
  let i = cur.sel;
  for (let k = 0; k < n; k++){
    i = (i + d + n) % n;
    if (deck[i].by === null) break;
  }
  cur.sel = i;
  cur.touched = true;
  sfx('sel', { gain: 0.45 });
  markSel();
}

/* 点牌 / 按数字都是两段式：第一下只选中（上浮高亮），再点同一张才翻。
   进屏时第 1 张是预高亮的（倒计时归零翻它），但没人动过选择之前点它也只算选中 ——
   永远两下，不用记特例。空格 / Enter / 倒计时归零走 openCard，照旧直接翻高亮那张。 */
function pickCard(i){
  if (mode !== 'pick') return;
  if (i < 0 || i >= deck.length || deck[i].by !== null) return;
  if (cur.touched && i === cur.sel) return openCard(i);
  cur.sel = i;
  cur.touched = true;
  sfx('sel', { gain: 0.5 });
  markSel();
  setSub('选了第 ' + (i + 1) + ' 张　·　再点一次或按 <kbd>空格</kbd> 翻开');
}

function openCard(i){
  if (mode !== 'pick') return;
  const d = deck[i];
  if (!d || d.by === null && !cur.num) return;
  if (!d || d.by !== null) return;
  stopCountdown();
  mode = 'anim';
  d.by = cur.num;
  prizeCount++;
  saveGame();                 // 牌一翻就存，别等演出放完
  const r = rarityOf(d.p);
  const cd = $('cd'); if (cd) cd.innerHTML = '';
  setSub('……');
  playReveal($stage.querySelectorAll('.card.pk')[i], d, r,
    pad(d.by) + ' 号 · 获得 <em>' + esc(d.p.nm) + '</em>',
    remainCount() ? '按 <kbd>空格</kbd> 抽下一位'
                  : '这一批翻完了　按 <kbd>空格</kbd> 看领奖名单');
}

/* 揭晓的那套演出（顺序 2026-10-29 定）：
   牌扣着从原位滑到舞台正中放大（lifting，LIFT_DUR）→ 到位后牌背抖动、辉光按真实品质亮起、背景压暗
   （charging，时长按品质 REVEAL.charge；故意剧透品质，当翻面前的预告）→ 抖到头：彩带 + 翻面
   → 翻到一半正面露出：白闪 + 震屏 + 大字 → 翻完停 SHOW_HOLD → 滑回原位。
   回原位是为了这一屏接着能看见「还剩什么」；展示没放完按空格也能直接走 */
const SHOW_HOLD = 1600, HOME_DUR = 560, LIFT_DUR = 700, FLIP_DUR = 820, FLIP_MID = 380;   // LIFT_DUR ≥ CSS 的 .66s

/* 算这张牌到舞台中心的位移和放大倍率，写进牌自己的 CSS 变量。
   舞台是 overflow:hidden，倍率要保证放大后整张牌还在舞台里，手机上不裁边 */
function aimCenter(el){
  const st = $stage.getBoundingClientRect();
  const r = el.getBoundingClientRect();
  if (!r.width || !r.height) return;
  // 牌阵进屏有 popIn 缩放动画，祖先若还带着缩放，translate 是在缩放空间里走的：
  // 用父元素的「屏幕矩形 / 布局尺寸」算祖先倍率 —— 用牌自己算会把高亮姿态的放大/微转也算进去
  const par = el.parentElement || el;
  const pr = par.getBoundingClientRect();
  const k = par.offsetWidth ? pr.width / par.offsetWidth : 1;
  // 量的时候牌多半还在高亮姿态（抬起 20px）：transform-origin 在中心，矩阵的 e/f 就是中心的位移，扣掉
  let ox = 0, oy = 0;
  try{
    const m = new DOMMatrix(getComputedStyle(el).transform);
    if (m.is2D){ ox = m.e; oy = m.f; }
  }catch(e){}
  const w = el.offsetWidth * k, h = el.offsetHeight * k;      // 静止时在屏幕上的尺寸
  const cx = r.left + r.width / 2 - ox * k;                    // 静止时的中心
  const cy = r.top + r.height / 2 - oy * k;
  const pad = 14;
  const fit = Math.min((st.width - pad * 2) / w, (st.height - pad * 2) / h);
  const zs = Math.max(1, Math.min(1.6, fit));
  const dx = Math.round((st.left + st.width / 2 - cx) / k);
  const dy = Math.round((st.top + st.height / 2 - cy) / k);
  el.style.setProperty('--dx', dx + 'px');
  el.style.setProperty('--dy', dy + 'px');
  el.style.setProperty('--zs', zs.toFixed(3));
  el.style.setProperty('--zsm', (1 + (zs - 1) * .55).toFixed(3));
}

function goHome(el){
  el.classList.remove('showing');
  el.classList.add('homing');
  const t = setTimeout(() => {
    el.classList.remove('homing');
    ['--dx', '--dy', '--zs', '--zsm'].forEach(k => el.style.removeProperty(k));
  }, HOME_DUR + 60);
  drawTimers.push(() => clearTimeout(t));
}

function playReveal(el, d, r, bigHTML, subHTML){
  const T = REVEAL[r] || REVEAL[2];
  if (el){
    const front = el.querySelector('.face.front');
    if (front) front.innerHTML = faceHTML(d.p, d.by);   // 正面先填好，翻过来才有东西；扣着时看不见
    aimCenter(el);                 // 先量（aimCenter 会扣掉高亮姿态的位移），
    el.classList.remove('sel');    // 再在同一拍摘高亮 + 起滑入：过渡从当前姿态直接出发，不先掉回原位
    el.classList.add('lifting');
    sfx('lift', { gain: 0.8 });
  }
  const t0 = setTimeout(() => {                          // 到位：开始抖
    if (el){
      el.classList.remove('lifting');
      if (cfg.tease){                                    // 预告：抖动阶段就按真实品质抖和亮
        el.setAttribute('data-r', String(r));
        const fx = el.querySelector('.fx');
        if (fx) fx.outerHTML = cardFxHTML(r);
      } else el.classList.add('plain');                  // 不预告：中性暖白光，品质留到翻面那一刻
      el.classList.add('charging');
    }
    document.documentElement.style.setProperty('--chargeDur', T.charge + 'ms');
    sfxRumble(T.charge / 1000);
    const vig = $('vig');
    if (vig){ vig.classList.remove('on'); void vig.offsetWidth; vig.classList.add('on'); }

    const t1 = setTimeout(() => {                        // 抖到头：彩带 + 翻面
      if (el){
        el.classList.remove('charging', 'plain'); el.classList.add('showing');
        if (!cfg.tease){
          el.setAttribute('data-r', String(r));
          const fx = el.querySelector('.fx');
          if (fx) fx.outerHTML = cardFxHTML(r);
        }
        void el.offsetWidth;
        el.classList.add('flipped');
        startConfetti(el, T.conf);
        sfx('flip');
        sfxPopper();
      }
      if (vig) vig.classList.remove('on');

      const t2 = setTimeout(() => {                      // 翻到一半，正面露出来
        if (T.flash){
          const f = $('flash');
          f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
        }
        if (T.shake){
          const g = $('game');
          g.classList.remove('shk','shk-lite'); void g.offsetWidth; g.classList.add(T.shake);
          const t3 = setTimeout(() => g.classList.remove('shk','shk-lite'), 460);
          drawTimers.push(() => clearTimeout(t3));
        }
        sfx(r >= 5 ? 'hit5' : r >= 3 ? 'hit3' : 'hit1');
        setBig(bigHTML);
        setSub(subHTML);
        mode = 'reveal';
        renderStatus();
        saveGame();
      }, FLIP_MID);
      drawTimers.push(() => clearTimeout(t2));

      if (el){
        const t4 = setTimeout(() => goHome(el), FLIP_DUR + SHOW_HOLD);
        drawTimers.push(() => clearTimeout(t4));
      }
    }, T.charge);
    drawTimers.push(() => clearTimeout(t1));
  }, LIFT_DUR);
  drawTimers.push(() => clearTimeout(t0));
}

/* ---------- 单件批次：牌扣着，只等号码 ----------
   不洗不编号（就一张），但也不亮相：大字只说「全场最大的奖」，是什么要翻开才知道。
   抽到号 → 空格 → 翻过来 → 走和普通牌一样的揭晓演出 */
function screenSolo(){
  mode = 'prize';
  cur = { num: 0, sel: 0 };
  stopFx(); clearDrawTimers(); stopCountdown();
  document.body.classList.add('compact');
  setStage(
    '<div class="phase-tag">' + batchTag(bi) + '</div>' +
    '<div class="big" id="bg">' +
      (bi === batches.length - 1 ? '全场最大的奖' : '这一批就这一件') + '</div>' +
    // 奖品和滚轮并排：竖着摞会把标题和按钮挤出屏幕，横向空间反而一直空着
    '<div class="soloRow">' +
      '<div id="cards" class="pGrid solo" style="--cols:1">' +
        '<div class="card pk" data-r="1" data-i="0">' +     // 扣着时和普通牌一样一档辉光，翻开再升
          cardFxHTML(1) +
          '<div class="inner">' +
            '<div class="face front"></div>' +
            '<div class="face back"><div class="num"></div></div>' +
          '</div></div>' +
      '</div>' +
      '<div class="soloSlot">' + slotHTML() +
        '<div class="spinHold" id="spinHold">' +
          '<button class="spinBtn" id="spinBtn">抽 号</button></div>' +
      '</div>' +
    '</div>' +
    '<div class="hint" id="dm">点按钮，或按 <kbd>空格</kbd></div>' +
    '<div class="sub" id="cm"></div>',
    () => { idleReels(); bindSpinBtn(); });
  renderStatus();
  saveGame();
}

function soloReveal(){
  const d = deck[0];
  if (!d || d.by !== null) return;
  mode = 'anim';
  d.by = cur.num;
  prizeCount++;
  saveGame();
  const r = rarityOf(d.p);
  const el = $stage.querySelector('.card.pk');
  setSub('……');
  playReveal(el, d, r,
    pad(d.by) + ' 号 · 获得 <em>' + esc(d.p.nm) + '</em>',
    '按 <kbd>空格</kbd> 继续');
}

/* ---------- 倒计时 ---------- */
let cdTimer = 0, cdLeft = 0;
function stopCountdown(){ if (cdTimer){ clearInterval(cdTimer); cdTimer = 0; } }
function paintCd(){
  const e = $('cd');
  if (e) e.innerHTML = '<span class="cdN' + (cdLeft <= 5 ? ' urge' : '') + '">' + cdLeft + '</span>';
}
function startCountdown(){
  stopCountdown();
  cdLeft = Math.max(0, Math.round(+cfg.pickSeconds) || 0);
  const e = $('cd');
  if (!cdLeft){ if (e) e.innerHTML = ''; return; }
  paintCd();
  cdTimer = setInterval(() => {
    cdLeft--;
    paintCd();
    if (cdLeft > 0 && cdLeft <= 5) sfx('cd', { gain: 0.6, rate: cdLeft <= 2 ? 1.25 : 1 });
    if (cdLeft <= 0){
      stopCountdown();
      if (mode === 'pick') openCard(cur.sel);
    }
  }, 1000);
  drawTimers.push(stopCountdown);
}

/* ---------- 批次结算 = 领奖清单 ---------- */
function screenBatchDone(){
  mode = 'batchDone';
  stopFx(); clearDrawTimers(); stopCountdown();
  sfx('claim', { when: 0.2 });
  document.body.classList.remove('compact');
  setStage(
    '<div class="phase-tag">' + batchTag(bi) + '</div>' +
    '<div class="big" id="bg">这一批发完了 · 请以下几位领奖</div>' +
    '<div id="claim">' + deck.map(d =>
      '<div class="cw' + (d.p.star ? ' st' : '') + '">' +
        '<span class="cn">' + pad(d.by) + '</span>' +
        '<span class="ci">' + itemHTML(d.p) + '</span>' +
        '<span class="cm2">' + esc(d.p.nm) + '</span></div>').join('') + '</div>' +
    '<div class="sub" id="cm">' +
      (bi + 1 < batches.length ? '按 <kbd>空格</kbd> 进入下一批' : '按 <kbd>空格</kbd> 结束') +
    '</div>');
  renderStatus();
  saveGame();
}

function screenDone(){
  mode = 'done';
  stopFx(); clearDrawTimers(); stopCountdown();
  sfx('done', { when: 0.2 });
  document.body.classList.remove('compact');
  setStage(
    '<div class="big" id="bg">全部发放完毕</div>' +
    '<div class="sub" id="cm">' + prizeCount + ' 位拿到奖品</div>' +
    '<div class="hint">按 <kbd>R</kbd> 重开全场</div>');
  renderStatus();
  clearSave();
}

function renderStatus(){
  const bits = [];
  if (batches.length) bits.push(batchTag(bi) + ' / 共 ' + batches.length + ' 批');
  if (deck.length) bits.push('本批剩 ' + remainCount() + ' 件');
  bits.push('已中奖 ' + prizeCount);
  bits.push('号码池 ' + Math.max(0, cfg.guests - (drawnNums ? drawnNums.size : 0)));
  if (cfg.mute) bits.push('\u{1F507} 静音');
  $status.innerHTML = bits.join(' 　 ');
}

function slotHTML(){
  const cells = [];
  for (let c = 0; c < 16; c++)
    for (let d = 0; d < 10; d++) cells.push('<div class="rcell">' + d + '</div>');
  const strip = cells.join('');
  return '<div id="slot">' +
    '<div id="digits">' +
      [0,1,2].map(()=>'<div class="reel"><div class="rstrip">' + strip + '</div></div>').join('') +
      '<div class="payline"></div>' +
    '</div>' +
  '</div>';
}
let spinArmed = false;      // 按下压缩、松开弹起，弹起那一下才开始转
function bindSpinBtn(){
  const b = $('spinBtn');
  if (!b) return;
  spinArmed = false;
  b.addEventListener('pointerdown', e => { e.preventDefault(); pressSpin(); });
  b.addEventListener('pointerup',    e => { e.preventDefault(); releaseSpin(); });
  b.addEventListener('pointerleave', () => {                    // 手指滑走就取消
    if (spinArmed){ spinArmed = false; b.classList.remove('press'); }
  });
}
function pressSpin(){
  if (mode !== 'prize' || spinArmed) return;
  const b = $('spinBtn');
  if (!b) return;
  spinArmed = true;
  b.classList.remove('bounce');
  b.classList.add('press');
}
function releaseSpin(){
  if (mode !== 'prize' || !spinArmed) return;
  const b = $('spinBtn'), hold = $('spinHold');
  spinArmed = false;
  if (!b) return screenDraw();
  b.classList.remove('press');
  void b.offsetWidth;
  b.classList.add('bounce');
  if (hold) hold.classList.add('dead');
  const t = setTimeout(screenDraw, 190);      // 弹到最高点时开转
  drawTimers.push(() => clearTimeout(t));
}
function doSpin(){
  if (mode !== 'prize') return;
  pressSpin();
  const t = setTimeout(releaseSpin, 130);
  drawTimers.push(() => clearTimeout(t));
}
function idleReels(){
  const box = $('digits');
  if (!box) return;
  const cell = Math.max(24, Math.round(box.getBoundingClientRect().height / 3));
  box.style.setProperty('--cell', cell + 'px');
  Array.from(box.querySelectorAll('.rstrip')).forEach(st => {
    const k = 20 + Math.floor(Math.random() * 10);
    st.style.transition = 'none';
    st.style.transform = 'translateY(' + (-(k - 1) * cell) + 'px)';
  });
}
/* ---------- 抽号 ----------
   同一台老虎机，三种节奏（drawTempo）：
     完整 —— 每批第一位、本批最后一位：三个滚轮依次刹停，约 3.8 秒
     快停 —— 中间的人：三轮几乎同时刹车，约 1.7 秒
     压轴 —— 最后一批：最慢，约 5.2 秒
   滚动中再按一次推进键（空格 / 翻页笔 / 点画面）= 剩下的滚轮立刻依次刹停（brakeNow）。
   起立坐下的梗去掉了（现场玩不起来）：前两轮停下不出字，第三轮停稳才报号。 */
let brakeFn = null;                     // 只在滚动中有效，滚完即清

function drawTempo(){
  if (isLastBatch()) return { first:650, gap:1500, brake:1500, turns:2 };
  const n = remainCount();
  if (n === deck.length || n === 1) return { first:650, gap:1000, brake:1150, turns:2 };
  return { first:500, gap:200, brake:800, turns:1 };
}

function brakeNow(){ if (brakeFn) brakeFn(); }

function screenDraw(){
  mode = 'drawing';
  stopFx();
  clearDrawTimers();
  brakeFn = null;
  const pool = [];
  for (let i=1; i<=cfg.guests; i++) if (!drawnNums.has(i)) pool.push(i);
  if (!pool.length) return screenDone();

  const num = pool[Math.floor(Math.random()*pool.length)];
  cur.num = num; drawnNums.add(num);
  const str = pad(num);

  // 复用抽号那一屏已经在场上的老虎机，不重建 DOM
  const box = $('digits');
  if (!box) return isSolo() ? screenSolo() : screenSpin();   // 滚轮还没搭好，先把那一屏铺出来
  const reels = Array.from(box.querySelectorAll('.reel'));
  const strips = reels.map(r => r.querySelector('.rstrip'));
  reels.forEach(r => r.classList.remove('locked'));
  strips.forEach(st => {
    st.style.transition = 'none'; st.classList.add('fast');
    const h = st.querySelector('.rcell.hit');
    if (h) h.classList.remove('hit');
  });
  const dm0 = $('dm'); if (dm0) dm0.textContent = '滚动中…';
  sfx('lever');
  let lastTick = 0;
  renderStatus();

  const cell = Math.max(24, Math.round(box.getBoundingClientRect().height / 3));
  box.style.setProperty('--cell', cell + 'px');

  const LOOP = cell * 10;                             // 一圈的像素高度
  const ys = strips.map(st => {
    const m = /translateY\((-?[\d.]+)px\)/.exec(st.style.transform || '');
    return m ? parseFloat(m[1]) : 0;
  });
  const spinning = [true, true, true];
  const SPEED = cell * 0.62;                          // 每帧滚动距离

  // 让第 k 格停在中间：y = -(k-1)*cell，居中的那一格下标就是 k
  function targetY(cy, digit, minTurns){
    const curK = (-cy / cell) + 1;
    let k = Math.ceil(curK) + minTurns * 10;
    k += ((digit - (k % 10)) + 10) % 10;
    return { y: -(k - 1) * cell, k: k };
  }

  let spinRaf = 0;
  function tick(){
    for (let i = 0; i < 3; i++){
      if (!spinning[i]) continue;
      ys[i] -= SPEED;
      if (ys[i] <= -LOOP) ys[i] += LOOP;              // 无缝绕回
      strips[i].style.transform = 'translateY(' + ys[i] + 'px)';
    }
    const nowT = performance.now();                 // 滚轮滴答：约 18 下/秒，像一台真的在转的机器
    if (nowT - lastTick > 55){ lastTick = nowT; sfx('tick', { gain: 0.35, rate: 1.1 + Math.random() * 0.1 }); }
    if (spinning.some(Boolean)) spinRaf = requestAnimationFrame(tick);
  }
  spinRaf = requestAnimationFrame(tick);
  drawTimers.push(() => cancelAnimationFrame(spinRaf));

  const tempo = drawTempo();
  const t0 = Date.now();
  const state = [0, 0, 0];                            // 0 转着 / 1 刹车中 / 2 停稳
  const doneT = [0, 0, 0], tgtK = [0, 0, 0];
  let doneN = 0;
  const pend = [];                                    // 还没执行的「停第 i 轮」

  function settle(i){
    state[i] = 2;
    reels[i].classList.add('locked');
    sfx('stop', { gain: 0.8, rate: 1 + i * 0.06 });
    const hit = strips[i].children[tgtK[i]];
    if (hit) hit.classList.add('hit');
    if (++doneN === 3){                               // 三轮都停稳才报号（刹停时先后可能交错）
      brakeFn = null;
      mode = 'drawn';
      sfx('ding', { when: 0.05 });
      const dm = $('dm');
      if (dm) dm.innerHTML = '请 <b style="color:var(--gold)">' + str + '</b> 号的朋友站起来';
    }
  }

  function stopReel(i, brake, turns){
    if (state[i] === 2) return;
    const st = strips[i];
    const ease = 'transform ' + brake + 'ms cubic-bezier(.16,.86,.27,1)';
    if (state[i] === 1){                              // 已在慢刹：换短刹，目标不变
      clearTimeout(doneT[i]);                         // （抖 0.01px 让过渡从当前位置重新起算）
      st.style.transition = ease;
      st.style.transform = 'translateY(' + (ys[i] + 0.01) + 'px)';
    } else {
      state[i] = 1; spinning[i] = false;
      const tgt = targetY(ys[i], +str[i], turns);
      tgtK[i] = tgt.k; ys[i] = tgt.y;
      st.classList.remove('fast');
      st.style.transition = ease;
      st.style.transform = 'translateY(' + tgt.y + 'px)';
    }
    doneT[i] = setTimeout(() => settle(i), brake);
    const id = doneT[i];
    drawTimers.push(() => clearTimeout(id));
  }

  [0,1,2].forEach(i => {
    const t = setTimeout(() => stopReel(i, tempo.brake, tempo.turns), tempo.first + i * tempo.gap);
    pend.push(t);
    drawTimers.push(() => clearTimeout(t));
  });

  // 主持人油门：没停稳的滚轮按顺序立刻刹停（在慢刹的也换成短刹）。刚开转那一下（<450ms）不认，防手抖连按。
  brakeFn = () => {
    if (mode !== 'drawing' || Date.now() - t0 < 450) return;
    pend.forEach(clearTimeout);
    let k = 0;
    for (let i = 0; i < 3; i++){
      if (state[i] === 2) continue;
      const d = (k++) * 120;
      if (!d){ stopReel(i, 450, 1); continue; }
      const t = setTimeout(() => stopReel(i, 450, 1), d);
      drawTimers.push(() => clearTimeout(t));
    }
    brakeFn = null;
  };
}

const REVEAL = {
  1: { charge: 700,  flash:true, shake:null,       conf:.7  },
  2: { charge: 780,  flash:true, shake:'shk-lite', conf:1.0 },

let raf2 = 0;
function clearVig(){
  const v = $('vig');
  if (v) v.classList.remove('on');
}
function stopFx(){
  clearVig();
  cancelAnimationFrame(raf2); raf2 = 0;
  const cv = document.getElementById('fx');
  if (cv && cv.width) cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
}
function startConfetti(originEl, intensity){
  stopFx();
  const cv = document.getElementById('fx');
  if (!cv || !originEl) return;

  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = window.innerWidth, H = window.innerHeight;
  cv.width  = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);

  const r = originEl.getBoundingClientRect();
  const ox = r.left + r.width / 2;
  const oy = r.top + r.height / 2;
  const RW = r.width;

  const COLORS = ['#ffd54a','#e0533f','#5aa84f','#4a8ce0','#f2f0ff','#ff9ad5'];
  const CANNONS = [-118, -62];        // 左上、右上，比之前更竖直
  const SPREAD  = 20;                 // 张角收窄
  const ps = [];

  function make(o){
    return Object.assign({
      w: 5 + Math.random() * 7,
      h: 9 + Math.random() * 11,
      rz: Math.random() * Math.PI * 2,               // 平面内旋转
      vrz: (Math.random() - 0.5) * 0.26,
      rx: Math.random() * Math.PI * 2,               // 翻面相位
      vrx: 0.06 + Math.random() * 0.16,              // 每片翻面快慢不同
      drag: 0.975 + Math.random() * 0.02,            // 空气阻力
      term: 1.6 + Math.random() * 3.4,               // 终端速度 —— 飘落快慢随机
      flut: 0.5 + Math.random() * 1.6,               // 翻面带来的横向摆幅
      col: COLORS[(Math.random() * COLORS.length) | 0],
      life: 1, decay: 0.0025 + Math.random() * 0.0035
    }, o);
  }

  // 一、两门礼炮：力度收小，让彩带在卡片附近升起再落下
  const nBurst = Math.round(90 * intensity);
  for (let i = 0; i < nBurst; i++){
    const ang = (CANNONS[i % 2] + (Math.random() - 0.5) * SPREAD) * Math.PI / 180;
    const sp = (4.5 + Math.random() * 6.5) * intensity;
    const d0 = Math.random() * 10;
    ps.push(make({
      x: ox + Math.cos(ang) * d0,
      y: oy + Math.sin(ang) * d0,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp
    }));
  }

  // 二、飘落层：在奖品上方铺开，慢慢从正面划过
  const nDrift = Math.round(34 * intensity);
  for (let i = 0; i < nDrift; i++){
    ps.push(make({
      x: ox + (Math.random() - 0.5) * RW * 2.1,
      y: oy - RW * (0.7 + Math.random() * 1.3),
      vx: (Math.random() - 0.5) * 1.6,
      vy: 0.3 + Math.random() * 1.4,
      decay: 0.0018 + Math.random() * 0.0022
    }));
  }

  const G = 0.22;
  let t = 0;
  function fr(){
    t += 1 / 60;
    g.clearRect(0, 0, W, H);
    let alive = 0;
    for (const p of ps){
      p.vy += G;
      if (p.vy > p.term) p.vy += (p.term - p.vy) * 0.12;   // 逼近终端速度
      p.vx *= p.drag;
      p.rx += p.vrx;
      p.rz += p.vrz;
      p.x += p.vx + Math.sin(p.rx) * p.flut;               // 翻面时左右打滑
      p.y += p.vy;
      if (t > 1.1) p.life -= p.decay;
      if (p.life <= 0 || p.y > H + 40) continue;
      alive++;
      const flip = Math.cos(p.rx);                          // 翻面：厚度方向的投影
      g.save();
      g.globalAlpha = Math.max(0, Math.min(1, p.life));
      g.translate(p.x, p.y);
      g.rotate(p.rz);
      g.scale(1, Math.abs(flip) * 0.9 + 0.1);
      g.fillStyle = p.col;
      g.globalAlpha *= (0.62 + Math.abs(flip) * 0.38);      // 侧面偏暗，像真纸片
      g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      g.restore();
    }
    if (!alive){ stopFx(); return; }
    raf2 = requestAnimationFrame(fr);
  }
  raf2 = requestAnimationFrame(fr);
}

/* ================= 进度保存与恢复 ================= */
function cfgFingerprint(){
  return cfg.guests + '|' + cfg.prizes.map(p => p.batch + ':' + p.nm).join('|');
}

function saveGame(){
  if (!gameStarted || !batches.length) return;
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      fp: cfgFingerprint(),
      ts: Date.now(),
      bi: bi,
      // 牌存成「在本批 items 里的下标」，避免把图片的 base64 再存一遍
      deck: deck.map(d => [batches[bi].items.indexOf(d.p), d.by]),
      drawn: Array.from(drawnNums),
      prizeCount: prizeCount,
      breakDone: breakDone,
      mode: (mode === 'intro' ? 'intro' : 'play'),
    }));
  }catch(e){ /* 隐私模式或容量满，放弃保存即可 */ }
}

function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || s.fp !== cfgFingerprint()) return null;
    if (!s.drawn || !s.drawn.length) return null;        // 还没抽过，没必要恢复
    return s;
  }catch(e){ return null; }
}

function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

function restoreGame(s){
  batches = groupBatches(cfg.prizes);
  bi = Math.max(0, Math.min(batches.length - 1, +s.bi || 0));
  const items = batches[bi].items;
  deck = (s.deck || []).map(x => ({ p: items[x[0]], by: x[1] })).filter(d => d.p);
  drawnNums = new Set(s.drawn || []);
  prizeCount = s.prizeCount || 0;
  breakDone = s.breakDone || {};
  autoBreak = false;
  gameStarted = true;
  cur = null;
  $('game').classList.remove('hide');
  if (!deck.length || s.mode === 'intro') return enterBatch();
  if (remainCount() === 0) return screenBatchDone();
  if (isSolo()) return screenSolo();
  screenSpin();
}

let pendingSave = null;

        ' 件 · 当前第 ' + ((+s.bi || 0) + 1) + ' 批已翻 ' + got + ' 张</div>' +
      '<div class="rsBtns">' +
        '<button class="btn main" data-rs="go">接着抽</button>' +
        '<button class="btn danger" data-rs="new">重新开始</button>' +

}

});

              '<span class="c2">文件名 / 视频 ID</span><span class="c6"></span></div>' + rows : '') +

/* ================= 输入 ================= */
function act(name){
  if (name === 'mute'){ cfg.mute = !cfg.mute; saveCfg(); sfxApplyVolume(); renderStatus(); return; }
  if (name === 'break'){ toggleBreak(); return; }
  if (name === 'rules'){ toggleRule(); return; }
  if (name === 'settings'){ toggleEditor(); return; }
  if (name === 'restart'){
    if (confirm('重开全场？当前进度会清空。')){ clearSave(); startGame(); }
    return;
  }
  if (name === 'left')  return moveSel(-1);
  if (name === 'right') return moveSel(1);
  if (name === 'redraw'){                       // 人不在场：原号作废，重抽
    if (mode === 'drawn' || mode === 'pick'){ stopCountdown(); screenDraw(); }
    return;
  }
  if (name === 'advance' || name === 'decide'){
    if (mode === 'intro')     return doShuffle();
    if (mode === 'prize')     return pressSpin(), releaseSpin();
    if (mode === 'drawing')   return brakeNow();
    if (mode === 'drawn')     return isSolo() ? soloReveal() : screenPick();
    if (mode === 'pick')      return openCard(cur.sel);
    if (mode === 'reveal')    return nextPick();
    if (mode === 'batchDone') return nextBatch();
  }
}

/* 遥控笔（翻页笔）本质是个 HID 键盘，按 PowerPoint 的约定发键：
   下一页=PageDown、上一页=PageUp、黑屏=B、开始/结束放映=F5/Esc。
   所以 PageDown/PageUp 要认，F5 要吞掉（否则整页重载），
   Esc 不能再开编辑器 —— 它既是遥控笔的「结束放映」，也是浏览器退出全屏的键。 */
const KEYS = { ArrowLeft:'left', ArrowRight:'right', PageUp:'left', PageDown:'advance',
               KeyD:'redraw', KeyB:'break', KeyH:'rules', KeyM:'mute',
               Space:'advance', Enter:'decide', KeyR:'restart' };
const THROTTLED = { advance:1, decide:1 };   // 遥控笔长按会连发，推进类要节流
let lastKeyAct = 0;

addEventListener('keydown', e => {
  sfxUnlock();
  if (e.code === 'F5'){ e.preventDefault(); return; }     // 遥控笔的「开始放映」，别让它重载
  if (e.code === 'Escape'){                               // 只关不开
    e.preventDefault();
    if (cloudLayerOpen()){ closeCloudLayer(); return; }    // 先关版本弹层，编辑器留着
    if (editorOpen) backToGame(false);
    return;
  }
  if (e.code === 'KeyE' && (e.ctrlKey || e.metaKey)){      // 键盘开编辑器的入口
    e.preventDefault(); toggleEditor(); return;
  }
  if (editorOpen) return;
  const dg = /^Digit([1-9])$/.exec(e.code);
  if (dg && mode === 'pick'){ e.preventDefault(); pickCard(+dg[1] - 1); return; }
  if (ruleOpen() && e.code !== 'KeyH') return;
  if (breakOpen() && e.code !== 'KeyB') return;
  if (!$('resumeLayer').classList.contains('hide')) return;
  const a = KEYS[e.code];
  if (!a) return;
  e.preventDefault();
  if (THROTTLED[a]){
    const now = Date.now();
    if (now - lastKeyAct < 350) return;
    lastKeyAct = now;
  }
  act(a);
});

let lastBtn = 0;
function onBtn(e){
  sfxUnlock();
  const b = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if (!b) return;
  const now = Date.now();
  if (now - lastBtn < 400) return;
  lastBtn = now;
  act(b.dataset.act);
}
$('foot').addEventListener('click', onBtn);
$('foot').addEventListener('touchend', onBtn, { passive:true });

/* 挂在 #game 上而不是 window：iOS WebKit（Safari / 微信内置）对挂在 window、document、body
   上的 click 委托有老规矩 —— 点到 div 这类"非交互元素"时可能根本不派发 click。
   挂在普通祖先 div 上就没这事。#game 只包 #stage 和 #foot，齿轮、编辑器、三个弹层都在外面。 */
let lastTap = 0, lastCardTap = 0;
$('game').addEventListener('click', e => {
  sfxUnlock();
  if (editorOpen) return;
  if (ruleOpen() || breakOpen()) return;
  if (!$('resumeLayer').classList.contains('hide')) return;
  const t = e.target;
  // 这几层自己有点击处理；它们会先把自己关掉，事件再冒泡到这里就会多推进一步流程
  if (t && t.closest && (t.closest('#foot') || t.closest('#editor') || t.closest('#gear') ||
      t.closest('#resumeLayer') || t.closest('#breakLayer') || t.closest('#ruleLayer'))) return;
  const now = Date.now();
  if (mode === 'pick' && t && t.closest && t.closest('#cards')){
    // 牌走自己的节流：400ms 会把「点选 → 再点翻开」的第二下吞掉，
    // 这里只防触摸设备把一次点按发成两个事件
    const card = t.closest('.card.pk');
    if (!card) return;                   // 手机上牌小，戳到缝隙不能当成「翻高亮那张」
    if (now - lastCardTap < 120) return;
    lastCardTap = now;
    const i = +card.dataset.i;
    if (!isNaN(i)) pickCard(i);
    return;
  }
  if (now - lastTap < 400) return;
  lastTap = now;
  if (t && t.closest && t.closest('#spinHold')) return;   // 抽号按钮自己有处理
  act('advance');
});

/* ================= 编辑器 ================= */
let imgTarget = null;

/* 编辑器是从右边滑进来的抽屉，游戏画面留在后面不动。
   开着的时候要把倒计时停掉，否则会在你改配置的时候自动翻牌。

   开合状态必须自己记，不能拿 .open 这个类当真相：类是为了跑过渡才加的，
   曾经用 rAF 延后加，结果「还没加上就再按一次」会变成开第二次，
   随后补上的 .open 没人来摘，键盘守卫就把整局卡死。 */
let editorOpen = false;
function showEditor(){
  if (editorOpen) return;
  editorOpen = true;
  stopCountdown();
  const ed = $('editor');
  ed.classList.remove('hide');
  renderEditor();
  void ed.offsetWidth;                        // 强制重排，过渡照样跑，但不依赖 rAF
  ed.classList.add('open');
  document.body.classList.add('edOpen');      // 抽屉比齿轮宽，开着时让齿轮退场
}
function backToGame(restart){
  closeCloudLayer();
  if (!editorOpen){
    if (restart){ clearSave(); startGame(); }
    return;
  }
  editorOpen = false;
  $('editor').classList.remove('open');
  document.body.classList.remove('edOpen');
  if (restart || !gameStarted){ clearSave(); startGame(); }
  else if (mode === 'pick') startCountdown();      // 没重开就把倒计时接回去
}
function toggleEditor(){
  if (editorOpen) backToGame(false);
  else showEditor();
}

function maxBatch(){
  return cfg.prizes.reduce((m, p) => Math.max(m, +p.batch || 1), 1);
}

function editorIssues(){
  const out = [];
  const bs = groupBatches(cfg.prizes);
  if (!bs.length) out.push('还没有奖品');
  bs.forEach((b, k) => {
    const last = k === bs.length - 1;
    if (b.items.length > 6) out.push('第 ' + b.no + ' 批有 ' + b.items.length + ' 件，超过 6 件屏幕会挤');
    // 最后一批常常就是大奖单独一件，那是刻意的；中间的批次太少才叫没悬念
    if (b.items.length < 2 && !last) out.push('第 ' + b.no + ' 批只有 ' + b.items.length + ' 件，没有悬念');
    if (!b.star) out.push('第 ' + b.no + ' 批没有标镇批之宝');
  });
  const need = bs.reduce((a, b) => a + b.items.length, 0);
  if (need > cfg.guests) out.push('奖品比人还多（' + need + ' > ' + cfg.guests + '）');
  return out;
}

/* 编辑器里的输入统一在这里收。data-f 普通字段，data-p 奖品字段，
   data-th 外观，data-bk 休息点，data-brk 休息画面 */
function onEdInput(e){
  const el = e.target;
  if (!el || !el.dataset) return;

  if (el.dataset.f !== undefined){
    const f = el.dataset.f;
    if (el.type === 'checkbox'){
      cfg[f] = !!el.checked; saveCfg();
      if (f === 'mute'){ sfxApplyVolume(); renderStatus(); }
      return;
    }
    const v = (f === 'starRatio' || f === 'volume') ? parseFloat(el.value) : parseInt(el.value, 10);
    if (!isNaN(v)) cfg[f] = v;
    if (f === 'volume'){
      sfxApplyVolume();
      const u = el.parentElement && el.parentElement.querySelector('.unit');
      if (u) u.textContent = Math.round(sfxVol() * 100) + '%';
    }
    saveCfg();
    if (f === 'guests') softRefresh();
    return;
  }
  if (el.dataset.p !== undefined){
    const parts = el.dataset.p.split('|');
    const p = cfg.prizes[+parts[0]];
    if (!p) return;
    const k = parts[1];
    p[k] = (k === 'price' || k === 'batch') ? (parseInt(el.value, 10) || 0) : el.value;
    if (k === 'batch'){ saveCfg(); return renderEditor(); }
    saveCfg();
    softRefresh();
    return;
  }
  if (el.dataset.th !== undefined){
    const k = el.dataset.th;
    cfg.theme[k] = (k === 'bg') ? el.value : +el.value;
    applyTheme(); saveCfg();
    const u = el.parentElement && el.parentElement.querySelector('.unit');
    if (u) u.textContent = cfg.theme[k] + (k === 'pattern' ? '' : ' px');
    return;
  }
  if (el.dataset.bk !== undefined){
    const no = +el.dataset.bk;
    const ix = cfg.breakAfter.indexOf(no);
    if (el.checked && ix < 0) cfg.breakAfter.push(no);
    if (!el.checked && ix >= 0) cfg.breakAfter.splice(ix, 1);
    saveCfg();
    return;
  }
  if (el.dataset.brk !== undefined){                 // 休息页的待机文字
    cfg.breakScreen = fixBreak(cfg.breakScreen);
    cfg.breakScreen[el.dataset.brk] = el.value;
    saveCfg();
    return;
  }
  if (el.dataset.bc !== undefined){                  // 休息页的某一段视频
    const parts = el.dataset.bc.split('|');
    cfg.breakScreen = fixBreak(cfg.breakScreen);
    const c = cfg.breakScreen.clips[+parts[0]];
    if (!c) return;
    c[parts[1]] = el.value;
    saveCfg();
    if (parts[1] === 'kind') renderEditor();         // 换了来源，输入框也要换
    return;
  }
}

// 只刷新预览区，不重建整个编辑器（否则正在打字的输入框会失焦）
function softRefresh(){
  clearTimeout(softRefresh._t);
  softRefresh._t = setTimeout(() => {
    const a = document.activeElement;
    const key = a && a.dataset ? (a.dataset.p || a.dataset.f || '') : '';
    renderEditor();
    if (key){
      const sel = a.dataset.p ? '[data-p="' + key + '"]' : '[data-f="' + key + '"]';
      const back = document.querySelector(sel);
      if (back){ back.focus(); try{ back.setSelectionRange(99,99); }catch(e){} }
    }
  }, 420);
}

$('edBody').addEventListener('input', onEdInput);
$('edBody').addEventListener('change', onEdInput);

$('edBody').addEventListener('click', e => {
  const b = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if (!b) return;
  const act2 = b.dataset.act, pi = +b.dataset.pi;
  if (act2 === 'addp'){
    cfg.prizes.push({ nm:'新奖品', ico:'\u{1F381}', img:null, price:0, batch:maxBatch(), star:false });
    saveCfg(); renderEditor(); return;
  }
  if (act2 === 'delp'){ cfg.prizes.splice(pi, 1); saveCfg(); renderEditor(); return; }
  if (act2 === 'star'){
    const p = cfg.prizes[pi]; if (!p) return;
    const on = !p.star;
    cfg.prizes.forEach(x => { if (+x.batch === +p.batch) x.star = false; });
    p.star = on;
    saveCfg(); renderEditor(); return;
  }
  if (act2 === 'plan'){ autoPlan(); saveCfg(); renderEditor(); return; }
  if (act2 === 'addclip'){
    cfg.breakScreen = fixBreak(cfg.breakScreen);
    cfg.breakScreen.clips.push({ nm:'新视频', kind:'local', file:'' });
    saveCfg(); renderEditor(); return;
  }
  if (act2 === 'delclip'){
    cfg.breakScreen = fixBreak(cfg.breakScreen);
    cfg.breakScreen.clips.splice(+b.dataset.ci, 1);
    saveCfg(); renderEditor(); return;
  }
  if (act2 === 'img'){ imgTarget = pi; $('fileImg').click(); return; }
  if (act2 === 'cloudUp'){ cloudUpload(); return; }
  if (act2 === 'cloudDown'){ cloudPick(); return; }
  if (act2 === 'mkLock'){ lockGenerate(); return; }
  if (act2 === 'dlLock'){ lockDownload(); return; }
  if (act2 === 'rekey'){ lockRekey(); return; }
  if (act2 === 'sfxTry'){ sfxTry(b.dataset.sfx); return; }
  if (act2 === 'peek'){                                   // 口令 / token 明文看一眼，默认都是打码的
    const inp = document.querySelector(b.dataset.for === 'pass' ? '[data-cf="pass"]' : '[data-lk="token"]');
    if (!inp) return;
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    b.textContent = show ? '隐藏' : '显示';
    return;
  }
  if (act2 === 'brkfull'){ backToGame(false); toggleBreak(); return; }
});

$('fileImg').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (!f || imgTarget === null) return;
  const r = new FileReader();
  r.onload = () => {
    const p = cfg.prizes[imgTarget];
    if (p){ p.img = r.result; saveCfg(); renderEditor(); }
    imgTarget = null;
  };
  r.readAsDataURL(f);
  e.target.value = '';
});

   配置（含价格、图片）放在一个私有仓库的 config.json 里，页面直接调 GitHub 接口读写
   （接口对任何来源都放行 CORS，file:// 本地文件和 github.io 都能用）。
   token 只存本机 localStorage（CLOUD_KEY），绝不进 cfg，所以导出 / 上传的 json 里都没有它。
   每次上传 = 一次 git 提交，备注就是版本说明；拉取时列最近 20 个版本任选。
   上传前先比对云端当前版本和本机最后同步到的版本，别人在那之后改过就先问再覆盖。 */

const CLOUD_DEF = { repo:'XiaoFu-Ani/Roll-config', pass:'', name:'', branch:'main', path:'config.json', sha:'', commit:'', at:0 };
const CLOUD_LOCK = 'v1.3lS5xa4FTcz5DbQgXf22EA.kuBTA8SWS11xf1ES.vrgOGuUM_uaHmvBMRy2sALVzEwbygUq8qP0Cr2Wrhr-qyz25SS2lCkJisOXnXOqXqb9a8V7ai1vL_Kjg0Rn8gqztzno03wvg5jaqwcTweVk_CsFCTbQg211Bf3W11N2DMkG81RT9OGUShHMdcQ';   // 构建时从 lottery-config/cloud.key 嵌入：用小组口令加密过的 token；没有就是空串
const LOCK_ITER = 600000;
let tokenCache = { key:'', token:'' };
const IMG_MAX = 360;            // 上传时图片最长边；牌面上一张图也就两三百像素
let cloud = loadCloud();
let cloudPicked = null;         // 版本弹层里选中的那版 { sha, file:{ sha, cfg } }
let cloudBusy = false;

function loadCloud(){
  try{
    const c = JSON.parse(localStorage.getItem(CLOUD_KEY) || 'null');
    if (c && typeof c === 'object'){
      const m = Object.assign({}, CLOUD_DEF, c);
      if (!m.pass && c.token) m.pass = c.token;     // 上一版直接存 token 的，原样当口令用
      delete m.token;
      return m;
    }
  }catch(e){}
  return clone(CLOUD_DEF);
}
function saveCloud(){ try{ localStorage.setItem(CLOUD_KEY, JSON.stringify(cloud)); }catch(e){} }
function fmtWhen(d){
  const z = n => String(n).padStart(2, '0');
  return z(d.getMonth() + 1) + '-' + z(d.getDate()) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
}
function fmtKB(n){ return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.round(n / 1024) + ' KB'; }
function syncText(){ return cloud.at ? fmtWhen(new Date(cloud.at)) + ' · 版本 ' + cloud.sha.slice(0, 7) : '还没同步过'; }

/* ---------- GitHub 接口 ---------- */
function ghUrl(p){ return 'https://api.github.com/repos/' + cloud.repo.replace(/^\/+|\/+$/g, '') + p; }
async function gh(method, path, body, raw){
  if (!cloud.pass) throw new Error('先填小组口令');
  if (!/^[\w.-]+\/[\w.-]+$/.test(cloud.repo.trim())) throw new Error('仓库名要写成「用户名/仓库名」');
  const token = await unlockToken(cloud.pass);
  const headers = {
    'Authorization': 'Bearer ' + token,
    'Accept': raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
  };
  if (body) headers['Content-Type'] = 'application/json';
  const res = await fetch(ghUrl(path), { method, headers, body: body ? JSON.stringify(body) : undefined });
  if (res.status === 404) return null;
  if (!res.ok){
    let msg = '';
    try{ const j = await res.json(); if (j && j.message) msg = j.message; }catch(e){}
    const err = new Error(msg || ('HTTP ' + res.status));
    err.status = res.status;
    throw err;
  }
  return raw ? res.text() : res.json();
}
function cloudErr(err){
  const s = err && err.status;
  if (!s && /fetch|network/i.test(err && err.message || '')) return '连不上 GitHub，检查网络：' + err.message;
  if (s === 401) return 'token 不对或已过期：口令锁里那个 token 可能被撤销了，管理员重新生成口令锁';
  if (s === 403) return '没权限（token 要勾上这个仓库的 Contents 读写）：' + err.message;
  if (s === 404) return '找不到仓库或文件，或 token 没有这个仓库的权限：' + cloud.repo;
  if (s === 409) return '云端刚被别人改过，先「从云端拉取」再上传';
  if (s === 422) return '云端已有配置但本机没同步过，先「从云端拉取」一次：' + err.message;
  return (err && err.message) || String(err);
}
function b64utf8(s){
  const u = new TextEncoder().encode(s);
  let b = '';
  for (let i = 0; i < u.length; i += 0x8000) b += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(b);
}
function utf8b64(b){
  const s = atob(String(b).replace(/\s/g, ''));
  const u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  return new TextDecoder().decode(u);
}

/* ---------- 打包：复制一份，图片压小 ---------- */
function shrinkImg(dataUrl){
  return new Promise(resolve => {
    if (!dataUrl || !/^data:image\//.test(dataUrl)) return resolve(dataUrl);
    const im = new Image();
    im.onload = () => {
      const w = im.naturalWidth, h = im.naturalHeight;
      if (!w || !h) return resolve(dataUrl);
      const k = Math.min(1, IMG_MAX / Math.max(w, h));
      if (k === 1 && dataUrl.length < 60000) return resolve(dataUrl);     // 本来就小，别重编
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(w * k));
      cv.height = Math.max(1, Math.round(h * k));
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      let out = cv.toDataURL('image/webp', .86);
      if (!/^data:image\/webp/.test(out)){                                 // Safari 不会编 webp
        const alpha = !/^data:image\/jpe?g/.test(dataUrl);
        out = alpha ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', .86);
      }
      resolve(out.length < dataUrl.length ? out : dataUrl);
    };
    im.onerror = () => resolve(dataUrl);
    im.src = dataUrl;
  });
}
async function packCfg(){
  const c = clone(cfg);
  let imgs = 0;
  for (const p of c.prizes){
    if (p.img){ p.img = await shrinkImg(p.img); imgs++; }
  }
  delete c.token;
  const json = JSON.stringify(c, null, 1);
  return { json, bytes: new TextEncoder().encode(json).length, imgs };
}
function cfgSummary(c){
  const bs = groupBatches(c.prizes);
  const total = c.prizes.reduce((a, p) => a + (+p.price || 0), 0);
  const imgs = c.prizes.filter(p => p.img).length;
  return c.prizes.length + ' 件 · ' + bs.length + ' 批 · 合计 ' + total + ' 元 · 图片 ' + imgs + ' 张 · ' +
         (c.guests || 0) + ' 人';
}

/* ---------- 上传 ---------- */
async function cloudUpload(){
  if (cloudBusy) return;
  cloudBusy = true;
  try{
    if (!cloud.name.trim()) throw new Error('先填「你的名字」，上传记录按它区分');
    cloudMsg('打包中…');
    const packed = await packCfg();
    cloudMsg('检查云端…');
    const meta = await gh('GET', '/contents/' + cloud.path + '?ref=' + cloud.branch);   // null = 云端还没有
    if (meta && meta.sha !== cloud.sha){
      let who = '';
      try{
        const list = await gh('GET', '/commits?path=' + cloud.path + '&sha=' + cloud.branch + '&per_page=1');
        const c = list && list[0];
        if (c) who = '（' + fmtWhen(new Date(c.commit.committer.date)) + ' ' +
                     ((c.commit.author && c.commit.author.name) || (c.author && c.author.login) || '') + '：' +
                     c.commit.message.split('\n')[0] + '）';
      }catch(e){}
      if (!confirm('云端有本机没同步过的版本' + who + '。\n\n覆盖它？取消 = 先去「从云端拉取」看看。')){
        cloudMsg('没上传。先「从云端拉取」看看最新版再说。', 'err');
        return;
      }
    }
    const noteEl = $('cloudNote');
    const note = (noteEl && noteEl.value.trim()) || ('更新配置 ' + fmtWhen(new Date()));
    const who = { name: cloud.name.trim(), email: 'roll-config@example.com' };   // 版本列表按名字认人，不看 GitHub 账号
    const body = { message: note, content: b64utf8(packed.json), branch: cloud.branch, author: who, committer: who };
    if (meta) body.sha = meta.sha;
    cloudMsg('上传中…（' + fmtKB(packed.bytes) + '）');
    const r = await gh('PUT', '/contents/' + cloud.path, body);
    if (!r || !r.content) throw new Error('上传后没拿到版本号，再拉取一次确认');
    cloud.sha = r.content.sha; cloud.commit = (r.commit && r.commit.sha) || ''; cloud.at = Date.now(); saveCloud();
    cloudSyncRefresh();
    if (noteEl) noteEl.value = '';
    cloudMsg('已上传 · ' + cfgSummary(cfg) + ' · ' + fmtKB(packed.bytes) +
             (packed.imgs ? '（图片已压小）' : '') + ' · 备注「' + note + '」', 'ok');
  }catch(err){
    cloudMsg('上传失败：' + cloudErr(err), 'err');
  }finally{ cloudBusy = false; }
}

  if (cloudBusy) return;
  cloudBusy = true;
  openCloudLayer('<div class="clT">从云端拉取</div><div class="clSum">读取版本列表…</div>' +
                 '<div class="clA"><button class="btn" data-cl="close">关闭</button></div>');

    if (!list || !list.length){
      openCloudLayer('<div class="clT">从云端拉取</div><div class="clSum">云端还没有配置，先从某台机器上传一次。</div>' +
                     '<div class="clA"><button class="btn" data-cl="close">关闭</button></div>');

    if (cloudLayerOpen())

                     '<div class="clA"><button class="btn" data-cl="close">关闭</button></div>');

async function cloudPreview(commitSha){
  const sum = $('clSum'), use = document.querySelector('[data-cl="use"]');
  Array.from(document.querySelectorAll('.clV')).forEach(r => r.classList.toggle('on', r.dataset.cv === commitSha));
  if (use) use.disabled = true;
  cloudPicked = null;
  if (sum){ sum.textContent = '读取中…'; sum.className = 'clSum'; }
  try{
    let f = await gh('GET', '/contents/' + cloud.path + '?ref=' + commitSha);
    if (!f) throw new Error('这个版本里没有 ' + cloud.path);
    let text, fileSha = f.sha || '';
    if (f.content) text = utf8b64(f.content);
    else text = await gh('GET', '/contents/' + cloud.path + '?ref=' + commitSha, null, true);   // 超过 1 MB 只能拿 raw
    const c = JSON.parse(text);
    if (!Array.isArray(c.prizes) || !c.prizes.length) throw new Error('这个版本里没有认得出来的奖品清单');
    const next = fillCfg(c);
    cloudPicked = { sha: commitSha, fileSha, cfg: next };
    if (sum){
      const names = next.prizes.map(p => p.nm).join('、');
      sum.textContent = cfgSummary(next) + '\n' + (names.length > 90 ? names.slice(0, 90) + '…' : names);
      sum.style.whiteSpace = 'pre-line';
    }
    if (use) use.disabled = false;
  }catch(err){
    if (sum){ sum.textContent = cloudErr(err); sum.className = 'clSum err'; }
  }
}

function cloudUse(){
  if (!cloudPicked) return;
  const pk = cloudPicked;
  cfg = pk.cfg;
  saveCfg(); applyTheme();
  cloud.sha = pk.fileSha; cloud.commit = pk.sha; cloud.at = Date.now(); saveCloud();
  closeCloudLayer();
  backToGame(true);                       // 用拉到的清单重开一局
}

/* ---------- 口令锁：token 用小组口令加密后嵌进页面 ----------
   PBKDF2-SHA256 60 万次拉伸 → AES-GCM-256。锁串格式 v1.<salt>.<iv>.<密文>，全 base64url。
   口令是 github_pat_ / ghp_ 开头就当作 token 本身（管理员直接贴）。解出来的 token 只放内存。 */
function b64u(u){
  let b = '';
  for (let i = 0; i < u.length; i++) b += String.fromCharCode(u[i]);
  return btoa(b).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function ub64(s){
  s = String(s).replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const b = atob(s), u = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
  return u;
}
function subtle(){
  const c = (window.crypto || {}).subtle;
  if (!c) throw new Error('这个页面不在安全上下文里（要 https 或本地文件打开），没法解口令锁');
  return c;
}
async function deriveKey(pass, salt){
  const base = await subtle().importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return subtle().deriveKey({ name:'PBKDF2', salt, iterations: LOCK_ITER, hash:'SHA-256' }, base,
                            { name:'AES-GCM', length:256 }, false, ['encrypt', 'decrypt']);
}
async function makeLock(token, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pass, salt);
  const ct = new Uint8Array(await subtle().encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(token)));
  return 'v1.' + b64u(salt) + '.' + b64u(iv) + '.' + b64u(ct);
}
function looksLikeToken(s){ return /^(github_pat_|ghp_|gho_|ghs_)[A-Za-z0-9_]+$/.test(s); }
async function unlockToken(pass){
  pass = String(pass || '').trim();
  if (looksLikeToken(pass)) return pass;
  if (!CLOUD_LOCK) throw new Error('页面里还没有口令锁：管理员先在下面「生成口令锁」并重新发布，或者直接贴 token');
  const ck = pass + '|' + CLOUD_LOCK;
  if (tokenCache.key === ck) return tokenCache.token;
  const parts = CLOUD_LOCK.split('.');
  if (parts[0] !== 'v1' || parts.length !== 4) throw new Error('页面里的口令锁格式不对');
  const key = await deriveKey(pass, ub64(parts[1]));
  let pt;
  try{ pt = await subtle().decrypt({ name:'AES-GCM', iv: ub64(parts[2]) }, key, ub64(parts[3])); }
  catch(e){ throw new Error('口令不对（刚换过口令的话填新的；页面刚重新发布的话先刷新）'); }
  const token = new TextDecoder().decode(pt);
  tokenCache = { key: ck, token };
  return token;
}
let lockText = '';
async function lockGenerate(){
  const tEl = document.querySelector('[data-lk="token"]'), pEl = document.querySelector('[data-lk="pass"]');
  const out = $('lockOut'), msg = $('lockMsg'), dl = document.querySelector('[data-act="dlLock"]');
  const token = tEl ? tEl.value.trim() : '', pass = pEl ? pEl.value.trim() : '';
  const say = (t, bad) => { if (msg){ msg.textContent = t; msg.style.color = bad ? 'var(--red)' : ''; } };
  if (!looksLikeToken(token)) return say('token 看起来不对，应该是 github_pat_ 或 ghp_ 开头', true);
  if (pass.length < 12) return say('口令至少 12 位', true);
  say('生成中…');
  try{
    lockText = await makeLock(token, pass);
    if (out) out.value = lockText;
    if (dl) dl.disabled = false;
    if (tEl) tEl.value = '';                 // token 用完就清，别留在输入框里
    say('生成好了。下载 cloud.key 放到 lottery-config 文件夹，重新发布页面。', false);
  }catch(err){ say('生成失败：' + err.message, true); }
}

/* 换口令：用本机记住的旧口令把锁打开，再用新口令锁一遍。不用再碰 token。
   本机口令随手换成新的 —— 新页面发布前别上传（会报口令不对）。 */
async function lockRekey(){
  const nEl = document.querySelector('[data-lk="newpass"]');
  const out = $('lockOut'), msg = $('lockMsg'), dl = document.querySelector('[data-act="dlLock"]');
  const say = (t, bad) => { if (msg){ msg.textContent = t; msg.style.color = bad ? 'var(--red)' : ''; } };
  const np = nEl ? nEl.value.trim() : '';
  if (np.length < 12) return say('新口令至少 12 位', true);
  if (!cloud.pass) return say('本机没记住旧口令：先在上面「小组口令」里填一次', true);
  if (!CLOUD_LOCK && !looksLikeToken(cloud.pass)) return say('页面里还没有口令锁，先用上面的 token 生成', true);
  if (np === cloud.pass) return say('新口令和旧的一样', true);
  say('用本机记住的旧口令解锁中…');
  try{
    const token = await unlockToken(cloud.pass);
    lockText = await makeLock(token, np);
    if (out) out.value = lockText;
    if (dl) dl.disabled = false;
    if (nEl) nEl.value = '';
    cloud.pass = np; saveCloud();
    tokenCache = { key:'', token:'' };
    const pEl = document.querySelector('[data-cf="pass"]');
    if (pEl) pEl.value = np;
    say('换好了。下载 cloud.key 放到 lottery-config 重新发布；本机口令已换成新的，新页面发布前先别上传；同事要改成新口令。');
  }catch(err){ say('换口令失败：' + err.message, true); }
}
function lockDownload(){
  if (!lockText) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lockText + '\n'], { type:'text/plain' }));
  a.download = 'cloud.key';
  a.click();
}

$('cloudLayer').addEventListener('click', e => {
  const t = e.target;
  if (!t || !t.closest) return;
  const v = t.closest('[data-cv]');
  if (v){ cloudPreview(v.dataset.cv); return; }
  const b = t.closest('[data-cl]');
  if (!b) return;
  if (b.dataset.cl === 'close') closeCloudLayer();
  else if (b.dataset.cl === 'use' && !b.disabled) cloudUse();
});


/* ================= 启动 ================= */
applyTheme();
pendingSave = loadSave();     // 必须在 startGame 之前读：startGame 会立刻写一次新存档
startGame();
if (pendingSave) showResume(pendingSave);

let gearTimer = 0;
$('gear').addEventListener('click', () => toggleEditor());
sfxInit();                                   // 先建好、先解码；真正出声等第一次交互
addEventListener('mousemove', () => {
  const g = $('gear');
  g.classList.add('awake');
  clearTimeout(gearTimer);
  gearTimer = setTimeout(() => g.classList.remove('awake'), 2200);
});
})();

</script>
