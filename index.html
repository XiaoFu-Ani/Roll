  .card.pk{width:var(--cw); height:calc(var(--cw) * 1.34)}
  /* 揭晓展示：蓄力时从原位滑到舞台正中并放大（--dx/--dy/--zs 由 JS 按当前屏幕算），
     白闪后停在正中（.showing），展示完滑回原位（.homing）。
     v5 的 chargeShake 只横向居中（当时只有一排），v6 牌阵有两行，横竖都要对齐 */
  /* 揭晓顺序（2026-10-29）：扣着滑到正中（.lifting）→ 到位抖动、按真实品质亮起（.charging）
     → 彩带 + 翻面（.showing + .flipped）→ 停一会 → 滑回原位（.homing） */
  /* 滑入是一段 transform 过渡，不是关键帧：过渡从牌当前的姿态（高亮时抬起 20px、微转、放大 4%）
     直接起步，不会先掉回原位再走；一条曲线跑完，没有中间关键帧造成的分段减速。
     曲线带一点起步蓄势和落点回弹，节奏才有活力 */
  .card.pk.lifting{
    z-index:20;
    transform:translate(var(--dx,0px),var(--dy,0px)) scale(var(--zs,1.34));
    transition:transform .66s cubic-bezier(.7,-.06,.22,1.06);
  }
  /* 抖动阶段牌本身静止在正中（盖掉 v5 的 chargeShake），抖的是 .inner，而且是扣着抖（rotateY 180）。
     v5 的 jitter 写死了 rotateY(0)，扣着的牌一用就会翻过来，所以另写一条 */
  .card.pk.charging, .card.pk.showing{
    z-index:20;
    animation:none;
    transform:translate(var(--dx,0px),var(--dy,0px)) scale(var(--zs,1.34));
  }
  .card.pk.charging .inner{animation:quiverBack var(--chargeDur,900ms) linear forwards}
  @keyframes quiverBack{
    0%  {transform:rotateY(180deg) translate(0,0)}
    2.5%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * 0.24), calc(var(--amp,3px) * -0.17)) rotate(0.64deg)}
    5%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * -0.16), calc(var(--amp,3px) * -0.26)) rotate(-0.66deg)}
    7.5%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * 0.22), calc(var(--amp,3px) * 0.28)) rotate(0.69deg)}
    10%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * 0.30), calc(var(--amp,3px) * 0.09)) rotate(-0.72deg)}
    12.5%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * -0.32), calc(var(--amp,3px) * -0.13)) rotate(0.74deg)}
    15%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * 0.17), calc(var(--amp,3px) * -0.34)) rotate(-0.77deg)}
    17.5%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * -0.32), calc(var(--amp,3px) * 0.21)) rotate(0.80deg)}
    20%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * -0.38), calc(var(--amp,3px) * 0.38)) rotate(-0.83deg)}
    22.5%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * 0.40), calc(var(--amp,3px) * -0.28)) rotate(0.85deg)}
    25%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * -0.25), calc(var(--amp,3px) * -0.42)) rotate(-0.88deg)}
    27.5%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * 0.35), calc(var(--amp,3px) * 0.43)) rotate(0.91deg)}
    30%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * 0.45), calc(var(--amp,3px) * 0.14)) rotate(-0.94deg)}
    32.5%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * -0.47), calc(var(--amp,3px) * -0.19)) rotate(0.96deg)}
    35%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * 0.25), calc(var(--amp,3px) * -0.49)) rotate(-0.99deg)}
    37.5%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * -0.46), calc(var(--amp,3px) * 0.31)) rotate(1.02deg)}
    40%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * -0.53), calc(var(--amp,3px) * 0.53)) rotate(-1.04deg)}
    42.5%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * 0.55), calc(var(--amp,3px) * -0.39)) rotate(1.07deg)}
    45%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * -0.34), calc(var(--amp,3px) * -0.57)) rotate(-1.10deg)}
    47.5%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * 0.47), calc(var(--amp,3px) * 0.59)) rotate(1.13deg)}
    50%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * 0.61), calc(var(--amp,3px) * 0.18)) rotate(-1.15deg)}
    52.5%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * -0.63), calc(var(--amp,3px) * -0.25)) rotate(1.18deg)}
    55%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * 0.32), calc(var(--amp,3px) * -0.65)) rotate(-1.21deg)}
    57.5%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * -0.60), calc(var(--amp,3px) * 0.40)) rotate(1.24deg)}
    60%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * -0.69), calc(var(--amp,3px) * 0.69)) rotate(-1.26deg)}
    62.5%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * 0.71), calc(var(--amp,3px) * -0.50)) rotate(1.29deg)}
    65%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * -0.44), calc(var(--amp,3px) * -0.73)) rotate(-1.32deg)}
    67.5%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * 0.60), calc(var(--amp,3px) * 0.75)) rotate(1.35deg)}
    70%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * 0.77), calc(var(--amp,3px) * 0.23)) rotate(-1.37deg)}
    72.5%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * -0.79), calc(var(--amp,3px) * -0.31)) rotate(1.40deg)}
    75%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * 0.40), calc(var(--amp,3px) * -0.80)) rotate(-1.43deg)}
    77.5%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * -0.74), calc(var(--amp,3px) * 0.49)) rotate(1.45deg)}
    80%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * -0.84), calc(var(--amp,3px) * 0.84)) rotate(-1.48deg)}
    82.5%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * 0.86), calc(var(--amp,3px) * -0.60)) rotate(1.51deg)}
    85%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * -0.53), calc(var(--amp,3px) * -0.88)) rotate(-1.54deg)}
    87.5%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * 0.72), calc(var(--amp,3px) * 0.90)) rotate(1.56deg)}
    90%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * 0.92), calc(var(--amp,3px) * 0.28)) rotate(-1.59deg)}
    92.5%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * -0.94), calc(var(--amp,3px) * -0.38)) rotate(1.62deg)}
    95%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * 0.48), calc(var(--amp,3px) * -0.96)) rotate(-1.65deg)}
    97.5%{transform:rotateY(180deg) translate(calc(var(--amp,3px) * -0.88), calc(var(--amp,3px) * 0.59)) rotate(1.67deg)}
    100%{transform:rotateY(180deg) translate(0,0)}
  }
  /* 牌背也要有蓄力辉光（v5 只给了正面）—— 抖动阶段故意剧透品质，当翻面前的预告。
     翻面过程中也保留：辉光跟着牌背一起转走，不会翻的一瞬间突然全暗（背面朝后时 backface 不画） */
  .card.pk.charging .back, .card.pk.showing .back{
    box-shadow:
      0 var(--lift) 0 var(--ink-stroke),
      0 0 0 calc(3px + 2px * var(--pow,1)) var(--rc),
      0 0 calc(26px * var(--pow,1)) var(--rc),
      0 0 calc(80px * var(--pow,1)) rgba(var(--rcrgb), .55),
      0 24px 44px rgba(0,0,0,.6);
    filter:brightness(calc(1 + .12 * var(--pow,1))) saturate(calc(1 + .2 * var(--pow,1)));
  }
  /* 翻面期间品质光打在牌面自己身上：正反两面都在做 3D 翻转的 .inner 里，光跟着牌边转 ——
     翻过 90° 之前是背面带着光转走，之后是正面带着光转出来。
     牌外那层 .fx（aura + 粒子）不跟着转，翻面时亮着就是一个停在原地的框，所以沿用它原来的节奏：
     翻到一半（.52s）开始淡入，翻完正好满亮，和牌面上的光接上。
     只给正面光，不给亮度/饱和度滤镜：那是给牌背图案用的，别动奖品图 */
  .card.pk.showing .front, .card.pk.homing .front{
    box-shadow:
      0 var(--lift) 0 var(--ink-stroke),
      0 0 0 calc(3px + 2px * var(--pow,1)) var(--rc),
      0 0 calc(26px * var(--pow,1)) var(--rc),
      0 0 calc(80px * var(--pow,1)) rgba(var(--rcrgb), .55),
      0 24px 44px rgba(0,0,0,.6);
  }
  .card.pk.flipped .front{transition:box-shadow .45s ease-out}   /* 归位到格子里后光淡掉，不突跳 */
  /* 不预告品质（cfg.tease 关）：抖动阶段牌背用中性的冷白光、抖幅中档；
     品质光环 / 旋转光芒靠 data-r 触发，此时 data-r 还是 1，不会出现 */
  .card.pk.charging.plain{--rc:#f1f3ff; --rcrgb:241,243,255; --pow:1.2; --amp:3.5px}
  /* 切屏过渡（setStage）：旧画面淡出下沉 .18s，新画面从上方淡入 .24s。以前整块直接换，像跳切 */
  #stage{transition:opacity .24s ease-out, transform .24s ease-out}
  #stage.out{opacity:0; transform:translateY(12px); transition-duration:.18s,.18s; transition-timing-function:ease-in,ease-in}
  .card.pk.homing{z-index:20; transform:none; transition:transform .56s cubic-bezier(.3,.9,.3,1)}
  /* 单件批次：奖品和滚轮左右并排。竖着摞会把标题和按钮挤出屏幕 */
  .soloRow{
    display:flex; align-items:center; justify-content:center;
    gap:clamp(18px,4vw,56px); flex-wrap:wrap; max-width:96vw;
  }
  .soloSlot{display:flex; flex-direction:column; align-items:center; gap:clamp(10px,1.6vh,18px)}
  #cards.pGrid.solo{--cw:min(40vw, 32vh, 250px)}
  /* 已经被拿走的牌留在原位，压暗，号码挂在上面 —— 这一屏要一直看得见还剩什么 */
  .card.pk.taken{opacity:.62}
  .card.pk.taken .fx{opacity:.45}
  .card.pk .front .tag{
    background:rgba(255,201,60,.18); color:var(--gold);
    font-variant-numeric:tabular-nums; letter-spacing:.04em;
  }
  .card.pk .front .nm{line-height:1.15}
  /* 开批亮相时，镇批之宝带一条角标 */
  .starTag{
    position:absolute; left:50%; top:7%; transform:translateX(-50%);
    background:linear-gradient(180deg,#ffd76a,#f0a81e); color:#3a2500;
    font-size:calc(var(--cw) * .085); font-weight:900; letter-spacing:.06em;
    padding:3px 9px; border-radius:999px; white-space:nowrap; z-index:3;
    box-shadow:0 4px 14px rgba(255,176,32,.45);
  }
  .card.starCard{animation:starBob 2.6s ease-in-out infinite}
  @keyframes starBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  /* 背面编号。洗完才发，一张一张弹出来 */
  .card.pk .face.back .num{
    font-family:var(--mono); font-weight:800; opacity:.9;
    font-size:calc(var(--cw) * .40); color:var(--ink2); line-height:1;
  }
  .card.pk .face.back .num.pop{
    animation:numPop .44s cubic-bezier(.2,1.25,.4,1) backwards;
  }
  @keyframes numPop{
    0%{opacity:0; transform:scale(.35)}
    60%{opacity:1}
    100%{opacity:1; transform:scale(1)}
  }

  /* 倒计时 */
  .cd{height:clamp(30px,4.4vh,46px); display:flex; align-items:center; justify-content:center}
  .cdN{
    font-size:clamp(22px,3.4vw,38px); font-weight:900; color:var(--ink3);
    font-variant-numeric:tabular-nums; line-height:1;
  }
  .cdN.urge{color:var(--red); animation:cdPulse .9s ease-in-out infinite}
  @keyframes cdPulse{0%,100%{transform:scale(1)} 50%{transform:scale(1.16)}}

  /* 批次结算 = 领奖清单 */
  #claim{
    display:flex; flex-wrap:wrap; justify-content:center;
    gap:clamp(8px,1.2vh,14px) clamp(10px,1.6vw,20px);
    max-width:min(1060px,92vw); margin:0 auto;
  }
  .cw{
    display:flex; align-items:center; gap:10px;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09);
    border-radius:13px; padding:9px 16px;
  }
  .cw.st{border-color:rgba(255,201,60,.55); background:rgba(255,201,60,.08)}
  .cn{
    font-size:clamp(19px,2.2vw,27px); font-weight:900; color:var(--gold);
    font-variant-numeric:tabular-nums; letter-spacing:.02em;
  }
  .ci{font-size:clamp(20px,2.3vw,28px); line-height:1}
  .ci img{width:1.15em; height:1.15em; object-fit:contain; vertical-align:-.2em}
  .cm2{font-size:clamp(13px,1.4vw,18px); color:var(--ink2); font-weight:700}

  /* ================= v6：编辑器 ================= */
  .sec h3 .h3s{font-weight:600; font-size:12px; color:var(--ink3); letter-spacing:0}
  /* 抽屉要宽一点，否则名称列被其它列挤成一个字 */
  #editor{width:min(560px, 95vw)}
  .prowHead{
    display:flex; align-items:center; gap:6px; padding:0 2px 5px;
    font-size:11px; color:var(--ink3); letter-spacing:.04em;
  }
  .prowHead .c1{width:34px; text-align:center}
  .prowHead .c2{flex:1; min-width:0}
  .prowHead .c3{width:66px}
  .prowHead .c4{width:86px}
  .prowHead .c5{width:28px; text-align:center}
  .prowHead .c6{width:28px}
  .prow{display:flex; align-items:center; gap:6px; margin-bottom:6px}
  .prow .btn.mini{
    width:34px; height:32px; padding:0; font-size:16px; line-height:1;
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .prow .btn.mini img{width:20px; height:20px; object-fit:contain}
  .prow .inp.ico{width:44px; text-align:center; flex:none; padding:6px 4px}
  .prow .inp.nm{flex:1; min-width:0}
  .prow .inp.p3{width:66px; flex:none; padding:6px 7px}
  .prow .inp.p4{width:86px; flex:none; font-size:12px; padding:6px 6px}
  .starBtn{
    width:28px; height:28px; flex:none; border-radius:8px; cursor:pointer;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12);
    color:var(--ink3); font-size:15px; line-height:1; transition:.15s;
  }
  .starBtn:hover{color:var(--gold); border-color:rgba(255,201,60,.4)}
  .starBtn.on{
    color:#3a2500; background:linear-gradient(180deg,#ffd76a,#f0a81e);
    border-color:#f0a81e; box-shadow:0 0 12px rgba(255,176,32,.4);
  }
  .prowFoot{display:flex; align-items:center; gap:10px; margin-top:10px; flex-wrap:wrap}
  .prowFoot .sp{flex:1}
  .ratio{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ink2)}
  .ratio .inp{width:66px}

  .warn2{
    background:rgba(255,91,74,.10); border:1px solid rgba(255,91,74,.3);
    border-radius:10px; padding:9px 13px; margin-bottom:11px;
    font-size:12.5px; color:#ffb4aa; line-height:1.7;
  }
  .bprev{
    background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.08);
    border-radius:11px; padding:10px 13px; margin-bottom:8px;
  }
  .bpHead{display:flex; align-items:center; gap:9px; margin-bottom:7px; font-size:13px}
  .bpHead .sp{flex:1}
  .bpN{font-size:11.5px; color:var(--ink3)}
  .bpHead .brk{
    display:flex; align-items:center; gap:5px; font-size:12px; color:var(--ink2);
    cursor:pointer; user-select:none;
  }
  .bpHead .brk input{accent-color:var(--gold); cursor:pointer}
  .bpItems{display:flex; flex-wrap:wrap; gap:6px}
  .bpi{
    font-size:12px; color:var(--ink2); background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08); border-radius:8px; padding:4px 9px;
  }
  .bpi.st{color:var(--gold); border-color:rgba(255,201,60,.45); background:rgba(255,201,60,.09)}
  .bpi img{width:15px; height:15px; object-fit:contain; vertical-align:-3px}

  .fld .sw{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink2); cursor:pointer; line-height:1.4}
  .fld .sw input{accent-color:var(--gold); cursor:pointer; flex:none}
  .inp.rng{width:170px; padding:0; height:24px; accent-color:var(--gold); background:none; box-shadow:none; border:0}
  .fld .sel2{width:auto; min-width:170px; padding:6px 10px; margin-right:8px}
  .sfxRow{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 6px}
  .btn.mini2{font-size:12px; padding:5px 9px; box-shadow:0 2px 0 var(--ink-stroke)}
  .tip2{
    margin-top:9px; font-size:11.5px; line-height:1.75; color:var(--ink3);
    background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.07);
    border-radius:9px; padding:8px 11px;
  }
  .tip2 b{color:var(--ink2)}
  body.edOpen #gear{opacity:0 !important; pointer-events:none}

  /* ================= v6：休息页改版 ================= */
  /* 待机：大字 + 一排视频入口 */
  .bkIdle{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(22px,4vh,46px); padding:4vh 5vw; max-width:96vw;
  }
  .bkCards{
    display:flex; flex-wrap:wrap; justify-content:center;
    gap:clamp(12px,2vw,26px); max-width:min(1100px,92vw);
  }
  .bkCard{
    width:clamp(150px,17vw,230px); padding:0 0 11px;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12);
    border-radius:15px; overflow:hidden; cursor:pointer; color:inherit;
    display:flex; flex-direction:column; align-items:stretch; gap:7px;
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .bkCard:hover{
    transform:translateY(-5px); border-color:var(--gold);
    box-shadow:0 12px 34px rgba(255,201,60,.22);
  }
  .bcBox{
    position:relative; width:100%; aspect-ratio:16/9; overflow:hidden;
    background:linear-gradient(160deg,#3a2f5e,#241d3d);
    display:flex; align-items:center; justify-content:center;
  }
  /* 卡片里的首帧封面，不能跟着全屏播放那条规则铺满整屏 */
  #breakLayer .bcShot{width:100%; height:100%; object-fit:cover; display:block}
  .bcIco{font-size:clamp(46px,5.4vw,74px); line-height:1; opacity:.26}
  .bcPlay{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:clamp(38px,4vw,52px); height:clamp(38px,4vw,52px); border-radius:50%;
    background:rgba(0,0,0,.55); border:2px solid rgba(255,255,255,.85);
    color:#fff; font-size:clamp(14px,1.5vw,19px);
    display:flex; align-items:center; justify-content:center; padding-left:3px;
  }
  .bkCard:hover .bcPlay{background:var(--gold); border-color:var(--gold); color:#2a1d00}
  .bcNm{
    font-size:clamp(13px,1.4vw,17px); font-weight:800; color:var(--ink);
    padding:0 11px; text-align:center; line-height:1.25;
  }
  .bcKind{font-size:11.5px; color:var(--ink3); text-align:center}
  .bkHint2{font-size:clamp(12px,1.3vw,15px); color:var(--ink3)}

  /* 播放中：视频铺满 */
  .bkStage{position:absolute; inset:0; background:#000}
  #breakLayer .bkStage video, #breakLayer .bkStage iframe{
    width:100%; height:100%; border:0; display:block;
  }
  /* 右上角的操作条，播放时也必须一直能点 —— iframe 会吞键盘 */
  .bkBar{
    position:absolute; right:14px; top:14px; z-index:5; display:flex; gap:9px;
  }
  .bkBtn{
    font-size:13px; color:#fff; background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.35); border-radius:8px;
    padding:8px 14px; cursor:pointer; opacity:.4; transition:opacity .2s;
  }
  .bkBtn:hover{opacity:1; background:rgba(0,0,0,.82)}
  .bkBtn.main{opacity:.65}
  .bkBtn.main:hover{opacity:1}

  /* 编辑器里的视频清单 */
  .brow{display:flex; align-items:center; gap:6px; margin-bottom:6px}
  .brow .inp.bnm{flex:1; min-width:0}
  .brow .inp.bkd{width:86px; flex:none; font-size:12px; padding:6px 6px}
  .brow .inp.bsrc{flex:1.3; min-width:0}
  .brow .btn.mini{
    width:28px; height:30px; padding:0; font-size:15px; line-height:1;
    display:flex; align-items:center; justify-content:center; flex:none;
  }

  /* ================= v6：移动设备适配 =================
     注意：v5 时代那批 @media 里写的是 #cards{--cw:…}，而 v6 用的是
     #cards.pGrid{…}，优先级更高，所以那些老规则对 v6 一条都没生效。
     这里一律用 #cards.pGrid 重写。 */

  /* 点一下就走，不要双击缩放的 300ms 延迟，也不要长按弹菜单 */
  #game{touch-action:manipulation}
  .card.pk, .bkCard, .spinBtn, #foot .btn{-webkit-tap-highlight-color:transparent}

  /* iPhone 的 Home 指示条会压住底栏 */
  #foot{padding-bottom:calc(8px + env(safe-area-inset-bottom, 0px))}

  /* ---- 手机竖屏：高度富裕，把牌放大，别浪费 ---- */
  @media (max-width: 560px){
    #cards.pGrid{
      --cw:min(calc((100vw - 26px) / (var(--cols,4) * 1.12)), 21vh, 200px);
      gap:calc(var(--cw) * .1);
    }
    #cards.pGrid.big{--cw:min(calc((100vw - 26px) / (var(--cols,4) * 1.1)), 23vh, 210px)}
    #cards.pGrid.solo{--cw:min(62vw, 30vh, 230px)}
    .soloRow{gap:14px}
    #claim{gap:7px 9px}
    .cw{padding:7px 11px; gap:7px}
    .bkCard{width:calc(50vw - 26px)}
    .bkCards{gap:11px}
    #foot .btn{font-size:11.5px; padding:7px 10px}
    #foot .keys{gap:5px}
    #foot kbd{display:none}      /* 窄屏一律当触屏，徽章只占地方 */
    #foot .keys .btn{flex:none; white-space:nowrap}
    #status{font-size:10.5px}
  }

  /* ---- 手机横屏：390 高是最紧的，两行牌 + 底栏必须都在屏内 ---- */
  @media (max-height: 520px){
    #cards.pGrid{
      --cw:min(calc((100vw - 40px) / (var(--cols,4) * 1.24)), 18vh, 140px);
      gap:calc(var(--cw) * .11);
    }
    #cards.pGrid.big{--cw:min(calc((100vw - 36px) / (var(--cols,4) * 1.2)), 19vh, 150px)}
    #cards.pGrid.solo{--cw:min(34vw, 46vh, 190px)}
    .cd{height:clamp(20px,3.2vh,30px)}
    .cdN{font-size:clamp(17px,4.4vh,26px)}
    .starTag{font-size:calc(var(--cw) * .1); padding:2px 7px}
    #claim{gap:5px 8px}
    .cw{padding:5px 10px; gap:7px}
    .cn{font-size:clamp(15px,4.4vh,20px)}
    .ci{font-size:clamp(15px,4.4vh,20px)}
    .cm2{font-size:clamp(11px,3vh,14px)}
    .bkCard{width:clamp(110px,16vw,165px)}
    .bkIdle{gap:clamp(10px,2.4vh,22px)}
  }

  /* ---- 触屏：快捷键徽章纯占地方 ---- */
  @media (hover: none){
    #foot kbd{display:none}
    .bkHint2 kbd, #ruleLayer kbd{display:none}
  }

  /* ---- 编辑器：窄屏时整行会挤爆，拆成两行 ---- */
  @media (max-width: 620px){
    #editor{width:100vw}
    #edHead{flex-wrap:wrap; gap:6px; padding:10px 12px}
    #edHead .t{width:100%; margin-bottom:1px}
    #edHead .btn{font-size:12px; padding:7px 11px; white-space:nowrap}
    .prowHead{display:none}
    .prow, .brow{
      flex-wrap:wrap; row-gap:5px; padding-bottom:8px; margin-bottom:8px;
      border-bottom:1px solid rgba(255,255,255,.07);
    }
    .prow .inp.nm{flex:1 1 150px}
    .prow .inp.p3{width:70px}
    .prow .inp.p4{width:92px}
    .brow .inp.bnm{flex:1 1 120px}
    .brow .inp.bsrc{flex:1 1 150px}
    .ratio{font-size:11.5px}
  }

  /* ================= 云端配置 ================= */
  .cloudRow{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; font-size:13px; color:var(--ink2)}
  .cloudRow label{min-width:96px}
  .cloudRow .inp{flex:1; min-width:180px; max-width:440px}
  .cloudRow .inp.tok{font-family:var(--mono); font-size:12px}
  .cloudMsg{font-size:12.5px; color:var(--ink3); margin-top:8px; line-height:1.6; min-height:1.2em; word-break:break-all}
  .cloudMsg.err{color:var(--red)}
  .cloudMsg.ok{color:var(--gold)}
  #cloudLayer{
    position:fixed; inset:0; z-index:960; background:rgba(0,0,0,.74);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .clBox{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:22px 24px; display:flex; flex-direction:column; gap:12px;
    width:min(600px, 94vw); max-height:88vh;
  }
  .clT{font-size:18px; font-weight:800}
  .clList{overflow-y:auto; display:flex; flex-direction:column; gap:6px; min-height:48px}
  .clV{
    display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:9px; cursor:pointer;
    background:var(--panel2); border:1px solid var(--line); font-size:13px; color:var(--ink2);
  }
  .clV:hover, .clV.on{border-color:var(--gold)}
  .clV.on{background:rgba(255,201,60,.08)}
  .clV .t{font-family:var(--mono); font-size:12px; color:var(--ink3); white-space:nowrap}
  .clV .m{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:inherit}
  .clV .w{font-size:12px; color:var(--ink3); white-space:nowrap}
  .clSum{font-size:13px; color:var(--ink2); line-height:1.7; min-height:1.4em}
  .clSum.err{color:var(--red)}
  .clA{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap}
  .btn[disabled]{opacity:.42; cursor:default; box-shadow:none; transform:none}
  .cloudRow .btn.peek{flex:none; font-size:12px; padding:6px 10px; box-shadow:0 2px 0 var(--ink-stroke)}
  .lockBox{margin-top:12px; font-size:13px; color:var(--ink2); border-top:1px dashed var(--line); padding-top:10px}
  .lockBox summary{cursor:pointer; color:var(--ink3); font-size:12px; user-select:none}
  .lockBox .cloudRow{margin-top:8px}
  .lockBox textarea{
    width:100%; min-height:56px; margin-top:8px; font-family:var(--mono); font-size:11px; line-height:1.5;
    background:var(--panel2); color:var(--ink2); border:1px solid var(--line); border-radius:8px; padding:8px;
    word-break:break-all; resize:vertical;
  }
</style>

<body>

<div id="bgFx"></div>
<audio id="bgm" loop preload="auto"></audio>
<div id="roundAura"></div>
<div id="vig"></div>
<div id="flash"></div>

<button id="gear" title="设置（Ctrl+E）">⚙</button>

<div id="editor" class="hide">
  <div id="edHead">
    <div class="t">编辑配置</div>
    <button class="btn" id="btnImport">导入配置</button>
    <button class="btn" id="btnExport">导出配置</button>
    <button class="btn danger" id="btnDefault">恢复默认</button>
    <button class="btn" id="btnBack">返回</button>
    <button class="btn main" id="btnSave">保存并重开</button>
  </div>
  <div id="edBody"></div>
  <input type="file" id="fileImport" accept=".json,application/json" class="hide">
  <input type="file" id="fileImg" accept="image/*" class="hide">
</div>

<div id="game" class="hide">
  <div id="shelf"></div>
  <div id="stage"></div>
  <canvas id="fx"></canvas>
  <div id="foot">
    <div class="keys">
      <button class="btn main" data-act="advance">继续 / 确认<kbd>空格</kbd></button>
      <button class="btn" data-act="redraw">重抽本轮<kbd>D</kbd></button>
      <button class="btn" data-act="rules">规则<kbd>H</kbd></button>
      <button class="btn" data-act="break">休息<kbd>B</kbd></button>
      <button class="btn" data-act="restart">重开全场<kbd>R</kbd></button>
    </div>
    <div id="status"></div>
  </div>
</div>

<div id="ruleLayer" class="hide"></div>
<div id="breakLayer" class="hide"></div>
<div id="resumeLayer" class="hide"></div>
<div id="cloudLayer" class="hide"></div>

<script>
(() => {
'use strict';

/* ================= 默认配置 =================
   奖品是一张扁平清单，每件带一个「批次号」。批次由批次号分组得出，
   不需要单独的档位概念，也不需要数量（每件恒为 1）。
   价格只用于编辑器里的「帮我排一版」和你自己算账，从不显示给观众。 */
const BUILD = 'v6 · 11-04 15:30';          // 组装时替换成构建时间；用来判断手机上是不是旧缓存
const DEFAULT_CFG = {
  guests: 250,
  theme: { bg:'#171425', pattern:10, dotSize:13, dotGap:104 },
  pickSeconds: 15,          // 翻牌倒计时；归零自动翻高亮那张。填 0 = 不计时
  tease: false,             // 抖动阶段就按真实品质抖和亮（翻面前的预告）；关 = 中性，翻面那一刻才见品质
  volume: 0.8,              // 音效总音量 0~1
  mute: false,              // 静音（M 键）
  bgm: 'sherwood',          // 背景音乐曲目（art/bgm/<名>.mp3；'' = 不放）
  bgmVolume: 0.3,           // 背景音乐音量 0~1
  starRatio: 3,             // 「帮我排一版」时镇批之宝相对同批其余均价的目标倍数
  breakAfter: [],           // 哪几批发完后自动进休息页（存批次号）
  // 休息页：text 是常驻大字，clips 是一排视频入口（本地 mp4 / B 站 / 优酷）
  breakScreen: { text:'稍后继续', clips: [] },
  prizes: [
    { nm:'保温杯',     ico:'\u{1F964}', img:null, price:60,   batch:1, star:false },
    { nm:'香薰蜡烛',   ico:'\u{1F56F}', img:null, price:80,   batch:1, star:false },
    { nm:'帆布托特包', ico:'\u{1F45C}', img:null, price:100,  batch:1, star:false },
    { nm:'马克杯',     ico:'☕',    img:null, price:100,  batch:1, star:false },
    { nm:'桌面台灯',   ico:'\u{1F4A1}', img:null, price:250,  batch:1, star:true  },

    { nm:'焖烧保温壶', ico:'\u{1F375}', img:null, price:120,  batch:2, star:false },
    { nm:'折叠伞',     ico:'☂',    img:null, price:150,  batch:2, star:false },
    { nm:'护手霜礼盒', ico:'\u{1F9F4}', img:null, price:150,  batch:2, star:false },
    { nm:'双肩包',     ico:'\u{1F392}', img:null, price:200,  batch:2, star:false },
    { nm:'蓝牙音箱',   ico:'\u{1F50A}', img:null, price:450,  batch:2, star:true  },

    { nm:'机械键盘',   ico:'⌨',    img:null, price:400,  batch:3, star:false },
    { nm:'加湿器',     ico:'\u{1F4A8}', img:null, price:450,  batch:3, star:false },
    { nm:'空气炸锅',   ico:'\u{1F373}', img:null, price:500,  batch:3, star:false },
    { nm:'降噪耳机',   ico:'\u{1F3A7}', img:null, price:1500, batch:3, star:true  },

    { nm:'iPad',       ico:'\u{1F4F1}', img:null, price:2000, batch:4, star:true  },
  ],
};

const CFG_KEY  = 'lottery.config.v6';
const OLD_KEY  = 'lottery.config.v5';
const SAVE_KEY = 'lottery.save.v6';

let cfg = loadCfg();

function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* 旧版的「档位」配置自动转成新版的扁平奖品清单：
   一个档位 = 一个批次，档里最贵的那件自动成为镇批之宝 */
function migrate(old){
  if (!old || !Array.isArray(old.tiers)) return null;
  const prizes = [];
  old.tiers.forEach((t, ti) => {
    (t.items || []).forEach(it => {
      const n = Math.max(1, +it.count || 1);
      for (let k = 0; k < n; k++)
        prizes.push({ nm: it.nm, ico: it.ico, img: it.img || null,
                      price: +t.price || 0, batch: ti + 1, star: false });
    });
  });
  if (!prizes.length) return null;
  const byBatch = {};
  prizes.forEach(p => { (byBatch[p.batch] = byBatch[p.batch] || []).push(p); });
  Object.keys(byBatch).forEach(b => {
    const arr = byBatch[b];
    arr.reduce((m, x) => (x.price >= m.price ? x : m), arr[0]).star = true;
  });
  return {
    guests: old.guests || DEFAULT_CFG.guests,
    theme: old.theme || clone(DEFAULT_CFG.theme),
    pickSeconds: DEFAULT_CFG.pickSeconds,
    tease: DEFAULT_CFG.tease,
    volume: DEFAULT_CFG.volume,
    mute: false,
    bgm: DEFAULT_CFG.bgm,
    bgmVolume: DEFAULT_CFG.bgmVolume,
    starRatio: DEFAULT_CFG.starRatio,
    breakAfter: [],
    breakScreen: fixBreak(old.breakScreen),
    prizes: prizes,
  };
}

function loadCfg(){
  try{
    const raw = localStorage.getItem(CFG_KEY);
    if (raw){
      const c = JSON.parse(raw);
      if (c && Array.isArray(c.prizes) && c.prizes.length) return fillCfg(c);
    }
    const old = localStorage.getItem(OLD_KEY);
    if (old){
      const m = migrate(JSON.parse(old));
      if (m) return fillCfg(m);
    }
  }catch(e){ /* 配置坏了就退回默认 */ }
  return clone(DEFAULT_CFG);
}

/* 老配置是「三选一 + 单个视频」，转成视频清单 */
function fixBreak(b){
  if (!b) return clone(DEFAULT_CFG.breakScreen);
  if (Array.isArray(b.clips)) return { text: b.text || DEFAULT_CFG.breakScreen.text, clips: b.clips };
  const clips = [];
  if (b.mode === 'local' && b.file)
    clips.push({ nm:'休息视频', kind:'local', file:b.file });
  else if (b.mode === 'online' && b.vid)
    clips.push({ nm:'休息视频', kind: b.platform === 'youku' ? 'youku' : 'bili', vid:b.vid });
  return { text: b.text || DEFAULT_CFG.breakScreen.text, clips: clips };
}

function fillCfg(c){
  const d = DEFAULT_CFG;
  if (!c.theme) c.theme = clone(d.theme);
  ['bg','pattern','dotSize','dotGap'].forEach(k => {
    if (c.theme[k] === undefined) c.theme[k] = d.theme[k];
  });
  if (c.guests === undefined) c.guests = d.guests;
  if (c.pickSeconds === undefined) c.pickSeconds = d.pickSeconds;
  c.tease = c.tease === undefined ? d.tease : !!c.tease;
  c.volume = (c.volume === undefined || isNaN(+c.volume)) ? d.volume : Math.max(0, Math.min(1, +c.volume));
  c.mute = !!c.mute;
  if (typeof c.bgm !== 'string') c.bgm = d.bgm;
  c.bgmVolume = (c.bgmVolume === undefined || isNaN(+c.bgmVolume)) ? d.bgmVolume : Math.max(0, Math.min(1, +c.bgmVolume));
  if (c.starRatio === undefined) c.starRatio = d.starRatio;
  if (!Array.isArray(c.breakAfter)) c.breakAfter = [];
  if (!c.breakScreen) c.breakScreen = clone(d.breakScreen);
  c.breakScreen = fixBreak(c.breakScreen);
  c.prizes.forEach(p => {
    if (p.batch === undefined) p.batch = 1;
    if (p.star === undefined) p.star = false;
    if (p.price === undefined) p.price = 0;
    if (p.img === undefined) p.img = null;
  });
  return c;
}

/* 面板/描边/次要文字都从背景色派生，改一个背景整套跟着走 */
const DERIVED = { '--panel':.92, '--panel2':.86, '--line':.76, '--ink2':.22, '--ink3':.46 };
function mixWhite(hex, w){
  const h = String(hex || '').replace('#', '').trim();
  const n = h.length === 3 ? h[0]+h[0]+h[1]+h[1]+h[2]+h[2] : h;
  if (!/^[0-9a-fA-F]{6}$/.test(n)) return null;
  let out = '#';
  for (let i = 0; i < 3; i++){
    const v = parseInt(n.substr(i * 2, 2), 16);
    out += ('0' + Math.round(v * w + 255 * (1 - w)).toString(16)).slice(-2);
  }
  return out;
}
function applyTheme(){
  const t = cfg.theme || {};
  const bg = t.bg || DEFAULT_CFG.theme.bg;
  const root = document.documentElement.style;
  root.setProperty('--bg', bg);
  for (const k in DERIVED){
    const c = mixWhite(bg, DERIVED[k]);
    if (c) root.setProperty(k, c);
  }
  const fx = document.getElementById('bgFx');
  if (!fx) return;
  const dot = mixWhite(bg, .26);
  if (dot) fx.style.setProperty('--dot', dot);
  const D = DEFAULT_CFG.theme;
  const v = (t.pattern === undefined ? D.pattern : t.pattern);
  fx.style.opacity = (Math.max(0, Math.min(40, v)) / 100).toFixed(3);
  fx.style.setProperty('--dotSize', (t.dotSize === undefined ? D.dotSize : t.dotSize) + 'px');
  fx.style.setProperty('--dotGap',  (t.dotGap  === undefined ? D.dotGap  : t.dotGap)  + 'px');
}

const $ = id => document.getElementById(id);

function esc(s){ return String(s == null ? '' : s).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function itemHTML(it, cls){

/* 把扁平清单按批次号分组。批次号可以不连续，排序后就是出场顺序 */
function groupBatches(list){
  const map = new Map();
  (list || []).forEach(p => {
    const b = Math.max(1, Math.min(99, Math.round(+p.batch) || 1));
    if (!map.has(b)) map.set(b, []);
    map.get(b).push(p);
  });
  return Array.from(map.keys()).sort((a, b) => a - b).map(no => {
    const items = map.get(no);
    return { no: no, items: items, star: items.find(x => x.star) || null };
  });
}

/* ================= 自动排批（编辑器里的「帮我排一版」）=================
   规则：最贵的单独成批当全场大奖；其余每批 4~6 件；每批先取最便宜的 n-1 件，
   再按「均价 × 倍数」去池子里挑最接近的一件当镇批之宝。
   这样倍数稳定，而且顶部的好东西不会被提前摘走。 */
function batchCount(M, MIN, MAX, IDEAL){
  if (M <= MAX) return 1;
  let best = null;
  for (let B = 1; B <= M; B++){
    const base = Math.floor(M / B), extra = M % B;
    if (base + (extra ? 1 : 0) > MAX) continue;
    if (base < MIN && B > 1) continue;
    const cost = Math.abs(M / B - IDEAL);
    if (!best || cost < best.cost) best = { B: B, cost: cost };
  }
  return best ? best.B : Math.ceil(M / MAX);
}

function autoPlan(){
  const MIN = 4, MAX = 6, IDEAL = 5;
  const R = Math.max(1.2, +cfg.starRatio || 3);
  const pool = cfg.prizes.slice().sort((a, b) => (+a.price || 0) - (+b.price || 0));
  if (pool.length < 2) return;
  cfg.prizes.forEach(p => { p.star = false; });

  const grand = [pool.pop()];
  while (grand.length < 3 && pool.length > MIN &&
         (+pool[pool.length-1].price || 0) >= (+grand[grand.length-1].price || 0) * 0.8){
    grand.push(pool.pop());
  }
  const M = pool.length;
  const B = M ? batchCount(M, MIN, MAX, IDEAL) : 0;
  const base = B ? Math.floor(M / B) : 0, extra = B ? M % B : 0;

  for (let k = 0; k < B; k++){
    const n = base + (k < extra ? 1 : 0);
    const no = k + 1;
    if (n <= 1){ pool.splice(0, n).forEach(p => { p.batch = no; p.star = true; }); continue; }
    const plain = pool.splice(0, n - 1);
    const avg = plain.reduce((a, x) => a + (+x.price || 0), 0) / plain.length;
    const want = avg * R;
    let bi = 0, bd = Infinity;
    pool.forEach((x, i) => {
      const dd = Math.abs((+x.price || 0) - want);
      if (dd < bd){ bd = dd; bi = i; }
    });
    const star = pool.splice(bi, 1)[0];
    plain.forEach(p => { p.batch = no; });
    if (star){ star.batch = no; star.star = true; }
  }
  grand.forEach(p => { p.batch = B + 1; });
  if (grand.length){
    grand.reduce((m, x) => ((+x.price || 0) >= (+m.price || 0) ? x : m), grand[0]).star = true;
  }
}

const $stage = $('stage'), $status = $('status');

let batches = [];     // [{ no, items, star }]
let bi = 0;           // 当前批下标
let deck = [];        // 当前批洗好的牌：[{ p: 奖品, by: null | 号码 }]
let drawnNums, prizeCount, cur, mode, gameStarted = false;
let breakDone = {}, autoBreak = false;

let drawTimers = [];
function clearDrawTimers(){
  drawTimers.forEach(f => { try{ f(); }catch(e){} });
  drawTimers = [];
}

const batchTag = k => (batches.length && k === batches.length - 1)
  ? '最后一批' : ('第 ' + (k + 1) + ' 批');
const isLastBatch = () => bi === batches.length - 1;
const remainCount = () => deck.filter(d => d.by === null).length;
/* 整批只有一件：不盖牌、不洗牌、不编号，奖品全程摆着，抽到号直接结算 */
const isSolo = () => deck.length === 1;

/* 牌面稀有度按批次整体递进，金色只留给最后一批：
   前面各批普通牌在 1~3 之间随批次爬升，镇批之宝 = 本批普通 + 1（最高到紫）；
   最后一批宝固定金、其余固定紫。宝一上来就金会把大奖那一下的对比冲淡。 */
function rarityOf(p){
  const star = !!(p && p.star);
  if (isLastBatch()) return star ? 5 : 4;
  const m = Math.max(1, batches.length - 1);       // 最后一批之前有几批
  const base = 1 + Math.min(2, Math.round(bi * 3 / m));
  return star ? base + 1 : base;
}

function shuffled(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function stopGame(){ stopFx(); clearDrawTimers(); stopCountdown(); }

function startGame(){
  stopGame();
  batches = groupBatches(cfg.prizes);
  bi = 0; deck = [];
  drawnNums = new Set();
  prizeCount = 0;
  cur = null;
  breakDone = {}; autoBreak = false;
  gameStarted = true;
  $('game').classList.remove('hide');
  if (!batches.length) return screenDone();
  enterBatch();
}

function enterBatch(){
  if (bi >= batches.length) return screenDone();
  deck = shuffled(batches[bi].items).map(p => ({ p: p, by: null }));
  if (isSolo()) return screenSolo();     // 就一件，没什么可盖可洗的
  screenIntro();
}

function nextBatch(){
  const prev = batches[bi];
  bi++;
  if (bi >= batches.length) return screenDone();
  if (prev && breakGate(prev.no)) return;      // 这一批勾了「发完后休息」
  enterBatch();
}

/* 休息点：某一批发完、勾了休息、且还没休息过，就停一次 */
function breakGate(no){
  if (!Array.isArray(cfg.breakAfter)) return false;
  if (cfg.breakAfter.indexOf(no) < 0 || breakDone[no]) return false;
  breakDone[no] = true;
  autoBreak = true;
  toggleBreak();
  return true;
}

        '</div></div>';
    }).join('') + '</div>';
}

const SFX_TRY = [['pop','亮相弹入'],['place','扣下'],['shuffle','洗牌'],['lever','抽号'],['tick','滚轮'],
  ['stop','刹停'],['ding','报号'],['cd','倒计时'],['sel','选牌'],['lift','滑入'],['rumble','抖动'],['riser','蓄力升调'],['flip','翻面'],['thump','翻面冲击'],
  ['popper','彩带'],['hit1','揭晓·普通'],['hit3','揭晓·宝'],['hit5','揭晓·大奖'],['claim','领奖清单'],['done','全部结束']];
let ac = null, sfxBuf = {}, sfxMaster = null;

function sfxInit(){
  if (ac) return;
  try{ ac = new (window.AudioContext || window.webkitAudioContext)(); }
  catch(e){ ac = null; return; }
  sfxMaster = ac.createGain();
  sfxMaster.connect(ac.destination);
  sfxApplyVolume();
  Object.keys(SFX_DATA).forEach(name => {
    fetch(SFX_DATA[name]).then(r => r.arrayBuffer())
      .then(ab => new Promise((ok, no) => {                 // 老 Safari 只认回调式
        const p = ac.decodeAudioData(ab, ok, no);
        if (p && p.then) p.then(ok, no);
      }))
      .then(buf => { sfxBuf[name] = buf; })
      .catch(() => {});
  });
}
function sfxUnlock(){
  sfxInit();
  if (ac && ac.state === 'suspended'){ try{ ac.resume().catch(() => {}); }catch(e){} }
  if (!bgmWant){ bgmWant = true; bgmPlay(); }
}
function sfxVol(){ const v = +cfg.volume; return isNaN(v) ? 0.8 : Math.max(0, Math.min(1, v)); }
function sfxApplyVolume(){
  if (!sfxMaster) return;
  sfxMaster.gain.setTargetAtTime(cfg.mute ? 0 : sfxVol(), ac.currentTime, 0.02);
}
/* 出口：平时走总线（静音时不出声）；试听走旁路，静音也能听 */
function sfxOut(direct){
  if (!ac) return null;
  if (!direct) return cfg.mute ? null : sfxMaster;
  const g = ac.createGain(); g.gain.value = sfxVol() || 0.8; g.connect(ac.destination);
  return g;
}

/* 放一条素材。o：gain 音量 / rate 变速 / when 延后秒 / direct 走旁路（试听）
   带包络的用法：dur 持续秒数内 gain→gainTo、rate→rateTo、lp→lpTo（低通）指数过渡，release 收尾淡出，loop 循环素材 */
function sfxPlay(name, o){
  o = o || {};
  const out = sfxOut(o.direct);
  const buf = sfxBuf[name];
  if (!out || !buf) return null;
  const t = ac.currentTime + (o.when || 0);
  const s = ac.createBufferSource();
  s.buffer = buf; s.loop = !!o.loop;
  s.playbackRate.setValueAtTime(o.rate || 1, t);
  if (o.rateTo && o.dur) s.playbackRate.exponentialRampToValueAtTime(o.rateTo, t + o.dur);
  let node = s;
  if (o.lp){
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = o.q || 0.8;
    f.frequency.setValueAtTime(o.lp, t);
    if (o.lpTo && o.dur) f.frequency.exponentialRampToValueAtTime(o.lpTo, t + o.dur);
    node.connect(f); node = f;
  }
  const g = ac.createGain();
  const g0 = Math.max(0.001, o.gain === undefined ? 1 : o.gain);
  if (o.gainTo !== undefined && o.dur){
    const g1 = Math.max(0.001, o.gainTo);
    g.gain.setValueAtTime(g0, t);
    g.gain.exponentialRampToValueAtTime(g1, t + o.dur);
    if (o.release){ g.gain.setValueAtTime(g1, t + o.dur); g.gain.exponentialRampToValueAtTime(0.001, t + o.dur + o.release); }
  } else g.gain.value = g0;
  node.connect(g); g.connect(out);
  s.start(t);
  if (o.dur) s.stop(t + o.dur + (o.release || 0) + 0.05);
  return s;
}
function sfx(name, o){ return sfxPlay(name, o); }

/* 蓄力（抽卡的 riser，桌游的"等结果"）：骰子摇动拉到和抖动一样长、越来越响；
   风声循环速度一路拉升、低通逐渐打开，就是气流往上涌；轻木敲击由疏到密（170ms → 55ms） */
function sfxRiser(sec, direct){
  if (!ac) return;
  const shake = sfxBuf.shake;
  const sr = shake ? Math.max(0.7, Math.min(1.6, shake.duration / sec)) : 1;
  sfxPlay('shake', { direct: direct, rate: sr, lp: 3200, gain: 0.3, gainTo: 0.9, dur: sec, release: 0.06 });
  sfxPlay('wind', { direct: direct, loop: true, rate: 0.6, rateTo: 1.5, lp: 400, lpTo: 2600, q: 1.1,
                    gain: 0.02, gainTo: 0.55, dur: sec, release: 0.08 });
  let at = 0, iv = 0.17;
  while (at < sec){
    sfxPlay('stop', { direct: direct, when: at, gain: 0.12 + 0.3 * (at / sec), rate: 1.3 + 0.6 * (at / sec) });
    at += iv; iv = Math.max(0.055, iv * 0.86);
  }
}

/* 鼓滚：同一条风声降一个八度、只留 150 Hz 以下，从无到有 */
function sfxRumble(sec, direct){
  sfxPlay('wind', { direct: direct, loop: true, rate: 0.45, lp: 150, q: 0.7, gain: 0.02, gainTo: 0.8, dur: sec, release: 0.12 });
}

/* 翻面冲击（抽卡的落锤）：桌面敲击 + 软物重击，k 是力度 .55~1，越重越放慢（更沉） */
function sfxThump(k, direct){
  sfxPlay('knock', { direct: direct, gain: 0.9 * k, rate: 1.05 - 0.25 * k });
  sfxPlay('thud',  { direct: direct, gain: k,       rate: 1.1 - 0.3 * k });
}

/* 彩带礼炮：软物中击当"砰"，纸牌扇动当纸屑沙沙 */
function sfxPopper(direct){
  sfxPlay('bump', { direct: direct, gain: 0.9, rate: 1.25 });
  sfxPlay('fan',  { direct: direct, when: 0.04, gain: 0.5, rate: 0.95 });
}

/* 编辑器「试听」：静音状态下也能听（走旁路） */
function sfxTry(name){
  sfxUnlock();
  if (name === 'rumble') return sfxRumble(0.9, true);
  if (name === 'popper') return sfxPopper(true);
  if (name === 'riser') return sfxRiser(0.9, true);
  if (name === 'thump') return sfxThump(1, true);
  sfx(name, { direct: true });
}

/* ---------- 背景音乐 ----------
   曲子是 art/bgm/ 下的独立 mp3，用 <audio> 循环放：file:// 下也能放，想换曲子把文件丢进目录就行，不用重新发布。
   不走 WebAudio：file:// 下 createMediaElementSource 会因为跨源直接静音。音量用 audio.volume 调（iOS 不认，只能开关）。
   揭晓时压低到 1/3（bgmDuck），休息页放视频时暂停，M 键静音一起管。 */
const BGM_TRACKS = [['', '不放'], ['sherwood', 'Sherwood · 轻松'], ['shineblitz', 'Shine Blitz · 有劲'],
                    ['happyclappy', 'Happy Clappy · 钢琴'], ['custom', '自定义 custom.mp3']];
let bgmWant = false, bgmDuckK = 1, bgmTween = 0;      // bgmDuckK：1 正常 / .33 揭晓压低 / 0 大奖让路
function bgmVol(){ const v = +cfg.bgmVolume; return isNaN(v) ? 0.3 : Math.max(0, Math.min(1, v)); }
function bgmTarget(){ return (cfg.mute || !cfg.bgm) ? 0 : bgmVol() * bgmDuckK; }
function bgmApply(fade){
  const a = $('bgm'); if (!a) return;
  const to = bgmTarget();
  clearInterval(bgmTween);
  if (!fade){ try{ a.volume = to; }catch(e){} return; }
  const from = a.volume, t0 = Date.now();
  bgmTween = setInterval(() => {
    const k = Math.min(1, (Date.now() - t0) / 450);
    try{ a.volume = from + (to - from) * k; }catch(e){}
    if (k >= 1) clearInterval(bgmTween);
  }, 40);
}
function bgmLoad(){
  const a = $('bgm'); if (!a) return;
  const src = cfg.bgm ? 'art/bgm/' + cfg.bgm + '.mp3' : '';
  if (a.dataset.src === src) return;
  a.dataset.src = src;
  if (!src){ a.pause(); a.removeAttribute('src'); return; }
  a.src = src;
  bgmApply(false);
  bgmPlay();
}
function bgmPlay(){
  const a = $('bgm');
  if (!a || !cfg.bgm || !bgmWant) return;     // bgmWant：有过一次交互之后才允许放（浏览器的自动播放限制）
  if (breakClip >= 0) return;                  // 休息页正在放视频
  bgmApply(false);
  try{ const p = a.play(); if (p && p.catch) p.catch(() => {}); }catch(e){}
}
function bgmPause(){ const a = $('bgm'); if (a) a.pause(); }
function bgmDuck(on, deep){
  const k = on ? (deep ? 0 : 0.33) : 1;
  if (bgmDuckK === k) return;
  bgmDuckK = k; bgmApply(true);
}

/* ---------- 换舞台内容 ----------
   统一的切屏过渡：旧画面淡出并轻微下沉（.out，.18s）→ 换内容 → 新画面从上方淡入（.24s），背景图案不动。
   以前是整块 innerHTML 直接换，用户反馈像跳切（2026-10-29）。舞台还空着的第一屏直接铺、不淡入。
   各 screen 函数在调用前就把 mode 设好，所以过渡那 .18s 里的按键按新屏算：抽号按钮还没进 DOM 时
   pressSpin 自己会跳过，推进键本来就有 350ms 节流。要摸新 DOM 的事（绑按钮、量尺寸、起倒计时）放 after 里。 */
const OUT_DUR = 180;
let stageSwap = 0;
function setStage(html, after){
  const fill = (fade) => {
    stageSwap = 0;
    $stage.innerHTML = html;
    $stage.classList.remove('out');
    bgmDuck(false);                            // 展示没放完就跳走的话，这里把音乐放回来
    if (fade){                                   // 从「上方 + 透明」过渡到常态
      $stage.style.transition = 'none';
      $stage.style.opacity = '0';
      $stage.style.transform = 'translateY(-12px)';
      void $stage.offsetWidth;
      $stage.style.transition = '';
      $stage.style.opacity = '';
      $stage.style.transform = '';
    }
    if (after) after();
  };
  if (stageSwap) clearTimeout(stageSwap);
  if (!$stage.children.length) return fill(false);
  $stage.classList.add('out');
  stageSwap = setTimeout(() => fill(true), OUT_DUR);
}

function screenIntro(){
  mode = 'intro';
  stopFx(); clearDrawTimers(); stopCountdown();
  document.body.classList.add('compact');
  const b = batches[bi];
  // 亮相按配置顺序摆、正面朝上、背面不印数字；
  // 洗牌会把它们真的挪到 deck 的顺序上，编号等洗完才发
  setStage(
    '<div class="phase-tag">' + batchTag(bi) + '</div>' +
    '<div class="big" id="bg">这一批 ' + b.items.length + ' 件</div>' +
    '<div id="cards" class="pGrid big" style="--cols:' + gridCols(b.items.length) + '">' +
      b.items.map((p, ii) => {
        const r = rarityOf(p);
        return '<div class="card pk flipped' + (p.star ? ' starCard' : '') +
                 '" data-r="' + r + '" data-ii="' + ii + '">' +
          cardFxHTML(r) +
          '<div class="inner">' +
            '<div class="face front">' +
              (p.star ? '<div class="starTag">本批最大</div>' : '') +
              faceHTML(p, null) +
            '</div>' +
            '<div class="face back"><div class="num"></div></div>' +
          '</div></div>';
      }).join('') + '</div>' +
    '<div class="sub" id="cm">看清楚了 —— 等下它们会被扣过来　<kbd>空格</kbd> 洗牌</div>',
    enterAnim);
  renderStatus();
  saveGame();
}

/* ---------- 洗牌 ----------
   真的换位置，不是原地抖：量出每张牌当前的位置 → 位移到目标槽位 → 过渡跑完后
   重排 DOM 并清掉位移（FLIP）。最后一跳直接落到 deck 的真实顺序，所以落位之后
   屏幕上的顺序就是后面翻牌要用的顺序，不再偷偷重建一套。
   编号一律等洗完才发 —— 否则「数字先印好再抖」谁都看得出是假的。 */
function hopCards(grid, cur, perm, ms, done){
  const before = cur.map(el => el.getBoundingClientRect());
  const dest = [];
  perm.forEach((from, slot) => { dest[from] = before[slot]; });   // perm[槽位] = cur 里的第几张
  cur.forEach((el, i) => {
    const b0 = before[i], t0 = dest[i];
    if (!t0) return;
    el.style.transition = 'transform ' + ms + 'ms cubic-bezier(.4,.05,.25,1)';
    el.style.transform = 'translate(' + Math.round(t0.left - b0.left) + 'px,' +
                                        Math.round(t0.top - b0.top) + 'px)';
  });
  const h = setTimeout(() => {
    const next = perm.map(i => cur[i]);
    // 清位移和重排放在同一个同步块里，浏览器只画最终结果，看不到回跳
    next.forEach(el => { el.style.transition = 'none'; el.style.transform = ''; });
    next.forEach(el => grid.appendChild(el));
    void grid.offsetWidth;
    next.forEach(el => { el.style.transition = ''; });
    done(next);
  }, ms + 30);
  drawTimers.push(() => clearTimeout(h));
}

/* 洗完才发号，一张一张弹出来 */
function stampNumbers(els, done){
  els.forEach((el, i) => {
    const n = el.querySelector('.face.back .num');
    if (!n) return;
    n.textContent = String(i + 1);
    n.style.animationDelay = (i * 90) + 'ms';
    n.classList.remove('pop'); void n.offsetWidth; n.classList.add('pop');
  });
  const t = setTimeout(done, els.length * 90 + 560);
  drawTimers.push(() => clearTimeout(t));
}

function doShuffle(){
  if (mode !== 'intro') return;
  mode = 'anim';
  const grid = $('cards');
  const els = Array.from(grid.querySelectorAll('.card'));
  if (!grid || !els.length) return nextPick();

  // 一、原地扣下。背面只有花纹，没有数字
  els.forEach(el => {
    el.classList.remove('flipped', 'starCard', 'enter');
    el.style.animationDelay = '';
    el.setAttribute('data-r', '1');
    const fx = el.querySelector('.fx');
    if (fx) fx.outerHTML = cardFxHTML(1);
    const n = el.querySelector('.face.back .num');
    if (n){ n.textContent = ''; n.classList.remove('pop'); n.style.animationDelay = ''; }
  });
  setBig('扣下');
  setSub('');
  sfx('place', { gain: 0.9 });

  const items = batches[bi].items;
  const itemOf = el => items[+el.dataset.ii];

  const begin = () => {
    if (els.length < 2){                      // 一张牌没什么可洗的
      setBig('就这一件');
      return stampNumbers(els, nextPick);
    }
    setBig('洗牌');
    setSub('看得住哪张算哪张');
    sfx('shuffle');
    let cur = els, round = 0;
    const HOPS = 2;
    const step = () => {
      let perm;
      if (round < HOPS){
        perm = cur.map((_, i) => i);
        for (let i = perm.length - 1; i > 0; i--){
          const j = Math.floor(Math.random() * (i + 1));
          const t = perm[i]; perm[i] = perm[j]; perm[j] = t;
        }
      } else {
        // 最后一跳：落到 deck 的真实顺序
        perm = deck.map(d => cur.findIndex(el => itemOf(el) === d.p));
        if (perm.some(i => i < 0)) perm = cur.map((_, i) => i);   // 认不出来就原地不动，别把牌弄丢
      }
      hopCards(grid, cur, perm, round < HOPS ? 400 : 560, next => {
        cur = next;
        if (++round > HOPS){
          setBig('发牌号');
          setSub('');
          return stampNumbers(cur, nextPick);
        }
        step();
      });
    };
    step();
  };

  // 等翻面那 .82s 的过渡走完再开始挪，否则量到的是半翻状态的位置
  const t0 = setTimeout(begin, 900);
  drawTimers.push(() => clearTimeout(t0));
}

/* ---------- 一轮：抽号 → 翻牌 → 揭晓 ---------- */
function nextPick(){
  stopCountdown();
  saveGame();
  if (!deck.length || remainCount() === 0) return screenBatchDone();
  if (isSolo()) return screenSolo();
  screenSpin();
}

function screenSpin(){
  mode = 'prize';
  cur = { num: 0, sel: firstUnopened() };
  stopFx(); clearDrawTimers();
  document.body.classList.add('compact');
  setStage(
    '<div class="phase-tag">' + batchTag(bi) + '</div>' +
    '<div class="big" id="bg">还剩 ' + remainCount() + ' 件 · 抽下一位</div>' +
    slotHTML() +
    '<div class="spinHold" id="spinHold">' +
      '<button class="spinBtn" id="spinBtn">抽 号</button></div>' +
    '<div class="hint" id="dm">点按钮，或按 <kbd>空格</kbd></div>' +
    stripHTML() +
    '<div class="sub" id="cm"></div>',
    () => { idleReels(); bindSpinBtn(); });
  renderStatus();
}

function firstUnopened(){
  for (let i = 0; i < deck.length; i++) if (deck[i].by === null) return i;
  return 0;
}

function screenPick(){
  mode = 'pick';
  cur.sel = firstUnopened();
  cur.touched = false;        // 预高亮那张只是倒计时的默认牌，不算有人选过
  stopFx(); clearDrawTimers();
  document.body.classList.add('compact');
  setStage(
    '<div class="phase-tag">' + batchTag(bi) + '</div>' +
    '<div class="big" id="bg">' + pad(cur.num) + ' 号 · 翻一张</div>' +
    '<div class="cd" id="cd"></div>' +
    cardsGridHTML(true) +
    '<div class="sub" id="cm">喊个数字就行　·　不说话也可以，倒计时结束会自动翻</div>',
    () => { markSel(); startCountdown(); });
  renderStatus();
}

function markSel(){
  Array.from($stage.querySelectorAll('.card.pk')).forEach((el, i) =>
    el.classList.toggle('sel', i === cur.sel && deck[i] && deck[i].by === null));
}

function moveSel(d){
  if (mode !== 'pick') return;
  const n = deck.length;
  let i = cur.sel;
  for (let k = 0; k < n; k++){
    i = (i + d + n) % n;
    if (deck[i].by === null) break;
  }
  cur.sel = i;
  cur.touched = true;
  sfx('sel', { gain: 0.45 });
  markSel();
}

/* 点牌 / 按数字都是两段式：第一下只选中（上浮高亮），再点同一张才翻。
   进屏时第 1 张是预高亮的（倒计时归零翻它），但没人动过选择之前点它也只算选中 ——
   永远两下，不用记特例。空格 / Enter / 倒计时归零走 openCard，照旧直接翻高亮那张。 */
function pickCard(i){
  if (mode !== 'pick') return;
  if (i < 0 || i >= deck.length || deck[i].by !== null) return;
  if (cur.touched && i === cur.sel) return openCard(i);
  cur.sel = i;
  cur.touched = true;
  sfx('sel', { gain: 0.5 });
  markSel();
  setSub('选了第 ' + (i + 1) + ' 张　·　再点一次或按 <kbd>空格</kbd> 翻开');
}

function openCard(i){
  if (mode !== 'pick') return;
  const d = deck[i];
  if (!d || d.by === null && !cur.num) return;
  if (!d || d.by !== null) return;
  stopCountdown();
  mode = 'anim';
  d.by = cur.num;
  prizeCount++;
  saveGame();                 // 牌一翻就存，别等演出放完
  const r = rarityOf(d.p);
  const cd = $('cd'); if (cd) cd.innerHTML = '';
  setSub('……');
  playReveal($stage.querySelectorAll('.card.pk')[i], d, r,
    pad(d.by) + ' 号 · 获得 <em>' + esc(d.p.nm) + '</em>',
    remainCount() ? '按 <kbd>空格</kbd> 抽下一位'
                  : '这一批翻完了　按 <kbd>空格</kbd> 看领奖名单');
}

/* 揭晓的那套演出（顺序 2026-10-29 定）：
   牌扣着从原位滑到舞台正中放大（lifting，LIFT_DUR）→ 到位后牌背抖动、辉光按真实品质亮起、背景压暗
   （charging，时长按品质 REVEAL.charge；故意剧透品质，当翻面前的预告）→ 抖到头：彩带 + 翻面
   → 翻到一半正面露出：白闪 + 震屏 + 大字 → 翻完停 SHOW_HOLD → 滑回原位。
   回原位是为了这一屏接着能看见「还剩什么」；展示没放完按空格也能直接走 */
const SHOW_HOLD = 1600, HOME_DUR = 560, LIFT_DUR = 700, FLIP_DUR = 820, FLIP_MID = 380;   // LIFT_DUR ≥ CSS 的 .66s

/* 算这张牌到舞台中心的位移和放大倍率，写进牌自己的 CSS 变量。
   舞台是 overflow:hidden，倍率要保证放大后整张牌还在舞台里，手机上不裁边 */
function aimCenter(el){
  const st = $stage.getBoundingClientRect();
  const r = el.getBoundingClientRect();
  if (!r.width || !r.height) return;
  // 牌阵进屏有 popIn 缩放动画，祖先若还带着缩放，translate 是在缩放空间里走的：
  // 用父元素的「屏幕矩形 / 布局尺寸」算祖先倍率 —— 用牌自己算会把高亮姿态的放大/微转也算进去
  const par = el.parentElement || el;
  const pr = par.getBoundingClientRect();
  const k = par.offsetWidth ? pr.width / par.offsetWidth : 1;
  // 量的时候牌多半还在高亮姿态（抬起 20px）：transform-origin 在中心，矩阵的 e/f 就是中心的位移，扣掉
  let ox = 0, oy = 0;
  try{
    const m = new DOMMatrix(getComputedStyle(el).transform);
    if (m.is2D){ ox = m.e; oy = m.f; }
  }catch(e){}
  const w = el.offsetWidth * k, h = el.offsetHeight * k;      // 静止时在屏幕上的尺寸
  const cx = r.left + r.width / 2 - ox * k;                    // 静止时的中心
  const cy = r.top + r.height / 2 - oy * k;
  const pad = 14;
  const fit = Math.min((st.width - pad * 2) / w, (st.height - pad * 2) / h);
  const zs = Math.max(1, Math.min(1.6, fit));
  const dx = Math.round((st.left + st.width / 2 - cx) / k);
  const dy = Math.round((st.top + st.height / 2 - cy) / k);
  el.style.setProperty('--dx', dx + 'px');
  el.style.setProperty('--dy', dy + 'px');
  el.style.setProperty('--zs', zs.toFixed(3));
  el.style.setProperty('--zsm', (1 + (zs - 1) * .55).toFixed(3));
}

function goHome(el){
  el.classList.remove('showing');
  el.classList.add('homing');
  const t = setTimeout(() => {
    el.classList.remove('homing');
    ['--dx', '--dy', '--zs', '--zsm'].forEach(k => el.style.removeProperty(k));
    sfx('place', { gain: 0.35, rate: 1.1 });     // 卡片入列
    bgmDuck(false);
  }, HOME_DUR + 60);
  drawTimers.push(() => clearTimeout(t));
}

function playReveal(el, d, r, bigHTML, subHTML){
  const T = REVEAL[r] || REVEAL[2];
  if (el){
    const front = el.querySelector('.face.front');
    if (front) front.innerHTML = faceHTML(d.p, d.by);   // 正面先填好，翻过来才有东西；扣着时看不见
    aimCenter(el);                 // 先量（aimCenter 会扣掉高亮姿态的位移），
    el.classList.remove('sel');    // 再在同一拍摘高亮 + 起滑入：过渡从当前姿态直接出发，不先掉回原位
    el.classList.add('lifting');
    sfx('lift', { gain: 0.8 });
  }
  const t0 = setTimeout(() => {                          // 到位：开始抖
    if (el){
      el.classList.remove('lifting');
      if (cfg.tease){                                    // 预告：抖动阶段就按真实品质抖和亮
        el.setAttribute('data-r', String(r));
        const fx = el.querySelector('.fx');
        if (fx) fx.outerHTML = cardFxHTML(r);
      } else el.classList.add('plain');                  // 不预告：中性暖白光，品质留到翻面那一刻
      el.classList.add('charging');
    }
    document.documentElement.style.setProperty('--chargeDur', T.charge + 'ms');
    sfxRumble(T.charge / 1000);
    sfxRiser(T.charge / 1000);
    bgmDuck(true, r >= 5);           // 大奖那一下音乐让到零
    const vig = $('vig');
    if (vig){ vig.classList.remove('on'); void vig.offsetWidth; vig.classList.add('on'); }

    const t1 = setTimeout(() => {                        // 抖到头：彩带 + 翻面
      if (el){
        el.classList.remove('charging', 'plain'); el.classList.add('showing');
        if (!cfg.tease){
          el.setAttribute('data-r', String(r));
          const fx = el.querySelector('.fx');
          if (fx) fx.outerHTML = cardFxHTML(r);
        }
        void el.offsetWidth;
        el.classList.add('flipped');
        startConfetti(el, T.conf);
        sfx('flip');
        sfxThump(r >= 5 ? 1 : r >= 3 ? 0.8 : 0.55);
        sfxPopper();
      }
      if (vig) vig.classList.remove('on');

      const t2 = setTimeout(() => {                      // 翻到一半，正面露出来
        if (T.flash){
          const f = $('flash');
          f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
        }
        if (T.shake){
          const g = $('game');
          g.classList.remove('shk','shk-lite'); void g.offsetWidth; g.classList.add(T.shake);
          const t3 = setTimeout(() => g.classList.remove('shk','shk-lite'), 460);
          drawTimers.push(() => clearTimeout(t3));
        }
        sfx(r >= 5 ? 'hit5' : r >= 3 ? 'hit3' : 'hit1');
        setBig(bigHTML);
        setSub(subHTML);
        mode = 'reveal';
        renderStatus();
        saveGame();
      }, FLIP_MID);
      drawTimers.push(() => clearTimeout(t2));

      if (el){
        const t4 = setTimeout(() => goHome(el), FLIP_DUR + SHOW_HOLD);
        drawTimers.push(() => clearTimeout(t4));
      }
    }, T.charge);
    drawTimers.push(() => clearTimeout(t1));
  }, LIFT_DUR);
  drawTimers.push(() => clearTimeout(t0));
}

/* ---------- 单件批次：牌扣着，只等号码 ----------
   不洗不编号（就一张），但也不亮相：大字只说「全场最大的奖」，是什么要翻开才知道。
   抽到号 → 空格 → 翻过来 → 走和普通牌一样的揭晓演出 */
function screenSolo(){
  mode = 'prize';
  cur = { num: 0, sel: 0 };
  stopFx(); clearDrawTimers(); stopCountdown();
  document.body.classList.add('compact');
  setStage(
    '<div class="phase-tag">' + batchTag(bi) + '</div>' +
    '<div class="big" id="bg">' +
      (bi === batches.length - 1 ? '全场最大的奖' : '这一批就这一件') + '</div>' +
    // 奖品和滚轮并排：竖着摞会把标题和按钮挤出屏幕，横向空间反而一直空着
    '<div class="soloRow">' +
      '<div id="cards" class="pGrid solo" style="--cols:1">' +
        '<div class="card pk" data-r="1" data-i="0">' +     // 扣着时和普通牌一样一档辉光，翻开再升
          cardFxHTML(1) +
          '<div class="inner">' +
            '<div class="face front"></div>' +
            '<div class="face back"><div class="num"></div></div>' +
          '</div></div>' +
      '</div>' +
      '<div class="soloSlot">' + slotHTML() +
        '<div class="spinHold" id="spinHold">' +
          '<button class="spinBtn" id="spinBtn">抽 号</button></div>' +
      '</div>' +
    '</div>' +
    '<div class="hint" id="dm">点按钮，或按 <kbd>空格</kbd></div>' +
    '<div class="sub" id="cm"></div>',
    () => { idleReels(); bindSpinBtn(); });
  renderStatus();
  saveGame();
}

function soloReveal(){
  const d = deck[0];
  if (!d || d.by !== null) return;
  mode = 'anim';
  d.by = cur.num;
  prizeCount++;
  saveGame();
  const r = rarityOf(d.p);
  const el = $stage.querySelector('.card.pk');
  setSub('……');
  playReveal(el, d, r,
    pad(d.by) + ' 号 · 获得 <em>' + esc(d.p.nm) + '</em>',
    '按 <kbd>空格</kbd> 继续');
}

/* ---------- 倒计时 ---------- */
let cdTimer = 0, cdLeft = 0;
function stopCountdown(){ if (cdTimer){ clearInterval(cdTimer); cdTimer = 0; } }
function paintCd(){
  const e = $('cd');
  if (e) e.innerHTML = '<span class="cdN' + (cdLeft <= 5 ? ' urge' : '') + '">' + cdLeft + '</span>';
}
function startCountdown(){
  stopCountdown();
  cdLeft = Math.max(0, Math.round(+cfg.pickSeconds) || 0);
  const e = $('cd');
  if (!cdLeft){ if (e) e.innerHTML = ''; return; }
  paintCd();
  cdTimer = setInterval(() => {
    cdLeft--;
    paintCd();
    if (cdLeft > 0 && cdLeft <= 5) sfx('cd', { gain: 0.6, rate: cdLeft <= 2 ? 1.25 : 1 });
    if (cdLeft <= 0){
      stopCountdown();
      if (mode === 'pick') openCard(cur.sel);
    }
  }, 1000);
  drawTimers.push(stopCountdown);
}

/* ---------- 批次结算 = 领奖清单 ---------- */
function screenBatchDone(){
  mode = 'batchDone';
  stopFx(); clearDrawTimers(); stopCountdown();
  sfx('claim', { when: 0.2 });
  document.body.classList.remove('compact');
  setStage(
    '<div class="phase-tag">' + batchTag(bi) + '</div>' +
    '<div class="big" id="bg">这一批发完了 · 请以下几位领奖</div>' +
    '<div id="claim">' + deck.map(d =>
      '<div class="cw' + (d.p.star ? ' st' : '') + '">' +
        '<span class="cn">' + pad(d.by) + '</span>' +
        '<span class="ci">' + itemHTML(d.p) + '</span>' +
        '<span class="cm2">' + esc(d.p.nm) + '</span></div>').join('') + '</div>' +
    '<div class="sub" id="cm">' +
      (bi + 1 < batches.length ? '按 <kbd>空格</kbd> 进入下一批' : '按 <kbd>空格</kbd> 结束') +
    '</div>');
  renderStatus();
  saveGame();
}

function screenDone(){
  mode = 'done';
  stopFx(); clearDrawTimers(); stopCountdown();
  sfx('done', { when: 0.2 });
  document.body.classList.remove('compact');
  setStage(
    '<div class="big" id="bg">全部发放完毕</div>' +
    '<div class="sub" id="cm">' + prizeCount + ' 位拿到奖品</div>' +
    '<div class="hint">按 <kbd>R</kbd> 重开全场</div>');
  renderStatus();
  clearSave();
}

function renderStatus(){
  const bits = [];
  if (batches.length) bits.push(batchTag(bi) + ' / 共 ' + batches.length + ' 批');
  if (deck.length) bits.push('本批剩 ' + remainCount() + ' 件');
  bits.push('已中奖 ' + prizeCount);
  bits.push('号码池 ' + Math.max(0, cfg.guests - (drawnNums ? drawnNums.size : 0)));
  if (cfg.mute) bits.push('\u{1F507} 静音');
  $status.innerHTML = bits.join(' 　 ');
}

function slotHTML(){
  const cells = [];
  for (let c = 0; c < 16; c++)
    for (let d = 0; d < 10; d++) cells.push('<div class="rcell">' + d + '</div>');
  const strip = cells.join('');
  return '<div id="slot">' +
    '<div id="digits">' +
      [0,1,2].map(()=>'<div class="reel"><div class="rstrip">' + strip + '</div></div>').join('') +
      '<div class="payline"></div>' +
    '</div>' +
  '</div>';
}
let spinArmed = false;      // 按下压缩、松开弹起，弹起那一下才开始转
function bindSpinBtn(){
  const b = $('spinBtn');
  if (!b) return;
  spinArmed = false;
  b.addEventListener('pointerdown', e => { e.preventDefault(); pressSpin(); });
  b.addEventListener('pointerup',    e => { e.preventDefault(); releaseSpin(); });
  b.addEventListener('pointerleave', () => {                    // 手指滑走就取消
    if (spinArmed){ spinArmed = false; b.classList.remove('press'); }
  });
}
function pressSpin(){
  if (mode !== 'prize' || spinArmed) return;
  const b = $('spinBtn');
  if (!b) return;
  spinArmed = true;
  b.classList.remove('bounce');
  b.classList.add('press');
}
function releaseSpin(){
  if (mode !== 'prize' || !spinArmed) return;
  const b = $('spinBtn'), hold = $('spinHold');
  spinArmed = false;
  if (!b) return screenDraw();
  b.classList.remove('press');
  void b.offsetWidth;
  b.classList.add('bounce');
  if (hold) hold.classList.add('dead');
  const t = setTimeout(screenDraw, 190);      // 弹到最高点时开转
  drawTimers.push(() => clearTimeout(t));
}
function doSpin(){
  if (mode !== 'prize') return;
  pressSpin();
  const t = setTimeout(releaseSpin, 130);
  drawTimers.push(() => clearTimeout(t));
}
function idleReels(){
  const box = $('digits');
  if (!box) return;
  const cell = Math.max(24, Math.round(box.getBoundingClientRect().height / 3));
  box.style.setProperty('--cell', cell + 'px');
  Array.from(box.querySelectorAll('.rstrip')).forEach(st => {
    const k = 20 + Math.floor(Math.random() * 10);
    st.style.transition = 'none';
    st.style.transform = 'translateY(' + (-(k - 1) * cell) + 'px)';
  });
}
/* ---------- 抽号 ----------
   同一台老虎机，三种节奏（drawTempo）：
     完整 —— 每批第一位、本批最后一位：三个滚轮依次刹停，约 3.8 秒
     快停 —— 中间的人：三轮几乎同时刹车，约 1.7 秒
     压轴 —— 最后一批：最慢，约 5.2 秒
   滚动中再按一次推进键（空格 / 翻页笔 / 点画面）= 剩下的滚轮立刻依次刹停（brakeNow）。
   起立坐下的梗去掉了（现场玩不起来）：前两轮停下不出字，第三轮停稳才报号。 */
let brakeFn = null;                     // 只在滚动中有效，滚完即清

function drawTempo(){
  if (isLastBatch()) return { first:650, gap:1500, brake:1500, turns:2 };
  const n = remainCount();
  if (n === deck.length || n === 1) return { first:650, gap:1000, brake:1150, turns:2 };
  return { first:500, gap:200, brake:800, turns:1 };
}

function brakeNow(){ if (brakeFn) brakeFn(); }

function screenDraw(){
  mode = 'drawing';
  stopFx();
  clearDrawTimers();
  brakeFn = null;
  const pool = [];
  for (let i=1; i<=cfg.guests; i++) if (!drawnNums.has(i)) pool.push(i);
  if (!pool.length) return screenDone();

  const num = pool[Math.floor(Math.random()*pool.length)];
  cur.num = num; drawnNums.add(num);
  const str = pad(num);

  // 复用抽号那一屏已经在场上的老虎机，不重建 DOM
  const box = $('digits');
  if (!box) return isSolo() ? screenSolo() : screenSpin();   // 滚轮还没搭好，先把那一屏铺出来
  const reels = Array.from(box.querySelectorAll('.reel'));
  const strips = reels.map(r => r.querySelector('.rstrip'));
  reels.forEach(r => r.classList.remove('locked'));
  strips.forEach(st => {
    st.style.transition = 'none'; st.classList.add('fast');
    const h = st.querySelector('.rcell.hit');
    if (h) h.classList.remove('hit');
  });
  const dm0 = $('dm'); if (dm0) dm0.textContent = '滚动中…';
  sfx('lever');
  let lastTick = 0;
  renderStatus();

  const cell = Math.max(24, Math.round(box.getBoundingClientRect().height / 3));
  box.style.setProperty('--cell', cell + 'px');

  const LOOP = cell * 10;                             // 一圈的像素高度
  const ys = strips.map(st => {
    const m = /translateY\((-?[\d.]+)px\)/.exec(st.style.transform || '');
    return m ? parseFloat(m[1]) : 0;
  });
  const spinning = [true, true, true];
  const SPEED = cell * 0.62;                          // 每帧滚动距离

  // 让第 k 格停在中间：y = -(k-1)*cell，居中的那一格下标就是 k
  function targetY(cy, digit, minTurns){
    const curK = (-cy / cell) + 1;
    let k = Math.ceil(curK) + minTurns * 10;
    k += ((digit - (k % 10)) + 10) % 10;
    return { y: -(k - 1) * cell, k: k };
  }

  let spinRaf = 0;
  function tick(){
    for (let i = 0; i < 3; i++){
      if (!spinning[i]) continue;
      ys[i] -= SPEED;
      if (ys[i] <= -LOOP) ys[i] += LOOP;              // 无缝绕回
      strips[i].style.transform = 'translateY(' + ys[i] + 'px)';
    }
    const nowT = performance.now();                 // 滚轮滴答：约 18 下/秒，像一台真的在转的机器
    if (nowT - lastTick > 55){ lastTick = nowT; sfx('tick', { gain: 0.35, rate: 1.1 + Math.random() * 0.1 }); }
    if (spinning.some(Boolean)) spinRaf = requestAnimationFrame(tick);
  }
  spinRaf = requestAnimationFrame(tick);
  drawTimers.push(() => cancelAnimationFrame(spinRaf));

  const tempo = drawTempo();
  const t0 = Date.now();
  const state = [0, 0, 0];                            // 0 转着 / 1 刹车中 / 2 停稳
  const doneT = [0, 0, 0], tgtK = [0, 0, 0];
  let doneN = 0;
  const pend = [];                                    // 还没执行的「停第 i 轮」

  function settle(i){
    state[i] = 2;
    reels[i].classList.add('locked');
    sfx('stop', { gain: 0.8, rate: 1 + i * 0.06 });
    const hit = strips[i].children[tgtK[i]];
    if (hit) hit.classList.add('hit');
    if (++doneN === 3){                               // 三轮都停稳才报号（刹停时先后可能交错）
      brakeFn = null;
      mode = 'drawn';
      sfx('ding', { when: 0.05 });
      const dm = $('dm');
      if (dm) dm.innerHTML = '请 <b style="color:var(--gold)">' + str + '</b> 号的朋友站起来';
    }
  }

  function stopReel(i, brake, turns){
    if (state[i] === 2) return;
    const st = strips[i];
    const ease = 'transform ' + brake + 'ms cubic-bezier(.16,.86,.27,1)';
    if (state[i] === 1){                              // 已在慢刹：换短刹，目标不变
      clearTimeout(doneT[i]);                         // （抖 0.01px 让过渡从当前位置重新起算）
      st.style.transition = ease;
      st.style.transform = 'translateY(' + (ys[i] + 0.01) + 'px)';
    } else {
      state[i] = 1; spinning[i] = false;
      const tgt = targetY(ys[i], +str[i], turns);
      tgtK[i] = tgt.k; ys[i] = tgt.y;
      st.classList.remove('fast');
      st.style.transition = ease;
      st.style.transform = 'translateY(' + tgt.y + 'px)';
    }
    doneT[i] = setTimeout(() => settle(i), brake);
    const id = doneT[i];
    drawTimers.push(() => clearTimeout(id));
  }

  [0,1,2].forEach(i => {
    const t = setTimeout(() => stopReel(i, tempo.brake, tempo.turns), tempo.first + i * tempo.gap);
    pend.push(t);
    drawTimers.push(() => clearTimeout(t));
  });

  // 主持人油门：没停稳的滚轮按顺序立刻刹停（在慢刹的也换成短刹）。刚开转那一下（<450ms）不认，防手抖连按。
  brakeFn = () => {
    if (mode !== 'drawing' || Date.now() - t0 < 450) return;
    pend.forEach(clearTimeout);
    let k = 0;
    for (let i = 0; i < 3; i++){
      if (state[i] === 2) continue;
      const d = (k++) * 120;
      if (!d){ stopReel(i, 450, 1); continue; }
      const t = setTimeout(() => stopReel(i, 450, 1), d);
      drawTimers.push(() => clearTimeout(t));
    }
    brakeFn = null;
  };
}

let raf2 = 0;
function clearVig(){
  const v = $('vig');
  if (v) v.classList.remove('on');
}
function stopFx(){
  clearVig();
  cancelAnimationFrame(raf2); raf2 = 0;
  const cv = document.getElementById('fx');
  if (cv && cv.width) cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
}
function startConfetti(originEl, intensity){
  stopFx();
  const cv = document.getElementById('fx');
  if (!cv || !originEl) return;

  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = window.innerWidth, H = window.innerHeight;
  cv.width  = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);

  const r = originEl.getBoundingClientRect();
  const ox = r.left + r.width / 2;
  const oy = r.top + r.height / 2;
  const RW = r.width;

  const COLORS = ['#ffd54a','#e0533f','#5aa84f','#4a8ce0','#f2f0ff','#ff9ad5'];
  const CANNONS = [-118, -62];        // 左上、右上，比之前更竖直
  const SPREAD  = 20;                 // 张角收窄
  const ps = [];

  function make(o){
    return Object.assign({
      w: 5 + Math.random() * 7,
      h: 9 + Math.random() * 11,
      rz: Math.random() * Math.PI * 2,               // 平面内旋转
      vrz: (Math.random() - 0.5) * 0.26,
      rx: Math.random() * Math.PI * 2,               // 翻面相位
      vrx: 0.06 + Math.random() * 0.16,              // 每片翻面快慢不同
      drag: 0.975 + Math.random() * 0.02,            // 空气阻力
      term: 1.6 + Math.random() * 3.4,               // 终端速度 —— 飘落快慢随机
      flut: 0.5 + Math.random() * 1.6,               // 翻面带来的横向摆幅
      col: COLORS[(Math.random() * COLORS.length) | 0],
      life: 1, decay: 0.0025 + Math.random() * 0.0035
    }, o);
  }

  // 一、两门礼炮：力度收小，让彩带在卡片附近升起再落下
  const nBurst = Math.round(90 * intensity);
  for (let i = 0; i < nBurst; i++){
    const ang = (CANNONS[i % 2] + (Math.random() - 0.5) * SPREAD) * Math.PI / 180;
    const sp = (4.5 + Math.random() * 6.5) * intensity;
    const d0 = Math.random() * 10;
    ps.push(make({
      x: ox + Math.cos(ang) * d0,
      y: oy + Math.sin(ang) * d0,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp
    }));
  }

  // 二、飘落层：在奖品上方铺开，慢慢从正面划过
  const nDrift = Math.round(34 * intensity);
  for (let i = 0; i < nDrift; i++){
    ps.push(make({
      x: ox + (Math.random() - 0.5) * RW * 2.1,
      y: oy - RW * (0.7 + Math.random() * 1.3),
      vx: (Math.random() - 0.5) * 1.6,
      vy: 0.3 + Math.random() * 1.4,
      decay: 0.0018 + Math.random() * 0.0022
    }));
  }

  const G = 0.22;
  let t = 0;
  function fr(){
    t += 1 / 60;
    g.clearRect(0, 0, W, H);
    let alive = 0;
    for (const p of ps){
      p.vy += G;
      if (p.vy > p.term) p.vy += (p.term - p.vy) * 0.12;   // 逼近终端速度
      p.vx *= p.drag;
      p.rx += p.vrx;
      p.rz += p.vrz;
      p.x += p.vx + Math.sin(p.rx) * p.flut;               // 翻面时左右打滑
      p.y += p.vy;
      if (t > 1.1) p.life -= p.decay;
      if (p.life <= 0 || p.y > H + 40) continue;
      alive++;
      const flip = Math.cos(p.rx);                          // 翻面：厚度方向的投影
      g.save();
      g.globalAlpha = Math.max(0, Math.min(1, p.life));
      g.translate(p.x, p.y);
      g.rotate(p.rz);
      g.scale(1, Math.abs(flip) * 0.9 + 0.1);
      g.fillStyle = p.col;
      g.globalAlpha *= (0.62 + Math.abs(flip) * 0.38);      // 侧面偏暗，像真纸片
      g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      g.restore();
    }
    if (!alive){ stopFx(); return; }
    raf2 = requestAnimationFrame(fr);
  }
  raf2 = requestAnimationFrame(fr);
}

/* ================= 进度保存与恢复 ================= */
function cfgFingerprint(){
  return cfg.guests + '|' + cfg.prizes.map(p => p.batch + ':' + p.nm).join('|');
}

function saveGame(){
  if (!gameStarted || !batches.length) return;
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      fp: cfgFingerprint(),
      ts: Date.now(),
      bi: bi,
      // 牌存成「在本批 items 里的下标」，避免把图片的 base64 再存一遍
      deck: deck.map(d => [batches[bi].items.indexOf(d.p), d.by]),
      drawn: Array.from(drawnNums),
      prizeCount: prizeCount,
      breakDone: breakDone,
      mode: (mode === 'intro' ? 'intro' : 'play'),
    }));
  }catch(e){ /* 隐私模式或容量满，放弃保存即可 */ }
}

function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || s.fp !== cfgFingerprint()) return null;
    if (!s.drawn || !s.drawn.length) return null;        // 还没抽过，没必要恢复
    return s;
  }catch(e){ return null; }
}

function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

function restoreGame(s){
  batches = groupBatches(cfg.prizes);
  bi = Math.max(0, Math.min(batches.length - 1, +s.bi || 0));
  const items = batches[bi].items;
  deck = (s.deck || []).map(x => ({ p: items[x[0]], by: x[1] })).filter(d => d.p);
  drawnNums = new Set(s.drawn || []);
  prizeCount = s.prizeCount || 0;
  breakDone = s.breakDone || {};
  autoBreak = false;
  gameStarted = true;
  cur = null;
  $('game').classList.remove('hide');
  if (!deck.length || s.mode === 'intro') return enterBatch();
  if (remainCount() === 0) return screenBatchDone();
  if (isSolo()) return screenSolo();
  screenSpin();
}

      (kind === 'local'
        ? '<input class="inp bsrc" value="' + esc(c.file || '') + '" data-bc="' + i +
          '|file" placeholder="intro.mp4">'
        : '<input class="inp bsrc" value="' + esc(c.vid || '') + '" data-bc="' + i +
          '|vid" placeholder="BV1xxxxxxxxx">') +
      '<button class="btn mini danger" data-act="delclip" data-ci="' + i + '">\u00d7</button>' +
    '</div>';
  }).join('');

  return '<div class="sec"><h3>休息页　<span class="h3s">按 B 随时切换，抽奖进度不受影响</span></h3>' +
    '<div class="fld" style="margin-bottom:11px"><label>待机文字</label>' +
      '<input class="inp" data-brk="text" value="' + esc(b.text) + '" style="max-width:240px"></div>' +
    (rows ? '<div class="prowHead"><span class="c2">名称</span><span class="c4">来源</span>' +
              '<span class="c2">文件名 / 视频 ID</span><span class="c6"></span></div>' + rows : '') +
    '<div class="prowFoot">' +
      '<button class="btn" data-act="addclip">+ 添加视频</button>' +
      '<span class="sp"></span>' +
      '<button class="btn" data-act="brkfull">预览休息页</button>' +
    '</div>' +
    '<div class="tip2">本地视频放在和本页面同一个文件夹，建议 mp4（H.264）。' +
      'B 站填 BV 号、优酷填分享链接里的 ID，<b>需要联网</b>。<br>' +
      '两块大屏用复制模式时，这里全屏播放就等于在每块屏上同时播放。</div>' +
  '</div>';
}

/* ================= 输入 ================= */
function act(name){
  if (name === 'mute'){ cfg.mute = !cfg.mute; saveCfg(); sfxApplyVolume(); bgmApply(false); renderStatus(); return; }
  if (name === 'break'){ toggleBreak(); return; }
  if (name === 'rules'){ toggleRule(); return; }
  if (name === 'settings'){ toggleEditor(); return; }
  if (name === 'restart'){
    if (confirm('重开全场？当前进度会清空。')){ clearSave(); startGame(); }
    return;
  }
  if (name === 'left')  return moveSel(-1);
  if (name === 'right') return moveSel(1);
  if (name === 'redraw'){                       // 人不在场：原号作废，重抽
    if (mode === 'drawn' || mode === 'pick'){ stopCountdown(); screenDraw(); }
    return;
  }
  if (name === 'advance' || name === 'decide'){
    if (mode === 'intro')     return doShuffle();
    if (mode === 'prize')     return pressSpin(), releaseSpin();
    if (mode === 'drawing')   return brakeNow();
    if (mode === 'drawn')     return isSolo() ? soloReveal() : screenPick();
    if (mode === 'pick')      return openCard(cur.sel);
    if (mode === 'reveal')    return nextPick();
    if (mode === 'batchDone') return nextBatch();
  }
}

/* 遥控笔（翻页笔）本质是个 HID 键盘，按 PowerPoint 的约定发键：
   下一页=PageDown、上一页=PageUp、黑屏=B、开始/结束放映=F5/Esc。
   所以 PageDown/PageUp 要认，F5 要吞掉（否则整页重载），
   Esc 不能再开编辑器 —— 它既是遥控笔的「结束放映」，也是浏览器退出全屏的键。 */
const KEYS = { ArrowLeft:'left', ArrowRight:'right', PageUp:'left', PageDown:'advance',
               KeyD:'redraw', KeyB:'break', KeyH:'rules', KeyM:'mute',
               Space:'advance', Enter:'decide', KeyR:'restart' };
const THROTTLED = { advance:1, decide:1 };   // 遥控笔长按会连发，推进类要节流
let lastKeyAct = 0;

addEventListener('keydown', e => {
  sfxUnlock();
  if (e.code === 'F5'){ e.preventDefault(); return; }     // 遥控笔的「开始放映」，别让它重载
  if (e.code === 'Escape'){                               // 只关不开
    e.preventDefault();
    if (cloudLayerOpen()){ closeCloudLayer(); return; }    // 先关版本弹层，编辑器留着
    if (editorOpen) backToGame(false);
    return;
  }
  if (e.code === 'KeyE' && (e.ctrlKey || e.metaKey)){      // 键盘开编辑器的入口
    e.preventDefault(); toggleEditor(); return;
  }
  if (editorOpen) return;
  const dg = /^Digit([1-9])$/.exec(e.code);
  if (dg && mode === 'pick'){ e.preventDefault(); pickCard(+dg[1] - 1); return; }
  if (ruleOpen() && e.code !== 'KeyH') return;
  if (breakOpen() && e.code !== 'KeyB') return;
  if (!$('resumeLayer').classList.contains('hide')) return;
  const a = KEYS[e.code];
  if (!a) return;
  e.preventDefault();
  if (THROTTLED[a]){
    const now = Date.now();
    if (now - lastKeyAct < 350) return;
    lastKeyAct = now;
  }
  act(a);
});

let lastBtn = 0;
function onBtn(e){
  sfxUnlock();
  const b = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if (!b) return;
  const now = Date.now();
  if (now - lastBtn < 400) return;
  lastBtn = now;
  act(b.dataset.act);
}
$('foot').addEventListener('click', onBtn);
$('foot').addEventListener('touchend', onBtn, { passive:true });

/* 挂在 #game 上而不是 window：iOS WebKit（Safari / 微信内置）对挂在 window、document、body
   上的 click 委托有老规矩 —— 点到 div 这类"非交互元素"时可能根本不派发 click。
   挂在普通祖先 div 上就没这事。#game 只包 #stage 和 #foot，齿轮、编辑器、三个弹层都在外面。 */
let lastTap = 0, lastCardTap = 0;
$('game').addEventListener('click', e => {
  sfxUnlock();
  if (editorOpen) return;
  if (ruleOpen() || breakOpen()) return;
  if (!$('resumeLayer').classList.contains('hide')) return;
  const t = e.target;
  // 这几层自己有点击处理；它们会先把自己关掉，事件再冒泡到这里就会多推进一步流程
  if (t && t.closest && (t.closest('#foot') || t.closest('#editor') || t.closest('#gear') ||
      t.closest('#resumeLayer') || t.closest('#breakLayer') || t.closest('#ruleLayer'))) return;
  const now = Date.now();
  if (mode === 'pick' && t && t.closest && t.closest('#cards')){
    // 牌走自己的节流：400ms 会把「点选 → 再点翻开」的第二下吞掉，
    // 这里只防触摸设备把一次点按发成两个事件
    const card = t.closest('.card.pk');
    if (!card) return;                   // 手机上牌小，戳到缝隙不能当成「翻高亮那张」
    if (now - lastCardTap < 120) return;
    lastCardTap = now;
    const i = +card.dataset.i;
    if (!isNaN(i)) pickCard(i);
    return;
  }
  if (now - lastTap < 400) return;
  lastTap = now;
  if (t && t.closest && t.closest('#spinHold')) return;   // 抽号按钮自己有处理
  act('advance');
});

/* ================= 编辑器 ================= */
let imgTarget = null;

/* 编辑器是从右边滑进来的抽屉，游戏画面留在后面不动。
   开着的时候要把倒计时停掉，否则会在你改配置的时候自动翻牌。

   开合状态必须自己记，不能拿 .open 这个类当真相：类是为了跑过渡才加的，
   曾经用 rAF 延后加，结果「还没加上就再按一次」会变成开第二次，
   随后补上的 .open 没人来摘，键盘守卫就把整局卡死。 */
let editorOpen = false;
function showEditor(){
  if (editorOpen) return;
  editorOpen = true;
  stopCountdown();
  const ed = $('editor');
  ed.classList.remove('hide');
  renderEditor();
  void ed.offsetWidth;                        // 强制重排，过渡照样跑，但不依赖 rAF
  ed.classList.add('open');
  document.body.classList.add('edOpen');      // 抽屉比齿轮宽，开着时让齿轮退场
}
function backToGame(restart){
  closeCloudLayer();
  if (!editorOpen){
    if (restart){ clearSave(); startGame(); }
    return;
  }
  editorOpen = false;
  $('editor').classList.remove('open');
  document.body.classList.remove('edOpen');
  if (restart || !gameStarted){ clearSave(); startGame(); }
  else if (mode === 'pick') startCountdown();      // 没重开就把倒计时接回去
}
function toggleEditor(){
  if (editorOpen) backToGame(false);
  else showEditor();
}

function maxBatch(){
  return cfg.prizes.reduce((m, p) => Math.max(m, +p.batch || 1), 1);
}

function editorIssues(){
  const out = [];
  const bs = groupBatches(cfg.prizes);
  if (!bs.length) out.push('还没有奖品');
  bs.forEach((b, k) => {
    const last = k === bs.length - 1;
    if (b.items.length > 6) out.push('第 ' + b.no + ' 批有 ' + b.items.length + ' 件，超过 6 件屏幕会挤');
    // 最后一批常常就是大奖单独一件，那是刻意的；中间的批次太少才叫没悬念
    if (b.items.length < 2 && !last) out.push('第 ' + b.no + ' 批只有 ' + b.items.length + ' 件，没有悬念');
    if (!b.star) out.push('第 ' + b.no + ' 批没有标镇批之宝');
  });
  const need = bs.reduce((a, b) => a + b.items.length, 0);
  if (need > cfg.guests) out.push('奖品比人还多（' + need + ' > ' + cfg.guests + '）');
  return out;
}
